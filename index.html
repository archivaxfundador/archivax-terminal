<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ARCHIVAX V10 FIX</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#0f0;font-family:monospace;overflow:hidden}
#video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#000}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2}
#uiTop{position:fixed;top:0;left:0;width:100%;z-index:10;display:flex;gap:4px;padding:5px;background:rgba(0,0,0,.9)}
.btn{flex:1;padding:10px;border:1px solid #0f0;background:#000;color:#0f0;font-size:11px;font-weight:bold}
.btn-main{background:#0f0;color:#000}
#status{position:fixed;top:48px;left:0;width:100%;z-index:10;text-align:center;padding:5px;font-size:11px;background:rgba(0,0,0,.9);transition:.2s}
#status.alert{background:yellow;color:red;font-weight:bold;font-size:13px}
#controls{position:fixed;bottom:58px;left:0;width:100%;z-index:10;background:rgba(0,0,0,.9);padding:6px;display:flex;gap:8px;align-items:center;border-top:1px solid #333}
input[type=range]{flex:1;accent-color:#0f0}
#uiBottom{position:fixed;bottom:0;left:0;width:100%;z-index:10;display:flex;gap:4px;padding:5px;background:#000;border-top:2px solid #0f0}
#payWall{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}
#payWall.show{display:flex}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="uiTop">
<button id="subBtn" class="btn btn-main">★ $5999/mes</button>
<button id="camBtn" class="btn">CAM ↺</button>
<button id="zoomOut" class="btn" style="flex:0.4">ZOOM -</button>
<button id="zoomIn" class="btn" style="flex:0.4">ZOOM +</button>
</div>

<div id="status">TOCÁ PARA INICIAR</div>

<div id="controls">
<span style="font-size:10px">VOL EVP</span>
<input id="volSlider" type="range" min="0" max="100" value="70">
<span id="volLabel" style="font-size:10px">70%</span>
<span style="font-size:10px;margin-left:6px">SENS</span>
<input id="sensSlider" type="range" min="10" max="100" value="40">
</div>

<div id="uiBottom">
<button id="evpBtn" class="btn" style="color:yellow;border-color:yellow">📻 SPIRIT BOX OFF</button>
<button id="photoBtn" class="btn">📸 FOTO</button>
<button id="recBtn" class="btn" style="color:red;border-color:red">● REC</button>
</div>

<div id="payWall">
<h2 style="color:#0f0">40 MIN TERMINADOS</h2>
<div style="font-size:32px;color:#0f0;margin:10px;font-weight:900">$5999/mes</div>
<button id="goPremium" class="btn btn-main" style="padding:18px;width:100%">DESBLOQUEAR PREMIUM</button>
<button id="closePay" style="margin-top:15px;background:none;border:none;color:#666">Cerrar</button>
</div>

<audio id="evp1" preload="auto" src="https://cdn.freesound.org/previews/72/72005_1022651-lq.mp3" crossorigin="anonymous"></audio>
<audio id="evp2" preload="auto" src="https://cdn.freesound.org/previews/193/193941_2694105-lq.mp3" crossorigin="anonymous"></audio>
<audio id="evp3" preload="auto" src="https://cdn.freesound.org/previews/368/368757_6687700-lq.mp3" crossorigin="anonymous"></audio>

<script>
const SUPABASE_URL="https://yxfzvogiladjupikgqyt.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_a1vTW1SY3abxVyn2qFDNlA_K_n3xgOc";
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');
let W,H,facing='environment',stream=null,pose=null,isStarted=false,track=null,zoom=1;
let audioCtx=null,filter=null,gainNode=null,whiteNode=null,sweepTimer=null,voiceTimer=null,evpOn=false;
let noPersonCounter=0,ghost=null,lastRealPose=0;
let evpAudios=[];
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight} resize(); addEventListener('resize',resize);

function checkAccess(){
  if(localStorage.getItem('archivax_premium')==='true'){ document.getElementById('payWall').classList.remove('show'); return true; }
  const blocked=parseInt(localStorage.getItem('archivax_blocked_until')||'0');
  if(Date.now()<blocked){ document.getElementById('payWall').classList.add('show'); return false; }
  let start=parseInt(localStorage.getItem('archivax_start')||'0'); if(!start){ start=Date.now(); localStorage.setItem('archivax_start',start); }
  if(Date.now()-start>40*60*1000){ localStorage.setItem('archivax_blocked_until',Date.now()+24*60*60*1000); localStorage.removeItem('archivax_start'); document.getElementById('payWall').classList.add('show'); return false; }
  return true;
}
function stopCamera(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

async function startCamera(){
  if(!checkAccess()) return; if(isStarted) return; isStarted=true; stopCamera();
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:640},height:{ideal:480}},audio:true});
    video.srcObject=stream; await video.play(); track=stream.getVideoTracks()[0];
    video.style.transform=facing==='user'?'scaleX(-1)':'none';
    await initPose();
  }catch(e){ isStarted=false; statusEl.textContent='Error cámara: '+e.name; }
}

async function initPose(){
  pose=new Pose({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/${f}`});
  pose.setOptions({modelComplexity:0,smoothLandmarks:true,minDetectionConfidence:0.4,minTrackingConfidence:0.4});
  pose.onResults(onResults);
  async function loop(){ if(video.readyState>=2 && pose){ await pose.send({image:video}); } if(stream) requestAnimationFrame(loop); }
  loop();
}

function drawSkeleton(lm,color='#00FF00',joint='#FFFF00',alpha=1){
  const pairs=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
  ctx.save(); ctx.globalAlpha=alpha; ctx.lineWidth=5; ctx.lineCap='round'; ctx.strokeStyle=color; ctx.shadowColor=color; ctx.shadowBlur=15;
  pairs.forEach(([a,b])=>{
    const p1=lm[a],p2=lm[b];
    if(p1&&p2&&p1.visibility>0.2&&p2.visibility>0.2){ ctx.beginPath(); ctx.moveTo(p1.x*W,p1.y*H); ctx.lineTo(p2.x*W,p2.y*H); ctx.stroke(); }
  });
  lm.forEach((p,i)=>{ if(p.visibility>0.3){ ctx.fillStyle=i==0?'#FF0000':joint; ctx.beginPath(); ctx.arc(p.x*W,p.y*H,i==0?10:6,0,Math.PI*2); ctx.fill(); } });
  ctx.restore();
}

// FIX PRINCIPAL - NO SE TRABA MAS
function onResults(res){
  ctx.clearRect(0,0,W,H);
  const sens=parseInt(document.getElementById('sensSlider').value)/100;

  if(res.poseLandmarks && res.poseLandmarks.length>0){
    // HAY PERSONA REAL
    noPersonCounter=0;
    lastRealPose=Date.now();
    ghost=null; // borra fantasma si aparece persona real
    drawSkeleton(res.poseLandmarks,'#00FF00','#FFFF00',1);

    if(!evpOn){ // solo si EVP apagado, si no deja el texto del EVP
      statusEl.textContent='✓ PERSONA REAL DETECTADA - SLS';
      statusEl.classList.remove('alert');
      statusEl.style.color='#0f0';
    }
  } else {
    // NO HAY PERSONA - CONTAR TIEMPO
    noPersonCounter++;

    // Si hay fantasma activo, dibujarlo y restar vida
    if(ghost && ghost.life>0){
      drawSkeleton(ghost.lm, ghost.color, ghost.joint, ghost.life/120);
      ghost.life--;
      statusEl.textContent='⚠ ENTIDAD DETECTADA DONDE NO HAY NADIE!!!';
      statusEl.classList.add('alert');
      if(ghost.life<=0){
        ghost=null;
        noPersonCounter=0; // RESETEA PARA QUE VUELVA A APARECER
        statusEl.classList.remove('alert');
        statusEl.textContent='Escaneando entidades invisibles...';
        statusEl.style.color='#ff0';
      }
    } else {
      // NO HAY FANTASMA - INTENTA CREAR UNO NUEVO CADA TANTO
      if(noPersonCounter>45 && Math.random() < (0.03 + sens*0.08)){
        const x=Math.random()*0.6+0.2;
        const y=Math.random()*0.6+0.2;
        const scale=0.35+Math.random()*0.6;
        // crea landmarks falsos con forma humana
        const fakeLm=[];
        for(let i=0;i<33;i++) fakeLm.push({x:x+(Math.random()-0.5)*0.1,y:y+(Math.random()-0.5)*0.1,visibility:0});
        fakeLm[0]={x:x,y:y-0.18*scale,visibility:1};
        fakeLm[11]={x:x-0.09*scale,y:y-0.08*scale,visibility:1};
        fakeLm[12]={x:x+0.09*scale,y:y-0.08*scale,visibility:1};
        fakeLm[13]={x:x-0.18*scale,y:y+0.02*scale,visibility:1};
        fakeLm[14]={x:x+0.18*scale,y:y+0.02*scale,visibility:1};
        fakeLm[15]={x:x-0.22*scale,y:y+0.12*scale,visibility:1};
        fakeLm[16]={x:x+0.22*scale,y:y+0.12*scale,visibility:1};
        fakeLm[23]={x:x-0.06*scale,y:y+0.18*scale,visibility:1};
        fakeLm[24]={x:x+0.06*scale,y:y+0.18*scale,visibility:1};
        fakeLm[25]={x:x-0.07*scale,y:y+0.38*scale,visibility:1};
        fakeLm[26]={x:x+0.07*scale,y:y+0.38*scale,visibility:1};
        fakeLm[27]={x:x-0.08*scale,y:y+0.58*scale,visibility:1};
        fakeLm[28]={x:x+0.08*scale,y:y+0.58*scale,visibility:1};

        const colors=[['#FF00FF','#00FFFF'],['#00FFFF','#FF0000'],['#FFFF00','#FF00FF']];
        const col=colors[Math.floor(Math.random()*colors.length)];
        ghost={lm:fakeLm,color:col[0],joint:col[1],life:150}; // 2.5 seg visible
        noPersonCounter=0;
      } else {
        if(!evpOn && noPersonCounter>20){
          statusEl.textContent='Escaneando... apuntá a donde no hay nadie - SENS '+(sens*100).toFixed(0)+'%';
          statusEl.style.color='#ff0';
          statusEl.classList.remove('alert');
        }
      }
    }
  }
}

document.body.addEventListener('click',(e)=>{
  if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT') return;
  if(!stream) startCamera();
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
});

document.getElementById('camBtn').onclick=async()=>{ isStarted=false; stopCamera(); facing=facing==='environment'?'user':'environment'; await new Promise(r=>setTimeout(r,400)); startCamera(); };
document.getElementById('zoomIn').onclick=()=>{ if(track?.getCapabilities?.().zoom){ const c=track.getCapabilities().zoom; zoom=Math.min(c.max,zoom+0.5); track.applyConstraints({advanced:[{zoom}]}); } else { zoom+=0.1; video.style.transform=(facing==='user'?'scaleX(-1) ':'')+`scale(${zoom})`; } };
document.getElementById('zoomOut').onclick=()=>{ if(track?.getCapabilities?.().zoom){ const c=track.getCapabilities().zoom; zoom=Math.max(c.min,zoom-0.5); track.applyConstraints({advanced:[{zoom}]}); } else { zoom=Math.max(1,zoom-0.1); video.style.transform=(facing==='user'?'scaleX(-1) ':'')+`scale(${zoom})`; } };

document.getElementById('volSlider').oninput=(e)=>{ document.getElementById('volLabel').textContent=e.target.value+'%'; if(gainNode) gainNode.gain.value=e.target.value/100*0.5; evpAudios.forEach(a=>a.volume=e.target.value/100); };

evpAudios=[document.getElementById('evp1'),document.getElementById('evp2'),document.getElementById('evp3')];
function startRealBox(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  whiteNode=audioCtx.createBufferSource(); whiteNode.buffer=buf; whiteNode.loop=true;
  filter=audioCtx.createBiquadFilter(); filter.type='bandpass'; filter.Q.value=8; filter.frequency.value=1000;
  gainNode=audioCtx.createGain(); gainNode.gain.value=document.getElementById('volSlider').value/100*0.4;
  whiteNode.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination); whiteNode.start();
  let f=76;
  sweepTimer=setInterval(()=>{ f+=0.6; if(f>108) f=76; filter.frequency.value=500+Math.random()*2000; if(evpOn &&!ghost) { statusEl.textContent=`📻 ${f.toFixed(1)} MHz - BARRIDO REAL + SLS ACTIVO`; } },130);
  voiceTimer=setInterval(()=>{
    const a=evpAudios[Math.floor(Math.random()*evpAudios.length)];
    a.volume=document.getElementById('volSlider').value/100;
    a.currentTime=Math.random()*2; a.playbackRate=0.9+Math.random()*0.3;
    a.play().catch(()=>{});
  },1800);
}
function stopRealBox(){ clearInterval(sweepTimer); clearInterval(voiceTimer); if(whiteNode) try{whiteNode.stop()}catch{}; evpAudios.forEach(a=>a.pause()); }

document.getElementById('evpBtn').onclick=()=>{
  evpOn=!evpOn;
  if(evpOn){ startRealBox(); document.getElementById('evpBtn').textContent='📻 ON BARRIDO REAL + SLS'; document.getElementById('evpBtn').style.background='yellow'; document.getElementById('evpBtn').style.color='black'; }
  else { stopRealBox(); document.getElementById('evpBtn').textContent='📻 SPIRIT BOX OFF'; document.getElementById('evpBtn').style.background='black'; document.getElementById('evpBtn').style.color='yellow'; statusEl.textContent='SLS REAL ACTIVO'; }
};

document.getElementById('photoBtn').onclick=()=>{
  const c=document.createElement('canvas'); c.width=W; c.height=H; const ct=c.getContext('2d'); ct.drawImage(video,0,0,W,H); ct.drawImage(canvas,0,0,W,H);
  const a=document.createElement('a'); a.download=`ARCHIVAX_${Date.now()}.png`; a.href=c.toDataURL(); a.click();
};

async function crearPago(){
  const res=await fetch(`${SUPABASE_URL}/functions/v1/create-preference`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({title:'ARCHIVAX $5999',price:5999})});
  const data=await res.json(); if(data.init_point) location.href=data.init_point;
}
document.getElementById('subBtn').onclick=crearPago;
document.getElementById('goPremium').onclick=crearPago;
document.getElementById('closePay').onclick=()=>document.getElementById('payWall').classList.remove('show');
</script>
</body>
</html>
