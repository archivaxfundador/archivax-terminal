<script>

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');

const rctx=recordCanvas.getContext('2d');

const debugEl=document.getElementById('debug');

function resize(){W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; recordCanvas.width=W; recordCanvas.height=H;}

function checkAccess(){
  const premium=localStorage.getItem('archivax_premium')==='true';
  if(premium){
    document.getElementById('premiumBadge').style.display='block';
    document.getElementById('userName').textContent=localStorage.getItem('archivax_user')||'PREMIUM';
    document.getElementById('subBtn').style.display='none'; return true;
  }
  const blocked=parseInt(localStorage.getItem('archivax_blocked_until')||'0');
  if(Date.now()<blocked){ blockScreen.style.display='flex'; return false; }
  let start=parseInt(localStorage.getItem('archivax_start')||'0');
  if(!start){ start=Date.now(); localStorage.setItem('archivax_start',start); }
  if(Date.now()-start > 40*60*1000){ localStorage.setItem('archivax_blocked_until', Date.now()+24*60*60*1000); localStorage.removeItem('archivax_start'); blockScreen.style.display='flex'; return false; }
  return true;
}

// DIBUJO COMO TU FOTO ORIGINAL - VERDE Y ROSA NEON
function drawSLS(kp, idx){
  const get=n=>kp.find(k=>k.name===n);
  const styles = [
    {bone:'#00FF00', joint:'#FFFF00', head:'#FF0000', width:6},
    {bone:'#FF00FF', joint:'#00FFFF', head:'#FF8000', width:6},
    {bone:'#00FFFF', joint:'#FF0000', head:'#FFFF00', width:6}
  ];
  const s = styles[idx % styles.length];
  const pairs=[['left_shoulder','right_shoulder'],['left_shoulder','left_elbow'],['left_elbow','left_wrist'],['right_shoulder','right_elbow'],['right_elbow','right_wrist'],['left_shoulder','left_hip'],['right_shoulder','right_hip'],['left_hip','right_hip'],['left_hip','left_knee'],['left_knee','left_ankle'],['right_hip','right_knee'],['right_knee','right_ankle']];

  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.shadowColor=s.bone; ctx.shadowBlur=12;
  ctx.strokeStyle=s.bone; ctx.lineWidth=s.width;

  pairs.forEach(([a,b])=>{
    const p1=get(a),p2=get(b);
    if(p1&&p2&&p1.score>0.2&&p2.score>0.2){
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
    }
  });
  ctx.shadowBlur=0;
  kp.forEach(k=>{
    if(k.score>0.2){
      ctx.fillStyle=k.name==='nose'?s.head:s.joint;
      ctx.beginPath(); ctx.arc(k.x,k.y, k.name==='nose'?9:6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke();
    }
  });
  ctx.restore();
}

async function initDetector(){
  try{
    statusEl.textContent='Cargando IA...';
    await tf.setBackend('webgl'); await tf.ready();
    // MULTIPOSE = detecta hasta 6 personas, mucho mejor que SINGLE
    detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{
      modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,
      enableSmoothing:true,
      minPoseScore:0.2,
      multiPoseMaxDimension:256
    });
    statusEl.textContent='IA LISTA - Apuntá a una persona';
    debugEl.textContent='Detector: MULTIPOSE';
  }catch(e){
    statusEl.textContent='Error IA: '+e.message;
    // Fallback a singlepose thunder que es más preciso
    try{
      detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{
        modelType: poseDetection.movenet.modelType.SINGLEPOSE_THUNDER
      });
      statusEl.textContent='IA Thunder lista';
    }catch{}
  }
}

async function startCamera(){
  if(!checkAccess()) return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:true});
    video.srcObject=stream; await video.play();
    video.style.transform=facing==='user'?'scaleX(-1)':'none';
    if(!detector) await initDetector();
    loop();
  }catch(e){ statusEl.textContent='Permitir cámara: '+e.message; }
}

async function loop(){
  if(!detector||video.paused||video.readyState<2){ requestAnimationFrame(loop); return; }
  if(!checkAccess()) return;
  ctx.clearRect(0,0,W,H);
  try{
    const poses=await detector.estimatePoses(video,{flipHorizontal:facing==='user', maxPoses:6});
    if(poses && poses.length>0){
      let count=0;
      poses.forEach((p,i)=>{
        if(p.score>0.2){
          drawSLS(p.keypoints, i);
          count++;
        }
      });
      if(count>0){
        statusEl.textContent=`✓ ${count} PERSONA${count>1?'S':''} DETECTADA${count>1?'S':''} - SLS ACTIVO`;
        statusEl.style.color='#0f0';
        debugEl.textContent=`Score: ${poses[0].score.toFixed(2)} | Personas: ${count}`;
      } else {
        statusEl.textContent='Buscando figura humana... acercate';
        statusEl.style.color='#ff0';
      }
    } else {
      statusEl.textContent='Apuntá a alguien - IA buscando...';
    }
  }catch(e){ debugEl.textContent='Error loop: '+e.message; }

  // Para grabar
  rctx.drawImage(video,0,0,W,H); rctx.drawImage(canvas,0,0,W,H);
  rctx.fillStyle='rgba(0,0,0,0.6)'; rctx.fillRect(0,H-26,W,26);
  rctx.fillStyle='#0f0'; rctx.font='13px monospace'; rctx.fillText('archiviax.com.ar',10,H-8);
  requestAnimationFrame(loop);
}
window.addEventListener('load', startCamera);
document.getElementById('switchCam').onclick=()=>{ facing=facing==='environment'?'user':'environment'; if(stream) stream.getTracks().forEach(t=>t.stop()); startCamera(); };

// SPIRIT BOX REAL - CON AUDIOS REALES DE BARRIDO
function startRealSpiritBox(){
  sweepAudios = [
    document.getElementById('sweep1'),
    document.getElementById('sweep2'),
    document.getElementById('sweep3')
  ];
  // Reproduce el primero que cargue
  sweepAudios.forEach((a,i)=>{
    a.volume = i===0?0.9:0;
    a.playbackRate = 0.9 + Math.random()*0.3;
    a.currentTime = Math.random()*10;
    a.play().catch(()=>{});
  });

  // Efecto de cambio de frecuencia real cada 200ms
  let currentIdx=0;
  window.sweepTimer = setInterval(()=>{
    // crossfade entre radios como spirit box real
    const nextIdx = (currentIdx+1) % sweepAudios.length;
    sweepAudios[currentIdx].volume=0;
    sweepAudios[nextIdx].volume=0.9;
    sweepAudios[nextIdx].currentTime = Math.random()*20;
    sweepAudios[nextIdx].playbackRate = 0.85 + Math.random()*0.5;
    currentIdx=nextIdx;

    // Ruido de salto de frecuencia
    if(window.AudioContext){
      const actx = new (window.AudioContext||window.webkitAudioContext)();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.frequency.value=1500+Math.random()*2000;
      gain.gain.value=0.08;
      osc.connect(gain); gain.connect(actx.destination);
      osc.start(); osc.stop(actx.currentTime+0.05);
    }
  }, 180);

  statusEl.textContent='📻 SPIRIT BOX REAL - BARRIDO FM ACTIVO - ESCUCHA';
  statusEl.style.background='red'; statusEl.style.color='white';
}

function stopRealSpiritBox(){
  clearInterval(window.sweepTimer);
  sweepAudios.forEach(a=>{ try{a.pause();}catch{} });
  statusEl.textContent='SPIRIT BOX APAGADO';
  statusEl.style.background=''; statusEl.style.color='';
}

document.getElementById('evpBtn').onclick=()=>{

document.getElementById('photoBtn').onclick=()=>{ const a=document.createElement('a'); a.download=`ARCHIVAX_SLS_${Date.now()}.png`; a.href=recordCanvas.toDataURL(); a.click(); };
document.getElementById('videoBtn').onclick=()=>{
  if(!isRecording){
    recordedChunks=[]; const sRec=recordCanvas.captureStream(25);
    if(stream){ const at=stream.getAudioTracks()[0]; if(at) sRec.addTrack(at); }
    mediaRecorder=new MediaRecorder(sRec,{mimeType:'video/webm'});
    mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop=()=>{ const blob=new Blob(recordedChunks,{type:'video/webm'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`ARCHIVAX_${Date.now()}.webm`; a.click(); };
    mediaRecorder.start(); isRecording=true; document.getElementById('videoBtn').textContent='■ STOP';
  }else{ mediaRecorder.stop(); isRecording=false; document.getElementById('videoBtn').textContent='● REC'; }
};
