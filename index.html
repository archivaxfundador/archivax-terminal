<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVAX</title>
<style>
body{margin:0;background:black;color:#ff0000;font-family:monospace;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{width:90%;max-width:380px;border:1px solid #ff0000;border-radius:20px;padding:25px;text-align:center;box-shadow:0 0 25px rgba(255,0,0,0.25)}
h1{letter-spacing:6px;margin:0 0 5px 0}
.sub{font-size:9px;color:#666;margin-bottom:20px;letter-spacing:2px}
input{width:100%;padding:12px;background:#0a0a0a;border:1px solid #330000;color:white;border-radius:10px;margin:8px 0;box-sizing:border-box}
.btn-main{width:100%;padding:14px;background:#00ff00;color:black;font-weight:bold;border:none;border-radius:12px;cursor:pointer;margin-top:10px;letter-spacing:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.card{border:1px solid #330000;background:rgba(255,0,0,0.05);border-radius:12px;padding:15px 10px;cursor:pointer;transition:0.2s}
.card:hover{border-color:#ff0000;box-shadow:0 0 15px rgba(255,0,0,0.3);transform:scale(1.02)}
.card b{display:block;font-size:12px;margin-top:5px}
.card span{font-size:18px}
.divisor{margin:20px 0;border:none;border-top:1px dashed #330000}
.guest{font-size:10px;color:#666;margin-top:10px}
</style>
</head>
<body>
<div class="container">
  <h1>ARCHIVAX</h1>
  <div class="sub">TERMINAL DE EVIDENCIA PARANORMAL</div>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="pass" placeholder="Contraseña">
  <button class="btn-main" onclick="entrar()">ENTRAR [10:00]</button>

  <hr class="divisor">

  <div style="font-size:10px;color:#ff0000;letter-spacing:3px;margin-bottom:10px">MODO INVITADO - SIN REGISTRO</div>
  <div class="grid">
    <div class="card" onclick="location.href='camara.html'">
      <span>👁️</span><b>CAMARA ROJA</b><div style="font-size:9px;color:#666">Muñeco MediaPipe</div>
    </div>
    <div class="card" onclick="location.href='evp.html'">
      <span>🎙️</span><b>EVP EXTREMO</b><div style="font-size:9px;color:#666">X8 Sin Eco</div>
    </div>
    <div class="card" onclick="location.href='llamada.html'">
      <span>☎️</span><b>LA LINEA</b><div style="font-size:9px;color:#666">Llamada al otro lado</div>
    </div>
    <div class="card" onclick="location.href='ouija-evp.html'">
      <span>👻</span><b>OUIJA EVP</b><div style="font-size:9px;color:#666">Movida por voz</div>
    </div>
  </div>

  <div class="guest">Modo invitado 10 min • Todo se guarda en tu celular<br>archiviax.com.ar</div>
</div>

<script>
function entrar(){
  const e=document.getElementById('email').value;
  const p=document.getElementById('pass').value;
  if(!e||!p){ alert('Poné email y pass'); return; }
  localStorage.setItem('archiviax_user', JSON.stringify({email:e, tiempo:600}));
  location.href='camara.html';
}
</script>
</body>
</html>
