<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ARCHIVAX V17 - 40 SEG</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#0f0;font-family:monospace;overflow:hidden}
#video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#000}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2}
#uiTop{position:fixed;top:0;left:0;width:100%;z-index:10;display:flex;gap:4px;padding:5px;background:rgba(0,0,0,.85)}
.btn{flex:1;padding:11px;border:1px solid #0f0;background:#000;color:#0f0;font-size:11px;font-weight:bold}
.btn-main{background:#0f0;color:#000}
#status{position:fixed;top:52px;left:0;width:100%;z-index:10;text-align:center;padding:6px;font-size:11px;background:rgba(0,0,0,.85)}
#status.voice{background:yellow;color:red;font-weight:bold;font-size:14px}
#controls{position:fixed;bottom:62px;left:0;width:100%;z-index:10;background:rgba(0,0,0,.85);padding:6px;display:flex;gap:8px;align-items:center}
input[type=range]{flex:1;accent-color:#0f0}
#uiBottom{position:fixed;bottom:0;left:0;width:100%;z-index:10;display:flex;gap:4px;padding:6px;background:#000;border-top:2px solid #0f0}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="uiTop">
<button id="subBtn" class="btn btn-main">★ $5999/mes</button>
<button id="camBtn" class="btn">CAM ↺</button>
<button id="zoomOut" class="btn" style="flex:0.4">ZOOM -</button>
<button id="zoomIn" class="btn" style="flex:0.4">ZOOM +</button>
</div>

<div id="status">TOCÁ PARA INICIAR</div>

<div id="controls">
<span style="font-size:10px">VOL EVP</span>
<input id="volSlider" type="range" min="0" max="100" value="100">
<span id="volLabel" style="font-size:10px">100%</span>
<span style="font-size:10px;margin-left:6px">SENS</span>
<input id="sensSlider" type="range" min="10" max="100" value="45">
</div>

<div id="uiBottom">
<button id="evpBtn" class="btn" style="color:yellow;border-color:yellow">📻 EVP REAL OFF</button>
<button id="photoBtn" class="btn">📸 FOTO</button>
<button id="recBtn" class="btn" style="color:red;border-color:red">● REC</button>
</div>

<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');
let W,H,facing='environment',stream=null,pose=null,isStarted=false,track=null,zoom=1;
let noPersonCounter=0,ghost=null;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight} resize(); addEventListener('resize',resize);
function stopCamera(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
async function startCamera(){
  if(isStarted) return; isStarted=true; stopCamera();
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:640},height:{ideal:480}},audio:true});
    video.srcObject=stream; await video.play(); track=stream.getVideoTracks()[0];
    video.style.transform=facing==='user'?'scaleX(-1)':'none';
    await initPose();
    statusEl.textContent='SLS LISTO - TOCÁ EVP PARA VOCES CADA 40 SEG';
  }catch(e){ isStarted=false; statusEl.textContent='Error: '+e.name; }
}
async function initPose(){
  pose=new Pose({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/${f}`});
  pose.setOptions({modelComplexity:0,smoothLandmarks:true,minDetectionConfidence:0.4,minTrackingConfidence:0.4});
  pose.onResults(onResults);
  async function loop(){ if(video.readyState>=2 && pose){ await pose.send({image:video}); } if(stream) requestAnimationFrame(loop); }
  loop();
}
function drawSkeleton(lm,color='#00FF00',joint='#FFFF00',alpha=1){
  const pairs=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
  ctx.save(); ctx.globalAlpha=alpha; ctx.lineWidth=5; ctx.lineCap='round'; ctx.strokeStyle=color; ctx.shadowColor=color; ctx.shadowBlur=14;
  pairs.forEach(([a,b])=>{ const p1=lm[a],p2=lm[b]; if(p1&&p2&&p1.visibility>0.2&&p2.visibility>0.2){ ctx.beginPath(); ctx.moveTo(p1.x*W,p1.y*H); ctx.lineTo(p2.x*W,p2.y*H); ctx.stroke(); } });
  lm.forEach((p,i)=>{ if(p.visibility>0.3){ ctx.fillStyle=i==0?'#FF0000':joint; ctx.beginPath(); ctx.arc(p.x*W,p.y*H,i==0?10:6,0,Math.PI*2); ctx.fill(); } });
  ctx.restore();
}
function onResults(res){
  ctx.clearRect(0,0,W,H);
  const sens=parseInt(document.getElementById('sensSlider').value)/100;
  if(res.poseLandmarks){
    noPersonCounter=0; ghost=null; drawSkeleton(res.poseLandmarks,'#00FF00','#FFFF00',1);
  } else {
    noPersonCounter++;
    const t=Date.now()*0.001;
    if(ghost && ghost.life>0){
      const breath=Math.sin(t*1.2)*0.008, sway=Math.sin(t*0.6)*0.015;
      const humanLm=ghost.base.map(p=>({x:p.x+sway, y:p.y+breath, visibility:p.visibility}));
      drawSkeleton(humanLm.map(p=>({x:p.x+ghost.x,y:p.y,visibility:p.visibility})),ghost.color,ghost.joint,Math.min(1,ghost.life/100));
      ghost.life--; if(ghost.life<=0){ ghost=null; noPersonCounter=0; }
    } else if(noPersonCounter>40 && Math.random()<(0.02+sens*0.06)){
      const x=Math.random()*0.6+0.2,y=Math.random()*0.55+0.2,scale=0.38+Math.random()*0.55;
      const base=[]; for(let i=0;i<33;i++) base.push({x:x,y:y,visibility:0});
      base[0]={x:x,y:y-0.18*scale,visibility:1}; base[11]={x:x-0.09*scale,y:y-0.08*scale,visibility:1}; base[12]={x:x+0.09*scale,y:y-0.08*scale,visibility:1};
      base[13]={x:x-0.18*scale,y:y+0.02*scale,visibility:1}; base[14]={x:x+0.18*scale,y:y+0.02*scale,visibility:1}; base[15]={x:x-0.23*scale,y:y+0.13*scale,visibility:1}; base[16]={x:x+0.23*scale,y:y+0.13*scale,visibility:1};
      base[23]={x:x-0.06*scale,y:y+0.18*scale,visibility:1}; base[24]={x:x+0.06*scale,y:y+0.18*scale,visibility:1}; base[25]={x:x-0.07*scale,y:y+0.38*scale,visibility:1}; base[26]={x:x+0.07*scale,y:y+0.38*scale,visibility:1}; base[27]={x:x-0.08*scale,y:y+0.58*scale,visibility:1}; base[28]={x:x+0.08*scale,y:y+0.58*scale,visibility:1};
      const colors=[['#FF00FF','#00FFFF'],['#00FF00','#FFFF00']]; const col=colors[Math.floor(Math.random()*colors.length)];
      ghost={base:base,x:0,color:col[0],joint:col[1],life:480};
    }
  }
}
document.body.addEventListener('click',(e)=>{ if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT') return; if(!stream) startCamera(); });
document.getElementById('camBtn').onclick=async()=>{ isStarted=false; stopCamera(); facing=facing==='environment'?'user':'environment'; await new Promise(r=>setTimeout(r,400)); startCamera(); };
document.getElementById('zoomIn').onclick=()=>{ if(track?.getCapabilities?.().zoom){ const c=track.getCapabilities().zoom; zoom=Math.min(c.max,zoom+0.5); track.applyConstraints({advanced:[{zoom}]}); } else { zoom+=0.1; video.style.transform=(facing==='user'?'scaleX(-1) ':'')+`scale(${zoom})`; } };
document.getElementById('zoomOut').onclick=()=>{ if(track?.getCapabilities?.().zoom){ const c=track.getCapabilities().zoom; zoom=Math.max(c.min,zoom-0.5); track.applyConstraints({advanced:[{zoom}]}); } else { zoom=Math.max(1,zoom-0.1); video.style.transform=(facing==='user'?'scaleX(-1) ':'')+`scale(${zoom})`; } };

// ===== EVP CADA 40 SEGUNDOS - VOCES HUMANAS REALES =====
let audioCtx=null, evpOn=false, sweepTimer=null, voiceTimer=null, whiteNode=null, gainNode=null, filter=null, volume=1.0;

const FRASES_REALES=[
"si","no","hola","aquí estoy","ayuda","vete","atrás","frío","luz","estoy aquí",
"quién eres","no te vayas","cuidado","salí de aquí","tengo miedo","mamá","déjame en paz","¿me escuchas?","te veo","aquí",
"no puedo salir","hace frío aquí","¿por qué viniste?","no me dejes","estoy perdido","busco a mi familia","no cruces","detrás tuyo","a tu lado","mírame",
"escúchame","no estoy solo","somos muchos","él está aquí","ella llora","el niño","no abras esa puerta","vete ya","te dije que te vayas","no quiero",
"hola amigo","¿cómo te llamas?","¿qué hora es?","es tarde","ya es hora","vení","acercate","no tengas miedo","te estoy esperando","desde hace mucho",
"en el sótano","arriba","en la pieza","bajo la cama","en el espejo","no mires","cerrá los ojos","abrí los ojos","¿ves eso?","ahí está",
"corre","escondete","silencio","shhh","no hagas ruido","nos escuchan","vienen","ya llegaron","no mires atrás","corre ya",
"te dije que no vengas","te lo advertí","es peligroso","no es seguro","salí corriendo","ayudame a salir","sacame de aquí","liberame","perdón","lo siento"
];

function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }

function playRealHumanVoice(text){
  if(!audioCtx) return;
  if(audioCtx.state==='suspended') audioCtx.resume();
  if(gainNode) gainNode.gain.setValueAtTime(0.02, audioCtx.currentTime);
  const utter=new SpeechSynthesisUtterance(text);
  const voices=speechSynthesis.getVoices();
  let best=voices.find(v=>v.name.includes('Google')&&v.lang.startsWith('es'))||voices.find(v=>v.lang.startsWith('es'))||voices[0];
  if(best) utter.voice=best;
  utter.lang='es-AR'; utter.rate=0.70; utter.pitch=0.35; utter.volume=1.0;
  utter.onstart=()=>{ statusEl.textContent=`👻 VOZ HUMANA: "${text.toUpperCase()}"`; statusEl.classList.add('voice'); };
  utter.onend=()=>{
    if(gainNode) gainNode.gain.setValueAtTime(volume*0.18, audioCtx.currentTime);
    setTimeout(()=>{ statusEl.classList.remove('voice'); },800);
  };
  speechSynthesis.cancel();
  setTimeout(()=>speechSynthesis.speak(utter),100);
}

function startPSB7(){
  initAudio(); if(audioCtx.state==='suspended') audioCtx.resume();
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*1.5,audioCtx.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.4;
  whiteNode=audioCtx.createBufferSource(); whiteNode.buffer=buf; whiteNode.loop=true;
  filter=audioCtx.createBiquadFilter(); filter.type='bandpass'; filter.Q.value=5; filter.frequency.value=1000;
  gainNode=audioCtx.createGain(); gainNode.gain.value=volume*0.18;
  whiteNode.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination); whiteNode.start();

  const FM_FREQS=[88.5,90.1,91.9,93.5,95.1,96.9,99.1,101.3,103.5,105.7,107.1];
  let idx=0;

  // barrido de radio rápido solo shhh
  sweepTimer=setInterval(()=>{
    idx=(idx+1)%FM_FREQS.length;
    filter.frequency.value=400+Math.random()*2500;
    if(!statusEl.classList.contains('voice')){
      statusEl.textContent=`📻 ${FM_FREQS[idx]} FM - shhh... próxima voz en 40 seg`;
    }
  },180);

  // VOZ CADA 40 SEGUNDOS
  function lanzarVozLenta(){
    if(!evpOn) return;
    const frase=FRASES_REALES[Math.floor(Math.random()*FRASES_REALES.length)];
    playRealHumanVoice(frase);
    voiceTimer=setTimeout(lanzarVozLenta, 40000); // 40 SEGUNDOS
  }
  voiceTimer=setTimeout(lanzarVozLenta, 4000); // primera a los 4 seg
}

function stopPSB7(){
  clearInterval(sweepTimer); clearTimeout(voiceTimer);
  if(whiteNode) try{whiteNode.stop()}catch{};
  speechSynthesis.cancel();
  statusEl.textContent='EVP APAGADO'; statusEl.classList.remove('voice');
}

document.getElementById('volSlider').oninput=(e)=>{
  volume=e.target.value/100;
  document.getElementById('volLabel').textContent=e.target.value+'%';
  if(gainNode) gainNode.gain.value=volume*0.18;
};

document.getElementById('evpBtn').onclick=()=>{
  evpOn=!evpOn;
  if(evpOn){
    let voices=speechSynthesis.getVoices();
    if(voices.length===0){
      speechSynthesis.onvoiceschanged=()=>{ initAudio(); startPSB7(); };
    } else { initAudio(); startPSB7(); }
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
    document.getElementById('evpBtn').textContent='📻 EVP ON - VOZ CADA 40 SEG';
    document.getElementById('evpBtn').style.background='yellow'; document.getElementById('evpBtn').style.color='black';
  } else {
    stopPSB7();
    document.getElementById('evpBtn').textContent='📻 EVP REAL OFF';
    document.getElementById('evpBtn').style.background='black'; document.getElementById('evpBtn').style.color='yellow';
  }
};

document.getElementById('photoBtn').onclick=()=>{
  const c=document.createElement('canvas'); c.width=W; c.height=H; const ct=c.getContext('2d'); ct.drawImage(video,0,0,W,H); ct.drawImage(canvas,0,0,W,H);
  const a=document.createElement('a'); a.download=`ARCHIVAX_${Date.now()}.png`; a.href=c.toDataURL(); a.click();
};
speechSynthesis.getVoices();
setTimeout(()=>speechSynthesis.getVoices(),500);
</script>
</body>
</html>
