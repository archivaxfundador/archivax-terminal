<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ARCHIVAX SLS A15 FIX</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f0;font-family:monospace;overflow:hidden}
#video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#111}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
#topBar{position:fixed;top:0;left:0;width:100%;z-index:10;background:#000;border-bottom:2px solid #0f0;padding:6px;display:flex;gap:6px}
.btn{flex:1;padding:12px;background:#000;color:#0f0;border:1px solid #0f0;font-size:12px}
.btn-main{background:#0f0;color:#000;font-weight:bold}
#status{position:fixed;top:50px;left:0;width:100%;z-index:10;background:rgba(0,0,0,.9);text-align:center;padding:5px;font-size:11px;z-index:11}
#bottom{position:fixed;bottom:0;left:0;width:100%;z-index:10;background:#000;border-top:2px solid #0f0;padding:6px;display:flex;gap:6px;flex-direction:column}
.row{display:flex;gap:6px}
#blockScreen{position:fixed;inset:0;z-index:99;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="status">TOCA LA PANTALLA PARA INICIAR CAMARA</div>

<div id="topBar">
<button id="subBtn" class="btn btn-main">★ $5999/mes</button>
<button id="camBtn" class="btn">CAM ↺</button>
</div>

<div id="bottom">
<div class="row">
<button id="evpBtn" class="btn" style="color:yellow;border-color:yellow">📻 SPIRIT BOX REAL</button>
<button id="photoBtn" class="btn">📸 FOTO</button>
<button id="recBtn" class="btn" style="color:red;border-color:red">● REC</button>
</div>
</div>

<div id="blockScreen">
<h2>40 MIN TERMINADOS</h2><br>
<button id="goPremium" class="btn btn-main">ACTIVAR $5999</button>
</div>

<audio id="radio1" preload="auto" loop src="https://cdn.freesound.org/previews/316/316920_5121236-lq.mp3"></audio>

<script>
const SUPABASE_URL="https://yxfzvogiladjupikgqyt.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_a1vTW1SY3abxVyn2qFDNlA_K_n3xgOc";
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');
let facing='environment', stream=null, evpOn=false, pose=null, cameraMediapipe=null;
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
window.addEventListener('resize',resize);resize();

function check(){ if(localStorage.getItem('archivax_premium')==='true') return true; const b=parseInt(localStorage.getItem('archivax_blocked_until')||'0'); if(Date.now()<b){document.getElementById('blockScreen').style.display='flex';return false;} let s=parseInt(localStorage.getItem('archivax_start')||'0'); if(!s){s=Date.now();localStorage.setItem('archivax_start',s);} if(Date.now()-s>40*60*1000){localStorage.setItem('archivax_blocked_until',Date.now()+24*60*60*1000);localStorage.removeItem('archivax_start');document.getElementById('blockScreen').style.display='flex';return false;} return true; }

// DIBUJO COMO TU FOTO
function onResults(results){
  ctx.clearRect(0,0,W,H);
  if(!results.poseLandmarks){ statusEl.textContent='Buscando cuerpo... acercate con luz'; statusEl.style.color='#ff0'; return; }
  statusEl.textContent='✓ PERSONA DETECTADA - SLS REAL ACTIVO'; statusEl.style.color='#0f0';

  const lm=results.poseLandmarks;
  const pairs=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
  ctx.save();
  ctx.strokeStyle='#00FF00'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.shadowColor='#00FF00'; ctx.shadowBlur=15;
  pairs.forEach(([a,b])=>{
    const p1=lm[a],p2=lm[b];
    if(p1&&p2&&p1.visibility>0.3&&p2.visibility>0.3){
      ctx.beginPath(); ctx.moveTo(p1.x*W,p1.y*H); ctx.lineTo(p2.x*W,p2.y*H); ctx.stroke();
    }
  });
  lm.forEach((p,i)=>{
    if(p.visibility>0.4){
      ctx.fillStyle=i==0?'#FF0000':'#FFFF00';
      ctx.beginPath(); ctx.arc(p.x*W,p.y*H,i==0?10:6,0,Math.PI*2); ctx.fill();
    }
  });
  ctx.restore();
}

async function startPose(){
  pose=new Pose({locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/${file}`});
  pose.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:false,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
  pose.onResults(onResults);
}

async function startCamera(){
  if(!check()) return;
  statusEl.textContent='Iniciando cámara '+facing+'...';
  try{
    if(stream){ stream.getTracks().forEach(t=>t.stop()); }
    const constraints={video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false};
    stream=await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject=stream;
    await video.play();
    video.style.transform=facing==='user'?'scaleX(-1)':'none';
    statusEl.textContent='Cámara OK - Cargando IA...';
    if(!pose) await startPose();
    cameraMediapipe=new Camera(video,{
      onFrame: async()=>{ await pose.send({image:video}); },
      width:1280,height:720
    });
    cameraMediapipe.start();
    statusEl.textContent='SLS REAL LISTO - Apuntá a alguien';
  }catch(e){
    statusEl.textContent='Error cámara: '+e.name+' '+e.message+' - Tocá para reintentar';
    console.error(e);
  }
}

// INICIAR CON TOQUE - OBLIGATORIO EN A15
document.body.addEventListener('click',()=>{ if(!stream) startCamera(); },{once:true});
window.addEventListener('load',()=>{ setTimeout(startCamera,500); });

document.getElementById('camBtn').onclick=async()=>{
  facing=facing==='environment'?'user':'environment';
  await startCamera();
};

// FOTO
document.getElementById('photoBtn').onclick=()=>{
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const ct=c.getContext('2d'); ct.drawImage(video,0,0,W,H); ct.drawImage(canvas,0,0,W,H);
  const a=document.createElement('a'); a.download=`SLS_${Date.now()}.png`; a.href=c.toDataURL(); a.click();
};

// SPIRIT BOX REAL
let radio=document.getElementById('radio1'), sweepTimer=null;
function startBox(){ radio.volume=1; radio.currentTime=Math.random()*10; radio.play().catch(()=>{}); sweepTimer=setInterval(()=>{ radio.currentTime=Math.random()*20; radio.playbackRate=0.8+Math.random()*0.4; },180); }
function stopBox(){ clearInterval(sweepTimer); radio.pause(); }
document.getElementById('evpBtn').onclick=()=>{
  evpOn=!evpOn;
  if(evpOn){ startBox(); document.getElementById('evpBtn').textContent='📻 ON BARRIDO REAL'; document.getElementById('evpBtn').style.background='yellow'; document.getElementById('evpBtn').style.color='black'; }
  else { stopBox(); document.getElementById('evpBtn').textContent='📻 SPIRIT BOX REAL'; document.getElementById('evpBtn').style.background='black'; document.getElementById('evpBtn').style.color='yellow'; }
};

async function crearPago(){
  const res=await fetch(`${SUPABASE_URL}/functions/v1/create-preference`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({title:'ARCHIVAX $5999',price:5999,quantity:1})});
  const data=await res.json(); if(data.init_point) location.href=data.init_point;
}
document.getElementById('subBtn').onclick=crearPago;
document.getElementById('goPremium').onclick=crearPago;
</script>
</body>
</html>
