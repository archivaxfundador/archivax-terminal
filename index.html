// DIBUJO SLS REAL COMO TU FOTO - VERDE Y ROSA
function drawRealSLS(kp, colorId){
  const get=n=>kp.find(k=>k.name===n);
  // Color como tu foto: 0=verde fluo, 1=rosa/magenta
  const colors = [
    { bone:'#39FF14', joint:'#39FF14', head:'#FF0000' }, // verde
    { bone:'#FF6BFF', joint:'#FFFF00', head:'#FF8C00' } // rosa/magenta como tu foto derecha
  ];
  const c = colors[colorId % 2];

  const pairs=[['left_shoulder','right_shoulder'],['left_shoulder','left_elbow'],['left_elbow','left_wrist'],['right_shoulder','right_elbow'],['right_elbow','right_wrist'],['left_shoulder','left_hip'],['right_shoulder','right_hip'],['left_hip','right_hip'],['left_hip','left_knee'],['left_knee','left_ankle'],['right_hip','right_knee'],['right_knee','right_ankle'],['nose','left_shoulder'],['nose','right_shoulder']];

  ctx.save();
  // Efecto aura como Kinect
  ctx.shadowColor = c.bone;
  ctx.shadowBlur = 15;
  ctx.strokeStyle = c.bone;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  pairs.forEach(([a,b])=>{
    const p1=get(a),p2=get(b);
    if(p1&&p2&&p1.score>0.35&&p2.score>0.35){
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
      // segunda pasada para brillo
      ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke(); ctx.lineWidth=5; ctx.strokeStyle=c.bone;
    }
  });

  // Puntos
  kp.forEach(k=>{
    if(k.score>0.35){
      ctx.shadowBlur=10;
      ctx.fillStyle = k.name.includes('nose') || k.name.includes('head')? c.head : c.joint;
      ctx.beginPath(); ctx.arc(k.x,k.y, k.name==='nose'?8:5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(k.x,k.y,2,0,Math.PI*2); ctx.fill();
    }
  });
  ctx.restore();
}

async function initDetector(){
  try{ await tf.setBackend('webgl'); await tf.ready(); detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING}); }catch{}
}
async function startCamera(){
  if(!checkAccess()) return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});
    video.srcObject=stream; await video.play();
    video.style.transform=facing==='user'?'scaleX(-1)':'none';
    if(!detector) await initDetector(); loop();
  }catch(e){ statusEl.textContent='Permitir cámara y micro'; document.body.addEventListener('click',startCamera,{once:true}); }
}
async function loop(){
  if(!detector||video.paused){ requestAnimationFrame(loop); return; }
  if(!checkAccess()) return;
  ctx.clearRect(0,0,W,H);
  try{
    const poses=await detector.estimatePoses(video,{flipHorizontal:facing==='user'});
    if(poses){
      poses.forEach((p,i)=>{
        if(p.score>0.3) drawRealSLS(p.keypoints, i);
      });
      if(poses.length>0) statusEl.textContent = `SLS: ${poses.length} ENTIDAD${poses.length>1?'ES':''} DETECTADA${poses.length>1?'S':''} | ${evpOn?'SPIRIT BOX ACTIVO':''}`;
    }
  }catch{}
  // Para grabar con efecto infrarrojo
  rctx.filter='grayscale(1) contrast(1.8) brightness(0.7)';
  rctx.drawImage(video,0,0,W,H); rctx.filter='none';
  rctx.drawImage(canvas,0,0,W,H);
  rctx.fillStyle='rgba(0,0,0,0.6)'; rctx.fillRect(0,H-26,W,26);
  rctx.fillStyle='#0f0'; rctx.font='13px monospace'; rctx.fillText('archiviax.com.ar | SLS SHOCK',10,H-8);
  requestAnimationFrame(loop);
}

// SPIRIT BOX REAL - BARRIDO FM
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }

let currentFreq = 76.0;
function startSpiritBox(){
  initAudio();
  const staticAudio = document.getElementById('static');
  staticAudio.volume=0.4; staticAudio.play().catch(()=>{});

  // Filtro que barre como radio real
  const osc = audioCtx.createOscillator();
  const filter = audioCtx.createBiquadFilter();
  const staticGain = audioCtx.createGain();
  const voiceGain = audioCtx.createGain();

  filter.type='bandpass'; filter.Q.value=15; filter.frequency.value=800;
  staticGain.gain.value=0.25; voiceGain.gain.value=0;

  const whiteNode = audioCtx.createBufferSource();
  const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1);
  whiteNode.buffer=buffer; whiteNode.loop=true;
  whiteNode.connect(filter); filter.connect(staticGain); staticGain.connect(audioCtx.destination);
  whiteNode.start();

  // Barrido de frecuencia 76.0 a 108.0 como radio real
  sweepInterval = setInterval(()=>{
    currentFreq += (Math.random()*0.8 - 0.1);
    if(currentFreq>108) currentFreq=76;
    if(currentFreq<76) currentFreq=76;
    filter.frequency.value = 200 + (currentFreq-76)*90 + Math.random()*400;
    filter.Q.value = 8 + Math.random()*10;
    staticGain.gain.value = 0.15 + Math.random()*0.2;
    statusEl.textContent = `📻 ${currentFreq.toFixed(1)} MHz - ESCANEANDO...`;
    statusEl.classList.add('sweeping');
    scanlines.style.display='block';
    // Click de cambio de frecuencia
    if(Math.random()>0.6){
      const click = audioCtx.createOscillator();
      click.frequency.value = 1000 + Math.random()*2000;
      const g = audioCtx.createGain(); g.gain.value=0.1;
      click.connect(g); g.connect(audioCtx.destination);
      click.start(); click.stop(audioCtx.currentTime+0.03);
    }
  }, sweepSpeed);

  // Voces reales cada 1.5 a 4 segundos, entre el ruido
  wordInterval = setInterval(()=>{
    if(Math.random()>0.35){
      const word = EVP_WORDS[Math.floor(Math.random()*EVP_WORDS.length)];
      // Voz super real con SpeechSynthesis en español, con pitch bajo y efecto radio
      const utter = new SpeechSynthesisUtterance(word);
      utter.lang='es-AR';
      utter.rate = 0.8 + Math.random()*0.4;
      utter.pitch = 0.2 + Math.random()*0.6; // grave como entidad
      utter.volume = 0.9;
      // Efecto de radio en la voz
      voiceGain.gain.value=1;
      setTimeout(()=>voiceGain.gain.value=0, 800);
      speechSynthesis.speak(utter);
      statusEl.textContent = `👻 VOZ: "${word.toUpperCase()}" @ ${currentFreq.toFixed(1)} MHz`;
      statusEl.style.color='#ff0000';
      setTimeout(()=>{ statusEl.style.color=''; }, 1000);
    }
  }, 1800);

  window._spiritNodes = {whiteNode, filter, staticGain, staticAudio};
}

function stopSpiritBox(){
  clearInterval(sweepInterval); clearInterval(wordInterval);
  if(window._spiritNodes){
    try{window._spiritNodes.whiteNode.stop();}catch{}
    window._spiritNodes.staticAudio.pause();
  }
  statusEl.textContent='SPIRIT BOX APAGADO'; statusEl.classList.remove('sweeping'); scanlines.style.display='none';
}
