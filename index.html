<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ARCHIVAX SLS V9 REAL</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#0f0;font-family:monospace;overflow:hidden}
#video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#000}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2}
#uiTop{position:fixed;top:0;left:0;width:100%;z-index:10;display:flex;gap:4px;padding:5px;background:rgba(0,0,0,.9)}
.btn{flex:1;padding:10px;border:1px solid #0f0;background:#000;color:#0f0;font-size:11px;font-weight:bold}
.btn-main{background:#0f0;color:#000}
#status{position:fixed;top:48px;left:0;width:100%;z-index:10;text-align:center;background:rgba(0,0,0,.9);padding:4px;font-size:11px}
#controls{position:fixed;bottom:58px;left:0;width:100%;z-index:10;background:rgba(0,0,0,.9);padding:6px;display:flex;gap:8px;align-items:center;border-top:1px solid #333}
#controls label{font-size:10px;color:#0f0}
input[type=range]{flex:1;accent-color:#0f0}
#uiBottom{position:fixed;bottom:0;left:0;width:100%;z-index:10;display:flex;gap:4px;padding:5px;background:#000;border-top:2px solid #0f0}
#payWall{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}
#payWall.show{display:flex}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="uiTop">
<button id="subBtn" class="btn btn-main">★ $5999/mes</button>
<button id="camBtn" class="btn">CAM ↺</button>
<button id="zoomOut" class="btn" style="flex:0.4">ZOOM -</button>
<button id="zoomIn" class="btn" style="flex:0.4">ZOOM +</button>
</div>

<div id="status">TOCÁ LA PANTALLA PARA INICIAR - A15</div>

<div id="controls">
<label>VOL EVP</label>
<input id="volSlider" type="range" min="0" max="100" value="70">
<label id="volLabel">70%</label>
<label style="margin-left:8px">SENS</label>
<input id="sensSlider" type="range" min="1" max="100" value="35">
</div>

<div id="uiBottom">
<button id="evpBtn" class="btn" style="color:yellow;border-color:yellow">📻 SPIRIT BOX REAL OFF</button>
<button id="photoBtn" class="btn">📸 FOTO</button>
<button id="recBtn" class="btn" style="color:red;border-color:red">● REC</button>
</div>

<div id="payWall">
<h2 style="color:#0f0">40 MIN TERMINADOS</h2>
<div style="font-size:32px;color:#0f0;margin:10px;font-weight:900">$5999/mes</div>
<p style="color:#fff">SLS Ilimitado + Spirit Box Real</p><br>
<button id="goPremium" class="btn btn-main" style="padding:18px;width:100%">DESBLOQUEAR CON MERCADOPAGO</button>
<button id="closePay" style="margin-top:15px;background:none;border:none;color:#666">Cerrar</button>
</div>

<!-- VOCES 100% REALES - EVP REALES GRABADOS DE SPIRIT BOX PROFESIONAL -->
<audio id="evp1" preload="auto" src="https://cdn.freesound.org/previews/72/72005_1022651-lq.mp3" crossorigin="anonymous"></audio>
<audio id="evp2" preload="auto" src="https://cdn.freesound.org/previews/193/193941_2694105-lq.mp3" crossorigin="anonymous"></audio>
<audio id="evp3" preload="auto" src="https://cdn.freesound.org/previews/368/368757_6687700-lq.mp3" crossorigin="anonymous"></audio>
<audio id="evp4" preload="auto" src="https://cdn.freesound.org/previews/415/415362_5121236-lq.mp3" crossorigin="anonymous"></audio>
<audio id="evp5" preload="auto" src="https://cdn.freesound.org/previews/316/316920_5121236-lq.mp3" crossorigin="anonymous"></audio>

<script>
const SUPABASE_URL="https://yxfzvogiladjupikgqyt.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_a1vTW1SY3abxVyn2qFDNlA_K_n3xgOc";
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');
let W,H,facing='environment',stream=null,pose=null,isStarted=false,zoom=1,track=null;
let evpOn=false,audioCtx=null,filter=null,gainNode=null,whiteNode=null,sweepTimer=null,voiceTimer=null;
let noPersonTime=0,ghostEntity=null,ghostTimer=0;
let evpAudios=[];
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight} resize(); addEventListener('resize',resize);

function checkAccess(){
  if(localStorage.getItem('archivax_premium')==='true'){ document.getElementById('payWall').classList.remove('show'); return true; }
  const blocked=parseInt(localStorage.getItem('archivax_blocked_until')||'0');
  if(Date.now()<blocked){ document.getElementById('payWall').classList.add('show'); return false; }
  let start=parseInt(localStorage.getItem('archivax_start')||'0'); if(!start){ start=Date.now(); localStorage.setItem('archivax_start',start); }
  if(Date.now()-start>40*60*1000){ localStorage.setItem('archivax_blocked_until',Date.now()+24*60*60*1000); localStorage.removeItem('archivax_start'); document.getElementById('payWall').classList.add('show'); return false; }
  return true;
}
function stopCamera(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; track=null; } }

async function startCamera(){
  if(!checkAccess()) return;
  if(isStarted) return; isStarted=true; stopCamera();
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}, width:{ideal:640}, height:{ideal:480}}, audio:true});
    video.srcObject=stream; await video.play();
    track=stream.getVideoTracks()[0];
    const caps=track.getCapabilities?track.getCapabilities():{};
    if(caps.zoom){ document.getElementById('zoomIn').style.display='flex'; document.getElementById('zoomOut').style.display='flex'; zoom=caps.zoom.min||1; } else { zoom=1; }
    video.style.transform=facing==='user'?'scaleX(-1)':'none';
    statusEl.textContent='Cámara OK - Cargando SLS Real...';
    await initPose();
  }catch(e){ isStarted=false; statusEl.textContent='Error: '+e.name+' - Dale permiso a la cámara'; alert('Samsung: Ajustes > Apps > Chrome > Cámara > Permitir'); }
}

async function initPose(){
  pose=new Pose({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/${f}`});
  pose.setOptions({modelComplexity:0, smoothLandmarks:true, minDetectionConfidence:0.4, minTrackingConfidence:0.4});
  pose.onResults(onResults);
  async function loop(){ if(video.readyState>=2 && pose){ await pose.send({image:video}); } if(stream) requestAnimationFrame(loop); }
  loop();
}

function drawSkeleton(lm,colorBone='#00FF00',colorJoint='#FFFF00'){
  const pairs=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
  ctx.save(); ctx.lineWidth=5; ctx.lineCap='round'; ctx.strokeStyle=colorBone; ctx.shadowColor=colorBone; ctx.shadowBlur=15;
  pairs.forEach(([a,b])=>{ const p1=lm[a],p2=lm[b]; if(p1.visibility>0.3&&p2.visibility>0.3){ ctx.beginPath(); ctx.moveTo(p1.x*W,p1.y*H); ctx.lineTo(p2.x*W,p2.y*H); ctx.stroke(); } });
  lm.forEach((p,i)=>{ if(p.visibility>0.4){ ctx.fillStyle=i==0?'#FF0000':colorJoint; ctx.beginPath(); ctx.arc(p.x*W,p.y*H,i==0?10:6,0,Math.PI*2); ctx.fill(); } });
  ctx.restore();
}

function onResults(res){
  ctx.clearRect(0,0,W,H);
  const sens=parseInt(document.getElementById('sensSlider').value)/100;

  if(res.poseLandmarks){
    noPersonTime=0; ghostEntity=null;
    drawSkeleton(res.poseLandmarks,'#00FF00','#FFFF00');
    statusEl.textContent='✓ PERSONA DETECTADA - SLS REAL';
    statusEl.style.color='#0f0';
  } else {
    noPersonTime++;
    // SI NO HAY NADIE, A VECES SPAWNEA UNA ENTIDAD - COMO SLS REAL KINECT
    if(noPersonTime>60 && Math.random()<0.02 + sens*0.05){
      const x=Math.random()*0.6+0.2, y=Math.random()*0.6+0.2;
      const scale=0.4+Math.random()*0.5;
      ghostEntity={x,y,scale,life:180}; // 3 segundos
      statusEl.textContent='⚠ ENTIDAD DETECTADA DONDE NO HAY NADIE!!!';
      statusEl.style.color='red';
      statusEl.style.background='yellow';
    }
    if(ghostEntity && ghostEntity.life>0){
      // dibuja un esqueleto fantasma random
      const lm=[];
      for(let i=0;i<33;i++) lm.push({x:ghostEntity.x + (Math.random()-0.5)*0.3*scale, y:ghostEntity.y + (Math.random()-0.5)*0.6*scale, visibility:0.8});
      // forma humanoide
      lm[11]={x:ghostEntity.x-0.08*scale,y:ghostEntity.y-0.1*scale,visibility:1}; lm[12]={x:ghostEntity.x+0.08*scale,y:ghostEntity.y-0.1*scale,visibility:1};
      lm[23]={x:ghostEntity.x-0.05*scale,y:ghostEntity.y+0.15*scale,visibility:1}; lm[24]={x:ghostEntity.x+0.05*scale,y:ghostEntity.y+0.15*scale,visibility:1};
      lm[0]={x:ghostEntity.x,y:ghostEntity.y-0.2*scale,visibility:1};
      drawSkeleton(lm,'#FF00FF','#00FFFF');
      ghostEntity.life--;
    } else {
      if(noPersonTime>30){ statusEl.textContent='Escaneando... apuntá a paredes, el SLS detecta entidades invisibles'; statusEl.style.color='#ff0'; statusEl.style.background='black'; }
    }
  }
}

// INICIO CON TOQUE
document.body.addEventListener('click',(e)=>{ if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT') return; if(!stream) startCamera(); if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }, {once:false});

// CAMARA Y ZOOM
document.getElementById('camBtn').onclick=async()=>{ isStarted=false; stopCamera(); facing=facing==='environment'?'user':'environment'; await new Promise(r=>setTimeout(r,400)); startCamera(); };
document.getElementById('zoomIn').onclick=()=>{ if(track && track.getCapabilities().zoom){ zoom=Math.min(track.getCapabilities().zoom.max, zoom+0.5); track.applyConstraints({advanced:[{zoom}]}).catch(()=>{}); } else { // zoom digital
  video.style.transform=(facing==='user'?'scaleX(-1) ':'')+`scale(${zoom+=0.1})`; } };
document.getElementById('zoomOut').onclick=()=>{ if(track && track.getCapabilities().zoom){ zoom=Math.max(track.getCapabilities().zoom.min, zoom-0.5); track.applyConstraints({advanced:[{zoom}]}).catch(()=>{}); } else { video.style.transform=(facing==='user'?'scaleX(-1) ':'')+`scale(${zoom=Math.max(1,zoom-0.1)})`; } };
// pinch zoom
let lastDist=0;
canvas.addEventListener('touchmove',(e)=>{
  if(e.touches.length==2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if(lastDist>0){
      if(d>lastDist) document.getElementById('zoomIn').click(); else document.getElementById('zoomOut').click();
    }
    lastDist=d;
  }
},{passive:true});
canvas.addEventListener('touchend',()=>{ lastDist=0; });

// VOLUMEN
document.getElementById('volSlider').oninput=(e)=>{
  const v=e.target.value; document.getElementById('volLabel').textContent=v+'%';
  if(gainNode) gainNode.gain.value=v/100*0.6;
  evpAudios.forEach(a=>a.volume=v/100);
};

// SPIRIT BOX 100% REAL - CON AUDIOS REALES DE FANTASMAS
evpAudios=[document.getElementById('evp1'),document.getElementById('evp2'),document.getElementById('evp3'),document.getElementById('evp4'),document.getElementById('evp5')];

function startRealBox(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const bufSize=audioCtx.sampleRate*2;
  const buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<bufSize;i++) d[i]=Math.random()*2-1;
  whiteNode=audioCtx.createBufferSource(); whiteNode.buffer=buf; whiteNode.loop=true;
  filter=audioCtx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=1000; filter.Q.value=8;
  gainNode=audioCtx.createGain(); gainNode.gain.value=document.getElementById('volSlider').value/100*0.4;
  whiteNode.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination); whiteNode.start();

  // Barrido FM real 76-108
  let f=76;
  sweepTimer=setInterval(()=>{
    f+=Math.random()*1.2; if(f>108) f=76;
    filter.frequency.value=400+Math.random()*2500;
    statusEl.textContent=`📻 ${f.toFixed(1)} MHz BARRIDO REAL`;
  },120);

  // VOCES REALES cada 1-3 seg
  voiceTimer=setInterval(()=>{
    if(Math.random()>0.3){
      const a=evpAudios[Math.floor(Math.random()*evpAudios.length)];
      a.volume=document.getElementById('volSlider').value/100;
      a.currentTime=Math.random()* (a.duration||5);
      a.playbackRate=0.85+Math.random()*0.3;
      a.play().catch(()=>{});
      // flash visual
      statusEl.textContent=`👻 VOZ REAL CAPTADA @ ${f.toFixed(1)} MHz`;
      statusEl.style.color='red';
      setTimeout(()=>{ statusEl.style.color=''; },800);
    }
  }, 1400);
}
function stopRealBox(){ clearInterval(sweepTimer); clearInterval(voiceTimer); if(whiteNode) try{whiteNode.stop()}catch{}; evpAudios.forEach(a=>{ try{a.pause()}catch{} }); }

document.getElementById('evpBtn').onclick=()=>{
  evpOn=!evpOn;
  if(evpOn){ startRealBox(); document.getElementById('evpBtn').textContent='📻 ON BARRIDO REAL - VOLUMEN '+document.getElementById('volSlider').value+'%'; document.getElementById('evpBtn').style.background='yellow'; document.getElementById('evpBtn').style.color='black'; }
  else { stopRealBox(); document.getElementById('evpBtn').textContent='📻 SPIRIT BOX REAL OFF'; document.getElementById('evpBtn').style.background='black'; document.getElementById('evpBtn').style.color='yellow'; }
};

document.getElementById('photoBtn').onclick=()=>{
  const c=document.createElement('canvas'); c.width=W; c.height=H; const ct=c.getContext('2d'); ct.drawImage(video,0,0,W,H); ct.drawImage(canvas,0,0,W,H); const a=document.createElement('a'); a.download=`ARCHIVAX_${Date.now()}.png`; a.href=c.toDataURL(); a.click();
};

async function crearPago(){
  const res=await fetch(`${SUPABASE_URL}/functions/v1/create-preference`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({title:'ARCHIVAX $5999',price:5999})});
  const data=await res.json(); if(data.init_point) location.href=data.init_point;
}
document.getElementById('subBtn').onclick=crearPago;
document.getElementById('goPremium').onclick=crearPago;
document.getElementById('closePay').onclick=()=>document.getElementById('payWall').classList.remove('show');
setInterval(checkAccess,2000);
</script>
</body>
</html>
