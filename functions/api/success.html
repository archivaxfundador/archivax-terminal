<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Premium Activado</title>
<style>body{background:black;color:#00ff00;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}</style>
</head><body>
<h1>💎 PAGADO<br><span style="font-size:14px;color:white">Activando premium...</span></h1>
<script>
const email = new URLSearchParams(location.search).get('email');
if(email){
  let usage = JSON.parse(localStorage.getItem('archiviax_usage')||'{}');
  usage[email]={fecha:new Date().toISOString().split('T')[0], usado:0, limite:99999999, premium:true};
  localStorage.setItem('archiviax_usage', JSON.stringify(usage));
  localStorage.setItem('archiviax_user', JSON.stringify({email:email, tipo:'premium'}));
  setTimeout(()=>{ location.href='/'; },2000);
}
</script></body></html>
