<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dashcam Vision + Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- TensorFlow SIN importmap para que no se cuelgue -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
 *{box-sizing:border-box;margin:0;padding:0;user-select:none}
 body{background:#000;color:#fff;font-family:sans-serif;height:100vh;overflow:hidden}
 #camera-container{position:relative;width:100%;height:100vh}
 video, #overlay{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
 #overlay{z-index:5;pointer-events:none}
 .hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:14px;z-index:10}
 .top-bar{display:flex;justify-content:space-between;align-items:center}
 .rec-badge{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.1);padding:8px 14px;border-radius:30px;font-size:11px;font-weight:700}
 .red-dot{width:9px;height:9px;background:#ff3b30;border-radius:50%}
 .recording .red-dot{animation:blink 1s infinite}
 @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
 .status-pill{background:rgba(20,20,20,0.8);padding:7px 12px;border-radius:8px;font-size:11px;font-weight:700;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1)}
 .status-pill.alert{background:rgba(255,59,48,0.9)}
 #map-container{position:absolute;bottom:90px;left:14px;width:140px;height:140px;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,0.25);box-shadow:0 8px 20px rgba(0,0,0,0.6);z-index:12;pointer-events:auto;background:#111}
 #map{width:100%;height:100%}
 #map.dark-map{filter:invert(1) hue-rotate(180deg) brightness(0.8) contrast(1.2)}
 .map-label{position:absolute;bottom:0;left:0;width:100%;text-align:center;font-size:8px;font-weight:700;background:rgba(0,0,0,0.7);padding:3px 0;z-index:500}
 .radar-arc{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);width:220px;height:50px;border-radius:50% / 100% 100% 0 0;border-top:5px solid #4caf50;transition:all 0.3s;z-index:10}
 .radar-arc.danger{border-color:#ff3b30;box-shadow:0 -10px 25px rgba(255,59,48,0.6)}
 .bottom-controls{display:flex;justify-content:space-around;align-items:center;width:100%;padding:10px 20px 22px;background:linear-gradient(transparent, rgba(0,0,0,0.85));pointer-events:auto}
 .btn{background:rgba(20,20,25,0.9);border:1px solid rgba(255,255,255,0.15);color:white;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
 .btn-record{width:64px;height:64px;border:3px solid #fff;background:#ff3b30}
 .btn-record.active-rec{background:#fff;border-color:#ff3b30;border-radius:14px}
 #loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);padding:12px 18px;border-radius:20px;font-size:12px;z-index:20;text-align:center}
 svg{width:22px;height:22px;fill:currentColor}
</style>
</head>
<body>
<div id="camera-container">
 <video id="webcam" autoplay playsinline muted></video>
 <canvas id="overlay"></canvas>
 <div id="loading">Iniciando visión...<br><small id="loadingSub" style="opacity:0.7">Cargando IA</small></div>
 <div id="map-container"><div id="map" class="dark-map"></div><div class="map-label" id="mapLabel">GPS: buscando...</div></div>
 <div class="hud">
  <div class="top-bar">
   <div class="rec-badge" id="recBadge"><div class="red-dot"></div><span id="timerTxt">VISION SYSTEM</span></div>
   <div class="status-pill" id="statusPill">SISTEMA: LISTO</div>
  </div>
  <div class="radar-arc" id="radarArc"></div>
  <div class="bottom-controls">
   <button class="btn" id="toggleCam"><svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg></button>
   <button class="btn btn-record" id="recordBtn"></button>
   <button class="btn" id="sentryTrigger"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg></button>
  </div>
 </div>
</div>

<script>
const video=document.getElementById('webcam'), canvas=document.getElementById('overlay'), ctx=canvas.getContext('2d');
const statusPill=document.getElementById('statusPill'), radarArc=document.getElementById('radarArc'), loading=document.getElementById('loading'), loadingSub=document.getElementById('loadingSub');
const mapLabel=document.getElementById('mapLabel');
let currentFacingMode='environment', model, isDetecting=false;
let mediaRecorder, recordedChunks=[], isRecording=false, timerInterval, seconds=0;
let lastVoiceAlert=0, lastPhotoTime=0;
let map, marker;

// MAPA FIX SIN API KEY - OpenStreetMap
function initMap(){
 map = L.map('map', {zoomControl:false, attributionControl:false, dragging:true, scrollWheelZoom:false}).setView([-34.6037,-58.3816], 16);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(map);
 marker = L.circleMarker([-34.6037,-58.3816], {radius:7, fillColor:'#4285F4', color:'#fff', weight:2, fillOpacity:1}).addTo(map);
 
 if(navigator.geolocation){
  navigator.geolocation.watchPosition(pos=>{
   const latlng=[pos.coords.latitude, pos.coords.longitude];
   map.setView(latlng, 17);
   marker.setLatLng(latlng);
   mapLabel.textContent=`GPS: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
  }, err=>{
   mapLabel.textContent="GPS: sin permiso";
   console.log(err);
  }, {enableHighAccuracy:true});
 } else {
  mapLabel.textContent="GPS: no soportado";
 }
}

async function initCamera(){
 try{
  if(window.localStream) window.localStream.getTracks().forEach(t=>t.stop());
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:currentFacingMode,width:{ideal:1280},height:{ideal:720}},audio:true});
  window.localStream=stream; video.srcObject=stream; await video.play();
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
 }catch(e){ alert("Dale permiso de cámara y usa HTTPS"); loading.textContent="Error de cámara"; }
}

async function loadAI(){
 try{
  loadingSub.textContent="Descargando modelo...";
  await tf.ready();
  model=await cocoSsd.load({base:'lite_mobilenet_v2'});
  loading.style.display='none';
  speak('Modo centinela activado');
  detectLoop();
 }catch(e){
  console.error(e);
  loading.innerHTML="IA no disponible<br><small>Igual funciona como dashcam</small>";
  setTimeout(()=>loading.style.display='none',3000);
 }
}

function speak(text){
 const now=Date.now();
 if(now-lastVoiceAlert < 6000) return;
 lastVoiceAlert=now;
 const utter=new SpeechSynthesisUtterance(text);
 utter.lang='es-AR'; utter.rate=1; 
 speechSynthesis.cancel();
 speechSynthesis.speak(utter);
}

function takePhotoAuto(){
 const now=Date.now();
 if(now-lastPhotoTime < 5000) return;
 lastPhotoTime=now;
 const tmp=document.createElement('canvas');
 tmp.width=video.videoWidth; tmp.height=video.videoHeight;
 tmp.getContext('2d').drawImage(video,0,0);
 const a=document.createElement('a'); a.href=tmp.toDataURL('image/jpeg',0.8); a.download=`SENTRY_${Date.now()}.jpg`; a.click();
}

async function detectLoop(){
 if(!model || video.paused){ requestAnimationFrame(detectLoop); return; }
 if(isDetecting){ requestAnimationFrame(detectLoop); return; }
 isDetecting=true;
 try{
  const preds=await model.detect(video, 8, 0.55);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  let personFound=false;
  preds.forEach(p=>{
   if(['person','car','truck','motorcycle','bicycle'].includes(p.class)){
    if(p.class==='person') personFound=true;
    const [x,y,w,h]=p.bbox;
    ctx.strokeStyle=p.class==='person'?'#ff3b30':'#38ff7a';
    ctx.lineWidth=2.5; ctx.strokeRect(x,y,w,h);
    ctx.fillStyle=p.class==='person'?'#ff3b30':'#38ff7a';
    const label=`${p.class.toUpperCase()} ${Math.round(p.score*100)}%`;
    ctx.fillRect(x, Math.max(0,y-18), ctx.measureText(label).width+12, 18);
    ctx.fillStyle='#000'; ctx.font='bold 11px sans-serif'; ctx.fillText(label, x+4, Math.max(10,y-5));
   }
  });
  if(personFound){
   statusPill.textContent='⚠️ PERSONA DETECTADA'; statusPill.classList.add('alert'); radarArc.classList.add('danger');
   speak('Persona detectada');
   takePhotoAuto();
   if(!isRecording) startRecording(true);
   if(navigator.vibrate) navigator.vibrate([120,60,120]);
  } else {
   statusPill.textContent='SISTEMA: LISTO'; statusPill.classList.remove('alert'); radarArc.classList.remove('danger');
  }
 }catch(e){ console.log(e); }
 isDetecting=false;
 setTimeout(()=>requestAnimationFrame(detectLoop),200);
}

function getMime(){ const t=['video/webm;codecs=vp9,opus','video/webm','video/mp4']; for(let m of t) if(MediaRecorder.isTypeSupported(m)) return m; return '';}
function startRecording(auto=false){
 if(isRecording) return;
 recordedChunks=[]; const mime=getMime();
 mediaRecorder=new MediaRecorder(window.localStream, mime?{mimeType:mime}:undefined);
 mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
 mediaRecorder.onstop=()=>{ if(!auto){ const blob=new Blob(recordedChunks,{type:mime}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`DASHCAM_${Date.now()}.webm`; a.click(); } };
 mediaRecorder.start(100); isRecording=true; document.getElementById('recordBtn').classList.add('active-rec'); document.getElementById('recBadge').classList.add('recording');
 seconds=0; timerInterval=setInterval(()=>{ seconds++; let m=Math.floor(seconds/60).toString().padStart(2,'0'); let s=(seconds%60).toString().padStart(2,'0'); document.getElementById('timerTxt').innerText=`REC ${m}:${s}`; },1000);
}
function stopRecording(){ if(mediaRecorder) mediaRecorder.stop(); isRecording=false; document.getElementById('recordBtn').classList.remove('active-rec'); document.getElementById('recBadge').classList.remove('recording'); clearInterval(timerInterval); document.getElementById('timerTxt').innerText="VISION SYSTEM"; }

document.getElementById('recordBtn').addEventListener('click', ()=> isRecording?stopRecording():startRecording(false));
document.getElementById('toggleCam').addEventListener('click', async()=>{ currentFacingMode=currentFacingMode==='environment'?'user':'environment'; await initCamera(); });
document.getElementById('sentryTrigger').addEventListener('click', ()=> speak('Modo centinela activado, vigilando el entorno'));

window.addEventListener('load', async()=>{ initMap(); await initCamera(); await loadAI(); });
</script>
</body>
</html>
