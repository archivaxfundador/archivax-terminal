<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Cam & Autopilot HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #camera-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* CAPA HUD / INTERFAZ TESLA */
    .tesla-hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    /* Barra Superior */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .rec-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .red-dot {
      width: 10px;
      height: 10px;
      background-color: #ff3b30;
      border-radius: 50%;
    }
    .recording .red-dot {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .status-pill {
      background: rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* LÍNEAS DE ASISTENCIA / PARQUEO */
    .parking-lines {
      position: absolute;
      top: 30%;
      left: 10%;
      width: 80%;
      height: 55%;
      border-left: 4px dashed rgba(255, 235, 59, 0.5);
      border-right: 4px dashed rgba(255, 235, 59, 0.5);
      transform: perspective(100px) rotateX(40deg);
      transform-origin: bottom center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .parking-lines::before {
      content: '';
      width: 100%;
      border-top: 3px solid rgba(255, 59, 48, 0.6); /* Línea de peligro (Roja) */
    }
    .parking-lines::after {
      content: '';
      width: 100%;
      border-bottom: 3px solid rgba(76, 175, 80, 0.6); /* Línea segura (Verde) */
    }

    /* RADAR DE PROXIMIDAD (BORDES) */
    .radar-arc {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 60px;
      border-radius: 50% / 100% 100% 0 0;
      border-top: 6px solid #4caf50;
      box-shadow: 0 -10px 20px rgba(76,175,80,0.2);
      animation: pulse-radar 2s infinite ease-in-out;
    }
    @keyframes pulse-radar {
      0%, 100% { border-color: #4caf50; opacity: 0.8; }
      50% { border-color: #ff9500; opacity: 0.5; }
    }

    /* CONTROLES INFERIORES */
    .bottom-controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      padding: 10px 20px 25px 20px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      z-index: 10;
      pointer-events: auto;
    }
    .btn {
      background: rgba(20, 20, 25, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 14px;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .btn:active {
      transform: scale(0.92);
      background: rgba(40, 40, 50, 0.9);
    }
    .btn-record {
      width: 68px;
      height: 68px;
      border: 3px solid #fff;
      background: #ff3b30;
    }
    .btn-record.active-rec {
      background: #fff;
      border-color: #ff3b30;
      border-radius: 12px;
      animation: pulse-rec 1.5s infinite;
    }
    @keyframes pulse-rec {
      0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
    }
    svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Superposición HUD -->
    <div class="tesla-hud">
      
      <!-- Top Status -->
      <div class="top-bar">
        <div class="rec-badge" id="recBadge">
          <div class="red-dot"></div>
          <span id="timerTxt">TESLA DASHCAM</span>
        </div>
        <div class="status-pill">AUTOPILOT: READY</div>
      </div>

      <!-- Elementos de asistencia en conducción -->
      <div class="parking-lines"></div>
      <div class="radar-arc"></div>

      <!-- Panel de Control inferior -->
      <div class="bottom-controls">
        <!-- Cambiar de cámara -->
        <button class="btn" id="toggleCam" title="Girar Cámara">
          <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
        </button>

        <!-- Botón de Grabación -->
        <button class="btn btn-record" id="recordBtn" title="Grabar"></button>

        <!-- Efecto de Alerta de proximidad forzada -->
        <button class="btn" id="sentryTrigger" title="Modo Centinela">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        </button>
      </div>

    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const toggleCamBtn = document.getElementById('toggleCam');
    const recordBtn = document.getElementById('recordBtn');
    const recBadge = document.getElementById('recBadge');
    const timerTxt = document.getElementById('timerTxt');

    let currentFacingMode = 'environment'; 
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let timerInterval;
    let seconds = 0;

    // Inicializar Cámara
    async function initCamera() {
      try {
        if (window.localStream) {
          window.localStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: true // Activado por si decides grabar sonido ambiental
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        window.localStream = stream;
        video.srcObject = stream;
      } catch (err) {
        console.error("Error accediendo a periféricos: ", err);
        alert("Por favor habilita los permisos de cámara y usa HTTPS.");
      }
    }

    // Alternar Cámaras (Delantera / Trasera)
    toggleCamBtn.addEventListener('click', () => {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      initCamera();
    });

    // Gestión del Grabador de Video (MediaRecorder API)
    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    function startRecording() {
      recordedChunks = [];
      const options = { mimeType: 'video/webm;codecs=vp9,opus' };
      
      // Ajuste de compatibilidad para iOS (Safari usa MP4)
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options.mimeType = 'video/mp4';
      }

      try {
        mediaRecorder = new MediaRecorder(window.localStream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(window.localStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      // Al detener la grabación, descarga el archivo automáticamente
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `TeslaCam_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.mp4`;
        a.click();
        URL.revokeObjectURL(url);
      };

      mediaRecorder.start();
      isRecording = true;
      recordBtn.classList.add('active-rec');
      recBadge.classList.add('recording');
      
      // Iniciar temporizador
      seconds = 0;
      timerInterval = setInterval(() => {
        seconds++;
        let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        let secs = (seconds % 60).toString().padStart(2, '0');
        timerTxt.innerText = `REC  ${mins}:${secs}`;
      }, 1000);
    }

    function stopRecording() {
      mediaRecorder.stop();
      isRecording = false;
      recordBtn.classList.remove('active-rec');
      recBadge.classList.remove('recording');
      clearInterval(timerInterval);
      timerTxt.innerText = "TESLA DASHCAM";
    }

    // Botón Sentry Extra: Simula un toggle estético
    document.getElementById('sentryTrigger').addEventListener('click', () => {
      alert("Modo Centinela activado. Monitoreando entorno...");
    });
