<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tesla Cam & Autopilot HUD</title>
<style>
 * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
 body { background:#000; color:#fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display:flex; flex-direction:column; overflow:hidden; }
 #camera-container { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#000; }
 video { width:100%; height:100%; object-fit:cover; }
 .tesla-hud { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:16px; }
 .top-bar { display:flex; justify-content:space-between; align-items:center; z-index:10; }
 .rec-badge { display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.75); border:1px solid rgba(255,255,255,0.1); padding:8px 14px; border-radius:30px; font-size:12px; font-weight:700; }
 .red-dot { width:10px; height:10px; background:#ff3b30; border-radius:50%; }
 .recording .red-dot { animation:blink 1s infinite; }
 @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
 .status-pill { background:rgba(255,255,255,0.15); padding:6px 12px; border-radius:6px; font-size:11px; font-weight:600; backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); }
 .parking-lines { position:absolute; top:30%; left:10%; width:80%; height:55%; border-left:4px dashed rgba(255,235,59,0.5); border-right:4px dashed rgba(255,235,59,0.5); transform:perspective(200px) rotateX(40deg); transform-origin:bottom center; display:flex; flex-direction:column; justify-content:space-between; }
 .parking-lines::before { content:''; width:100%; border-top:3px solid rgba(255,59,48,0.6); }
 .parking-lines::after { content:''; width:100%; border-bottom:3px solid rgba(76,175,80,0.6); }
 .radar-arc { position:absolute; bottom:120px; left:50%; transform:translateX(-50%); width:260px; height:60px; border-radius:50% / 100% 100% 0 0; border-top:6px solid #4caf50; box-shadow:0 -10px 20px rgba(76,175,80,0.2); animation:pulse-radar 2s infinite ease-in-out; }
 @keyframes pulse-radar { 0%,100%{border-color:#4caf50; opacity:0.8} 50%{border-color:#ff9500; opacity:0.5} }
 .bottom-controls { display:flex; justify-content:space-around; align-items:center; width:100%; padding:10px 20px 25px; background:linear-gradient(transparent, rgba(0,0,0,0.8)); z-index:10; pointer-events:auto; }
 .btn { background:rgba(20,20,25,0.85); border:1px solid rgba(255,255,255,0.15); color:white; padding:14px; border-radius:50%; width:56px; height:56px; cursor:pointer; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(8px); }
 .btn:active { transform:scale(0.92); }
 .btn-record { width:68px; height:68px; border:3px solid #fff; background:#ff3b30; }
 .btn-record.active-rec { background:#fff; border-color:#ff3b30; border-radius:12px; animation:pulse-rec 1.5s infinite; }
 @keyframes pulse-rec { 0%{box-shadow:0 0 0 0 rgba(255,59,48,0.7)} 70%{box-shadow:0 0 0 15px rgba(255,59,48,0)} 100%{box-shadow:0 0 0 0 rgba(255,59,48,0)} }
 svg { width:24px; height:24px; fill:currentColor; }
</style>
</head>
<body>
<div id="camera-container">
 <video id="webcam" autoplay playsinline muted></video>
 <div class="tesla-hud">
  <div class="top-bar">
   <div class="rec-badge" id="recBadge"><div class="red-dot"></div><span id="timerTxt">TESLA DASHCAM</span></div>
   <div class="status-pill">AUTOPILOT: READY</div>
  </div>
  <div class="parking-lines"></div>
  <div class="radar-arc"></div>
  <div class="bottom-controls">
   <button class="btn" id="toggleCam"><svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg></button>
   <button class="btn btn-record" id="recordBtn"></button>
   <button class="btn" id="sentryTrigger"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg></button>
  </div>
 </div>
</div>

<script>
const video = document.getElementById('webcam');
const toggleCamBtn = document.getElementById('toggleCam');
const recordBtn = document.getElementById('recordBtn');
const recBadge = document.getElementById('recBadge');
const timerTxt = document.getElementById('timerTxt');

let currentFacingMode = 'environment';
let mediaRecorder;
let recordedChunks = [];
let isRecording = false;
let timerInterval;
let seconds = 0;

async function initCamera() {
 try {
  if (window.localStream) {
   window.localStream.getTracks().forEach(t => t.stop());
  }
  const stream = await navigator.mediaDevices.getUserMedia({
   video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
   audio: true
  });
  window.localStream = stream;
  video.srcObject = stream;
  await video.play();
 } catch (err) {
  console.error(err);
  alert("Necesitás HTTPS y dar permiso de cámara. En iPhone usá Safari y no modo privado.");
 }
}

function getSupportedMimeType() {
 const types = [
  'video/webm;codecs=vp9,opus',
  'video/webm;codecs=vp8,opus',
  'video/webm',
  'video/mp4;codecs=h264,aac',
  'video/mp4'
 ];
 for (let t of types) {
  if (MediaRecorder.isTypeSupported(t)) return t;
 }
 return '';
}

toggleCamBtn.addEventListener('click', () => {
 currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
 initCamera();
});

recordBtn.addEventListener('click', () => {
 if (!isRecording) startRecording();
 else stopRecording();
});

function startRecording() {
 recordedChunks = [];
 const mimeType = getSupportedMimeType();
 console.log("Grabando con:", mimeType);
 
 try {
  mediaRecorder = new MediaRecorder(window.localStream, mimeType ? { mimeType } : undefined);
 } catch(e) {
  alert("Este navegador no soporta grabación");
  return;
 }

 mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };

 mediaRecorder.onstop = () => {
  const blob = new Blob(recordedChunks, { type: mimeType || 'video/webm' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.style.display = 'none';
  a.href = url;
  const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
  a.download = `TeslaCam_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.${ext}`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
 };

 mediaRecorder.start(100);
 isRecording = true;
 recordBtn.classList.add('active-rec');
 recBadge.classList.add('recording');
 seconds = 0;
 timerInterval = setInterval(() => {
  seconds++;
  let m = Math.floor(seconds/60).toString().padStart(2,'0');
  let s = (seconds%60).toString().padStart(2,'0');
  timerTxt.innerText = `REC ${m}:${s}`;
 }, 1000);
}

function stopRecording() {
 if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
 isRecording = false;
 recordBtn.classList.remove('active-rec');
 recBadge.classList.remove('recording');
 clearInterval(timerInterval);
 timerTxt.innerText = "TESLA DASHCAM";
}

document.getElementById('sentryTrigger').addEventListener('click', () => {
 if(navigator.vibrate) navigator.vibrate(100);
 alert("Modo Centinela: Monitoreando entorno...");
});

// ESTO ERA LO QUE TE FALTABA
window.addEventListener('load', initCamera);
</script>
</body>
</html>
