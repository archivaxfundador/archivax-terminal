<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARCHIVAX - MENU</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h1{color:#f00;letter-spacing:4px;font-size:28px;margin-bottom:6px;text-shadow:0 0 20px #f00}
.sub{color:#666;font-size:10px;margin-bottom:30px;letter-spacing:2px}
.card{width:100%;max-width:340px;background:#0a0a0a;border:1px solid #222;border-radius:16px;padding:20px;margin-bottom:16px}
input{width:100%;background:#111;border:1px solid #333;color:#fff;padding:14px;border-radius:10px;margin-bottom:10px;font-family:monospace;outline:none}
input:focus{border-color:#f00}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer;margin-bottom:10px;display:block;text-align:center;text-decoration:none}
.btn-red{background:#f00;color:#fff;box-shadow:0 0 20px rgba(255,0,0,0.4)}
.btn-dark{background:#111;border:1px solid #333;color:#888}
.btn-ghost{background:transparent;border:1px dashed #444;color:#555;font-size:11px}
.btn:active{transform:scale(0.97)}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.info{font-size:9px;color:#444;text-align:center;margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<h1>ARCHIVAX</h1>
<div class="sub">EXPERIENCIA PARANORMAL REAL</div>

<div class="card">
<input id="email" type="email" placeholder="Email" autocomplete="email">
<input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
<button class="btn btn-red" onclick="login()">INICIAR SESIÓN</button>
<div class="row">
<button class="btn btn-dark" onclick="registro()">REGISTRO</button>
<button class="btn btn-dark" onclick="invitado()">INVITADO 10 MIN</button>
</div>
<button class="btn btn-ghost" onclick="entrarDirecto()">ENTRAR DIRECTO A CÁMARA (sin login)</button>
<div id="msg" class="info"></div>
</div>

<div class="card" style="border-color:#f00">
<button class="btn btn-red" onclick="location.href='/camara.html'">👁️ IR A CÁMARA AHORA</button>
<div class="info">Si los botones de arriba no andan, usa este. Entra directo a /camara.html<br>
Estado: <span id="estado">-</span></div>
</div>

<script>
// SIMPLE Y A PRUEBA DE ERRORES - SIN DEPENDENCIAS
function log(t){ document.getElementById('msg').innerText=t; document.getElementById('estado').innerText=t; console.log(t); }

function login(){
 try{
  let e=document.getElementById('email').value.trim();
  let p=document.getElementById('pass').value.trim();
  if(!e||!p){ log('Poné email y contraseña'); return; }
  localStorage.setItem('archivax_email',e);
  localStorage.setItem('archivax_role','registered');
  localStorage.setItem('archivax_login','1');
  log('Login OK como registrado');
  setTimeout(()=>location.href='/camara.html',400);
 }catch(err){ log('Error login: '+err.message); }
}

function registro(){
 try{
  let e=document.getElementById('email').value.trim();
  let p=document.getElementById('pass').value.trim();
  if(!e||!p){ log('Para registro poné email y contraseña'); return; }
  localStorage.setItem('archivax_email',e);
  localStorage.setItem('archivax_role','registered');
  localStorage.setItem('archivax_login','1');
  log('Registro OK - Entrando...');
  setTimeout(()=>location.href='/camara.html',400);
 }catch(err){ log('Error registro: '+err.message); }
}

function invitado(){
 try{
  if(localStorage.getItem('archivax_guest_blocked')==='1'){ log('Ya usaste 10 min de invitado. Registrate.'); return; }
  localStorage.setItem('archivax_role','guest');
  localStorage.setItem('archivax_login','0');
  localStorage.setItem('archivax_guest_start',Date.now());
  log('Entrando como invitado 10 min');
  setTimeout(()=>location.href='/camara.html',300);
 }catch(err){ log('Error invitado: '+err.message); }
}

function entrarDirecto(){
 try{
  localStorage.setItem('archivax_role','guest');
  localStorage.setItem('archivax_guest_start',Date.now());
  location.href='/camara.html';
 }catch(err){ location.href='/camara.html'; }
}

// Mostrar estado al cargar
try{
 let role=localStorage.getItem('archivax_role')||'ninguno';
 let blocked=localStorage.getItem('archivax_guest_blocked');
 document.getElementById('estado').innerText='Rol: '+role+' Bloqueado: '+(blocked||'no');
}catch(e){
 document.getElementById('estado').innerText='localStorage bloqueado, pero botón IR A CÁMARA funciona igual';
}
</script>
</body>
</html>
