<div style="margin-top:22px;border:1px solid #ffaa00;border-radius:12px;padding:16px;text-align:center;background:#1a1500">
<div style="font-size:12px;color:#ffaa00;font-weight:bold;margin-bottom:12px">💎 HACETE PREMIUM</div>

<button onclick="pagarPremium('mensual')" style="width:100%;padding:14px;border-radius:10px;background:#ffaa00;color:#000;font-weight:900;border:none;cursor:pointer;margin-bottom:10px">
💳 MENSUAL $6.999 / mes
</button>

<button onclick="pagarPremium('anual')" style="width:100%;padding:14px;border-radius:10px;background:#00ff41;color:#000;font-weight:900;border:none;cursor:pointer">
💳 ANUAL $71.389 - 15% OFF (ahorras $12.599)
</button>

<p style="font-size:9px;color:#888;margin-top:10px">Pago automático con MercadoPago. Se activa al instante.</p>
</div>

<script>
async function pagarPremium(plan){
 const me=await fetch('/api/me').then(r=>r.json());
 if(!me.email || me.type==='guest' || me.type==='none'){
  alert('⚠️ Tenés que REGISTRARTE para pagar PREMIUM.\nAsí no perdés tu acceso.');
  location.href='/index.html';
  return;
 }
 const fp=localStorage.getItem('archiviax-fp')||'';
 const r=await fetch(`/api/create-payment?plan=${plan}&fp=${fp}`);
 const j=await r.json();
 if(j.ok && j.init_point) location.href=j.init_point;
 else alert('Error MP: '+(j.error||'reintentá'));
}
</script>
