<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ARCHIVAX - MENU</title>
<style>
body{margin:0;background:#050505;color:#fff;font-family:monospace;padding:16px}
.top{border:1px solid #00ff41;border-radius:14px;padding:14px;text-align:center;margin-bottom:16px}
h1{color:#00ff41;margin:0;letter-spacing:5px}
.status{font-size:11px;color:#aaa;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.card{border:1px solid #222;border-radius:12px;padding:20px 10px;text-align:center;background:#0a0a0a;cursor:pointer}
.card b{display:block;margin-top:8px;font-size:11px}
.card small{color:#666;font-size:9px}
.card:hover{border-color:#00ff41}
.guest-bar{background:#1a0a00;border:1px solid #ff6600;border-radius:10px;padding:10px;text-align:center;color:#ffaa00;font-size:11px;margin-bottom:14px;display:none}
.premium-box{border:1px solid #ffaa00;border-radius:12px;padding:16px;text-align:center;background:#1a1500;margin-top:10px}
</style>
</head>
<body>
<div class="top">
<h1>ARCHIVAX</h1>
<div id="status" class="status">Cargando sesión...</div>
<div id="timer" style="color:#ff6600;font-weight:bold;margin-top:6px"></div>
</div>
<div id="guestBar" class="guest-bar">👻 MODO INVITADO - 10 MIN - Probá todo</div>

<div class="grid">
<div class="card" onclick="location.href='/camara.html'"><div>👁️</div><b>CAMARA EVP</b><small>camara.html</small></div>
<div class="card" onclick="location.href='/evp.html'"><div>🎙️</div><b>AUDIO EVP</b><small>evp.html</small></div>
<div class="card" onclick="location.href='/ouija-evp.html'"><div>🔮</div><b>OUIJA EVP</b><small>ouija-evp.html</small></div>
<div class="card" onclick="location.href='/llamada.html'"><div>🎥</div><b>LLAMADA + VIDEO</b><small>llamada.html</small></div>
</div>

<div class="premium-box">
<div style="font-size:12px;color:#ffaa00;font-weight:bold;margin-bottom:12px">💎 HACETE PREMIUM</div>
<button onclick="pagarPremium('mensual')" style="width:100%;padding:14px;border-radius:10px;background:#ffaa00;color:#000;font-weight:900;border:none;margin-bottom:10px">💳 MENSUAL $6.999 / mes</button>
<button onclick="pagarPremium('anual')" style="width:100%;padding:14px;border-radius:10px;background:#00ff41;color:#000;font-weight:900;border:none">💳 ANUAL $71.389 - 15% OFF (ahorras $12.599)</button>
<p style="font-size:9px;color:#888;margin-top:10px">Pago automático MercadoPago. Si sos invitado te pide registrarte.</p>
<div id="premMsg" style="color:#0f0;font-size:11px;margin-top:8px"></div>
</div>

<button style="width:100%;margin-top:14px;background:transparent;border:1px solid #333;color:#666;padding:10px;border-radius:8px;font-size:10px" onclick="logout()">Cerrar sesión</button>

<script>
async function check(){
 const r=await fetch('/api/me'); const j=await r.json();
 const st=document.getElementById('status');
 if(!j || j.type==='none'){ location.href='/index.html'; return; }
 if(j.type==='guest'){
  st.innerText='👻 INVITADO - 10 MIN - Podés usar camara, evp, ouija y llamada';
  document.getElementById('guestBar').style.display='block';
  let left=Math.max(0,Math.floor((j.exp-Date.now())/1000));
  setInterval(()=>{left--; if(left<=0){alert('Se acabaron los 10 min'); location.href='/index.html';} document.getElementById('timer').innerText='⏳ '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');},1000);
 } else if(j.type==='founder'){ st.innerText='👑 FUNDADOR - Ilimitado'; }
 else { st.innerText=j.premium?'💎 PREMIUM '+j.premium+' - '+j.email : '✅ '+j.email; if(j.premium) document.getElementById('premMsg').innerText='✅ Premium activo'; }
 if(new URLSearchParams(location.search).get('premium')==='ok'){ alert('Pago aprobado! Premium activo'); history.replaceState({},'','/menu.html'); }
}
async function pagarPremium(plan){
 const me=await fetch('/api/me').then(r=>r.json());
 if(!me.email || me.type==='guest'){ alert('⚠️ Tenés que REGISTRARTE para pagar PREMIUM'); location.href='/index.html'; return; }
 const fp=localStorage.getItem('archiviax-fp')||'';
 const r=await fetch(`/api/create-payment?plan=${plan}&fp=${fp}`); const j=await r.json();
 if(j.ok && j.init_point) location.href=j.init_point; else alert('Error: '+(j.error||JSON.stringify(j)));
}
async function logout(){ await fetch('/api/logout'); location.href='/index.html'; }
check();
</script>
</body>
</html>
