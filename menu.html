<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVAX - MENU</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#0f0;font-family:monospace;min-height:100vh;padding:20px}
.header{text-align:center;border:2px solid #0f0;padding:15px;margin-bottom:20px;background:rgba(0,255,0,.05)}
.header h1{font-size:24px;letter-spacing:3px}.header p{font-size:10px;color:#888;margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid #0f0;background:linear-gradient(180deg,#111,#000);padding:18px;text-align:center;cursor:pointer;position:relative;transition:0.2s}
.card:active{transform:scale(0.97);background:#0f0;color:#000}
.card.icon{font-size:38px;margin-bottom:8px}
.card h3{font-size:13px;margin-bottom:4px}.card p{font-size:9px;color:#888}
.card.disabled{border-color:#333;color:#333;opacity:0.5;pointer-events:none}
.card.disabled p{color:#333}
.badge{position:absolute;top:5px;right:5px;background:yellow;color:#000;font-size:8px;padding:2px 5px;font-weight:bold}
.badge.soon{background:#333;color:#888}
.footer{margin-top:25px;text-align:center;font-size:9px;color:#444}
#status{margin-top:10px;font-size:10px;color:#0f0;text-align:center}
</style>
</head>
<body>
<div class="header">

<div id="status">VERIFICANDO ACCESO...</div>
</div>

<div class="card" onclick="location.href='app.html'">

<div class="icon">📞</div>

<p>En construcción</p>
</div>
</div>

<div class="footer">archiviax.com.ar - Sistema Premium Activado</div>

<script>
const SUPA_URL='https://yxfzvogiladjupikgqyt.supabase.co'
const SUPA_ANON='sb_publishable_a1vTW1SY3abxVyn2qFDNlA_K_n3xgOc'
const supa=supabase.createClient(SUPA_URL,SUPA_ANON)
async function check(){const{data:{session}}=await supa.auth.getSession();const el=document.getElementById('status');if(session){const meta=session.user.user_metadata||{};el.textContent=`PREMIUM ACTIVO HASTA ${new Date(meta.expires_at).toLocaleDateString()}`}else{el.textContent='MODO PRUEBA 30 MIN - GRATIS';}}check();
</script>
