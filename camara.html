<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>CAMARA SLS - REAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:monospace}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#top{position:fixed;top:0;left:0;right:0;padding:8px 12px;background:linear-gradient(#000 60%,transparent);color:#00ff41;font-size:11px;display:flex;justify-content:space-between;z-index:10}
#bottom{position:fixed;bottom:12px;left:12px;right:12px;display:flex;gap:8px;z-index:10}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid #333;background:#111c;color:#aaa;font-size:11px;font-weight:bold}
.btn.on{border-color:#00ff41;color:#00ff41;background:#000}
#meter{position:fixed;left:12px;top:48px;width:4px;height:80px;background:#222;border-radius:10px;overflow:hidden;z-index:10}
#meter div{position:absolute;bottom:0;width:100%;background:#ff0000;height:0%}
</style>
<script type="importmap">
{"imports":{"@mediapipe/tasks-vision":"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm/vision_bundle.mjs"}}
</script>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="top"><span>👁️ GHOST SLS - RED</span><span id="status" style="color:#666">Cargando...</span></div>
<div id="meter"><div id="fill"></div></div>
<div id="bottom">
<button class="btn" onclick="location.href='/menu.html'">MENU</button>
<button class="btn on" id="btnAudio">🎧 EVP</button>
<button class="btn on" id="btnSls">SLS ON</button>
</div>
<script type="module">
import {PoseLandmarker, FilesetResolver} from "@mediapipe/tasks-vision";
let video=document.getElementById('video'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let poseLandmarker, running=true, lastDet=0;
let status=document.getElementById('status'), fill=document.getElementById('fill');

async function init(){
 canvas.width=innerWidth; canvas.height=innerHeight;
 // CAMARA SOLA - audio separado para que no haga zumbido
 let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false});
 video.srcObject=stream;
 await video.play();

 // AUDIO SOLO PARA MEDIR, sin salir por parlante
 let aStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}});
 let aCtx=new AudioContext();
 let src=aCtx.createMediaStreamSource(aStream);
 let hp=aCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=150;
 let an=aCtx.createAnalyser(); an.fftSize=512;
 src.connect(hp); hp.connect(an);
 setInterval(()=>{ let d=new Uint8Array(an.frequencyBinCount); an.getByteFrequencyData(d); let avg=d.slice(5,40).reduce((a,b)=>a+b,0)/35; fill.style.height=Math.min(100,avg*1.5)+'%'; if(avg>30) status.innerText='VOZ '+avg.toFixed(0); },150);

 // POSE SLS REAL
 let files=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
 poseLandmarker=await PoseLandmarker.createFromOptions(files,{
  baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},
  runningMode:"VIDEO", numPoses:2, minPoseDetectionConfidence:0.4, minTrackingConfidence:0.4
 });
 status.innerText='Mové lento';
 loop();
}

function loop(){
 if(!running||!poseLandmarker||video.readyState<2){ requestAnimationFrame(loop); return; }
 let res=poseLandmarker.detectForVideo(video, performance.now());
 ctx.clearRect(0,0,canvas.width,canvas.height);
 if(res.landmarks && res.landmarks.length>0){
  res.landmarks.forEach(lm=>{
   drawSLS(lm);
   if(Date.now()-lastDet>2000){ lastDet=Date.now(); status.innerText='👻 ENTIDAD'; status.style.color='#f00'; setTimeout(()=>{status.innerText='Escaneando'; status.style.color='#666'},1500); }
  });
 }
 requestAnimationFrame(loop);
}

function drawSLS(landmarks){
 // mapa huesos como Kinect
 const bones=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,29],[28,30],[29,31],[30,32]];
 ctx.strokeStyle='#ff0000'; ctx.lineWidth=3; ctx.shadowColor='#ff0000'; ctx.shadowBlur=10; ctx.lineCap='round';
 bones.forEach(([a,b])=>{
  let p1=landmarks[a], p2=landmarks[b];
  if(p1 && p2 && p1.visibility>0.3 && p2.visibility>0.3){
   ctx.beginPath();
   ctx.moveTo((1-p1.x)*canvas.width, p1.y*canvas.height);
   ctx.lineTo((1-p2.x)*canvas.width, p2.y*canvas.height);
   ctx.stroke();
  }
 });
 ctx.fillStyle='#ff0000';
 landmarks.forEach(p=>{
  if(p.visibility>0.4){
   ctx.beginPath(); ctx.arc((1-p.x)*canvas.width, p.y*canvas.height, 4,0,Math.PI*2); ctx.fill();
  }
 });
 ctx.shadowBlur=0;
}

document.getElementById('btnSls').onclick=(e)=>{ running=!running; e.target.innerText=running?'SLS ON':'SLS OFF'; e.target.classList.toggle('on'); if(!running) ctx.clearRect(0,0,canvas.width,canvas.height); if(running) loop(); };
document.getElementById('btnAudio').onclick=(e)=>{ e.target.classList.toggle('on'); };

window.addEventListener('resize',()=>{ canvas.width=innerWidth; canvas.height=innerHeight; });
init();
</script>
</body>
</html>
