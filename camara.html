<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARCHIVAX SLS - GHOST TUBE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:monospace}
#video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#top{position:fixed;top:0;left:0;right:0;height:38px;background:rgba(0,0,0,0.8);border-bottom:1px solid #00ff41;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#00ff41;font-size:11px;z-index:10;letter-spacing:1px}
#bottom{position:fixed;bottom:0;left:0;right:0;padding:12px;display:flex;gap:10px;z-index:10;background:linear-gradient(transparent,#000)}
.btn{flex:1;background:#111;border:1px solid #333;color:#888;padding:13px;border-radius:12px;font-size:11px;font-weight:700}
.btn.active{border-color:#00ff41;color:#00ff41}
#dot{width:8px;height:8px;border-radius:50%;background:#f00;display:inline-block;margin-right:6px;box-shadow:0 0 8px #f00}
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<div id="top"><span><span id="dot"></span>SLS GHOST TUBE MODE</span><span id="status">Iniciando IA...</span></div>
<div id="bottom">
<button class="btn" onclick="location.href='/menu.html'">MENU</button>
<button class="btn active" id="bSls">SLS ON</button>
<button class="btn" id="bRec">● REC</button>
</div>

<script type="module">
import {PoseLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const status=document.getElementById('status');
let landmarker, running=true;

async function init(){
 canvas.width=window.innerWidth; canvas.height=window.innerHeight;
 // camara trasera, sin audio para que no haga ese zumbido horrible
 const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});
 video.srcObject=stream;
 await new Promise(r=>video.onloadedmetadata=r);
 await video.play();
 status.textContent='Cargando modelo...';
 const fileset=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
 landmarker=await PoseLandmarker.createFromOptions(fileset,{
  baseOptions:{modelAssetPath:`https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task`,delegate:"GPU"},
  runningMode:"VIDEO", numPoses:3, minPoseDetectionConfidence:0.5, minPosePresenceConfidence:0.5, minTrackingConfidence:0.5
 });
 status.textContent='Listo - Apunta a una persona';
 requestAnimationFrame(loop);
}

let lastTime=0;
async function loop(){
 if(!running ||!landmarker){ requestAnimationFrame(loop); return; }
 if(video.currentTime!==lastTime){
  lastTime=video.currentTime;
  const result=landmarker.detectForVideo(video, performance.now());
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(result.landmarks && result.landmarks.length>0){
   result.landmarks.forEach((lm, idx)=>{
    drawGhostTube(lm);
    status.textContent=`ENTIDAD ${idx+1} DETECTADA`; status.style.color='#ff0000';
   });
  } else {
   status.textContent='Escaneando...'; status.style.color='#00ff41';
  }
 }
 requestAnimationFrame(loop);
}

function drawGhostTube(lm){
 // ESTILO GHOST TUBE EXACTO - rojo neón
 ctx.lineWidth=4; ctx.strokeStyle='#ff0000'; ctx.fillStyle='#ff0000';
 ctx.shadowColor='#ff0000'; ctx.shadowBlur=14; ctx.lineCap='round'; ctx.lineJoin='round';
 const bones=[[11,12],[11,13],[13,15],[15,17],[12,14],[14,16],[16,18],[11,23],[12,24],[23,24],[23,25],[25,27],[27,29],[24,26],[26,28],[28,30]];
 const toX=x=> (1-x)*canvas.width; // espejo como ghost tube
 const toY=y=> y*canvas.height;
 // lineas
 bones.forEach(([a,b])=>{
  const p1=lm[a], p2=lm[b];
  if(p1 && p2 && p1.visibility>0.4 && p2.visibility>0.4){
   ctx.beginPath(); ctx.moveTo(toX(p1.x),toY(p1.y)); ctx.lineTo(toX(p2.x),toY(p2.y)); ctx.stroke();
  }
 });
 // puntos articulaciones
 lm.forEach(p=>{
  if(p.visibility>0.5){
   ctx.beginPath(); ctx.arc(toX(p.x),toY(p.y), p.visibility>0.8?7:4, 0, Math.PI*2); ctx.fill();
   ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(toX(p.x),toY(p.y),2,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ff0000';
  }
 });
 ctx.shadowBlur=0;
 // etiqueta
 const head=lm[0]; if(head){ ctx.fillStyle='#ff0000'; ctx.font='bold 12px monospace'; ctx.fillText('ANOMALY', toX(head.x)-28, toY(head.y)-25); }
}

document.getElementById('bSls').onclick=(e)=>{ running=!running; e.target.textContent=running?'SLS ON':'SLS OFF'; e.target.classList.toggle('active'); if(!running) ctx.clearRect(0,0,canvas.width,canvas.height); if(running) loop(); };
window.addEventListener('resize',()=>{ canvas.width=innerWidth; canvas.height=innerHeight; });
init();
</script>
</body>
</html>
