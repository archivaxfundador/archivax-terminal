<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVAX CAM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden}
#v{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#111}
#sombra{position:fixed;bottom:-20px;left:50%;transform:translateX(-50%);width:75%;max-width:380px;height:92%;z-index:5;pointer-events:none;animation:float 3.5s ease-in-out infinite}
#sombra img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 25px #000) brightness(0.9)}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-18px)}}
#ui{position:fixed;top:0;left:0;width:100%;z-index:20;padding:15px}
#btn{width:100%;padding:20px;background:#000;color:#0f0;border:2px solid #0f0;font-size:22px;font-weight:bold}
#msg{color:#0f0;margin-top:12px;text-align:center;font-family:monospace;font-size:13px;background:rgba(0,0,0,.6);padding:6px}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<!-- ACA ESTA LA CLAVE: usa tu nombre largo sin renombrar -->
<div id="sombra"><img src="831166917_1727456055150015_1578838182527702381_n.webp.webp?v=3" onerror="this.src='shadow.png'"></div>
<div id="ui">
<button id="btn">ACTIVAR CAMARA</button>
<div id="msg">Listo. Tocá ACTIVAR.</div>
</div>
<script>
const v=document.getElementById('v');
const b=document.getElementById('btn');
const m=document.getElementById('msg');
b.onclick=async()=>{
m.textContent='Pidiendo permiso...';
try{
const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
v.srcObject=stream;
await v.play();
m.textContent='CAMARA OK';
b.style.display='none';
}catch(err){
m.textContent='ERROR: '+err.name+' - Tocá el candadito 🔒 arriba > Permisos > Cámara > Permitir. Y abrí en Chrome, no en Instagram.';
}
};
</script>
</body>
</html>
