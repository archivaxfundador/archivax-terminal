<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ARCHIVAX SLS REAL</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:monospace}
#video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#000}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none}
#ui{position:fixed;top:0;left:0;width:100%;z-index:20;padding:8px;display:flex;flex-direction:column;gap:6px}
.btn{padding:12px;background:#000;color:#0f0;border:1px solid #0f0;font-size:12px;flex:1;text-transform:uppercase}
.btn-main{width:100%;padding:18px;font-size:18px;border:2px solid #0f0}
.row{display:flex;gap:6px}
#status{color:#0f0;background:rgba(0,0,0,.85);padding:6px;text-align:center;font-size:11px;border:1px solid #0f0}
#freq{color:#0f0;text-align:center;font-size:13px;background:rgba(0,0,0,.8);padding:6px;letter-spacing:1px}
#controls{position:fixed;bottom:0;left:0;width:100%;z-index:20;background:rgba(0,0,0,.95);border-top:2px solid #0f0;padding:10px;display:flex;flex-direction:column;gap:8px}
#holdBtn{padding:20px;background:#111;color:#0f0;border:2px solid #0f0;font-size:16px;font-weight:bold}
#holdBtn.listening{background:#0f0;color:#000;animation:pulse 0.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="ui">
<button id="btn" class="btn btn-main">INICIAR SLS BLACK REAL</button>
<div class="row">
<button id="switchCam" class="btn">CAM TRASERA / FRONTAL</button>
<button id="menuBtn" class="btn">☰ MENU</button>
</div>
<div id="status">Listo para iniciar</div>
<div id="freq">SLS: ESPERANDO</div>
</div>

<div id="controls">
<button id="holdBtn">🎤 MANTENÉ APRETADO Y PREGUNTÁ: "¿Hay alguien aquí?"</button>
<div class="row">
<button id="evpBtn" class="btn">EVP RADIO ON</button>
<button id="scanBtn" class="btn">SCAN 88-108</button>
</div>
</div>

<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const btn=document.getElementById('btn');
const switchCamBtn=document.getElementById('switchCam');
const menuBtn=document.getElementById('menuBtn');
const statusEl=document.getElementById('status');
const freqEl=document.getElementById('freq');
const evpBtn=document.getElementById('evpBtn');
const scanBtn=document.getElementById('scanBtn');
const holdBtn=document.getElementById('holdBtn');

let W,H, detector=null, facing='environment', stream=null, evpOn=false;
let audioCtx=null, noiseNode=null, filter=null, gainNode=null;
let recognition=null, isListening=false;

function resize(){W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight;}
window.addEventListener('resize',resize); resize();

function drawBlackSLS(keypoints){
  const get=n=>keypoints.find(k=>k.name===n);
  const pairs=[['left_shoulder','right_shoulder'],['left_shoulder','left_elbow'],['left_elbow','left_wrist'],['right_shoulder','right_elbow'],['right_elbow','right_wrist'],['left_shoulder','left_hip'],['right_shoulder','right_hip'],['left_hip','right_hip'],['left_hip','left_knee'],['left_knee','left_ankle'],['right_hip','right_knee'],['right_knee','right_ankle'],['left_shoulder','right_hip'],['right_shoulder','left_hip']];
  ctx.save();
  ctx.strokeStyle='#000000';
  ctx.lineWidth=7;
  ctx.lineCap='round';
  ctx.shadowColor='#00ff00';
  ctx.shadowBlur=18;
  pairs.forEach(([a,b])=>{
    const p1=get(a), p2=get(b);
    if(p1 && p2 && p1.score>0.35 && p2.score>0.35){
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
    }
  });
  ctx.shadowBlur=0;
  keypoints.forEach(k=>{
    if(k.score>0.35){
      ctx.fillStyle='#00ff00';
      ctx.beginPath(); ctx.arc(k.x,k.y,6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.stroke();
    }
  });
  ctx.restore();
}

async function initDetector(){
  statusEl.textContent='Cargando SLS BLACK...';
  try{
    await tf.setBackend('webgl'); await tf.ready();
    detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, {modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING});
    statusEl.textContent='IA LISTA - Tocá INICIAR';
  }catch(e){ statusEl.textContent='Error IA: '+e.message; }
}

async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});
    video.srcObject=stream; await video.play();
    video.style.transform= facing==='user'? 'scaleX(-1)' : 'none';
    if(!detector) await initDetector();
    detectLoop();
    statusEl.textContent='SLS BLACK ACTIVO - Apuntá a una persona';
  }catch(e){ statusEl.textContent='Permitir cámara en el candado 🔒: '+e.message; }
}

async function detectLoop(){
  if(!detector || video.paused || video.readyState<2){ requestAnimationFrame(detectLoop); return; }
  ctx.clearRect(0,0,W,H);
  try{
    const poses=await detector.estimatePoses(video, {flipHorizontal: facing==='user'});
    if(poses && poses.length>0 && poses[0].score>0.35){
      drawBlackSLS(poses[0].keypoints);
      statusEl.textContent=`SLS LOCK - PERSONA ${Math.floor(poses[0].score*100)}%`;
      freqEl.textContent='FORMA HUMANA DETECTADA - ESQUELETO NEGRO';
    }else{
      statusEl.textContent='SLS: SCAN VACIO - BUSCANDO FORMAS';
      freqEl.textContent=`${(88+Math.random()*20).toFixed(1)} MHz - SCAN...`;
    }
  }catch(e){}
  requestAnimationFrame(detectLoop);
}

// EVP REAL - Radio que SI suena, sin audios externos bloqueados
function initAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
}
function startRadio(){
  initAudio();
  if(noiseNode) try{noiseNode.stop();}catch{}
  const bufferSize=audioCtx.sampleRate*4;
  const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){
    data[i]=(Math.random()*2-1)*0.8;
    if(i%1000<10) data[i]+= (Math.random()-0.5)*0.5; // pops de radio
  }
  noiseNode=audioCtx.createBufferSource(); noiseNode.buffer=buffer; noiseNode.loop=true;
  filter=audioCtx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=800; filter.Q.value=8;
  gainNode=audioCtx.createGain(); gainNode.gain.value=0.35;
  noiseNode.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination);
  noiseNode.start();
  // Barrido FM real
  let f=88;
  setInterval(()=>{ if(evpOn && filter){ f+= (Math.random()-0.5)*2; if(f<88)f=88; if(f>108)f=108; filter.frequency.value=300+Math.random()*2500; freqEl.textContent=`${f.toFixed(1)} MHz - SCAN EVP REAL`; } },120);
}
function stopRadio(){ if(noiseNode){try{noiseNode.stop();}catch{} noiseNode=null;} }

// Respuestas EVP reales - voces susurradas pregrabadas en el código con WebAudio
const EVP_ANSWERS=[
  {text:"sí... estoy aquí", rate:0.7, pitch:0.3},
  {text:"no te vayas", rate:0.6, pitch:0.4},
  {text:"atrás tuyo", rate:0.5, pitch:0.2},
  {text:"ayuda", rate:0.8, pitch:0.5},
  {text:"¿quién eres tú?", rate:0.65, pitch:0.3},
  {text:"no...", rate:0.5, pitch:0.2},
  {text:"te veo", rate:0.6, pitch:0.35},
  {text:"vete", rate:0.7, pitch:0.25},
];
function answerEVP(){
  initAudio();
  const ans=EVP_ANSWERS[Math.floor(Math.random()*EVP_ANSWERS.length)];
  freqEl.textContent=`88-108 MHz - [RESPUESTA]: "${ans.text.toUpperCase()}"`;
  // Efecto voz fantasma: oscilador grave + ruido
  const osc=audioCtx.createOscillator(); osc.frequency.value=80+Math.random()*60;
  const oscGain=audioCtx.createGain(); oscGain.gain.value=0;
  oscGain.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime+0.1);
  oscGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime+1.2);
  osc.connect(oscGain); oscGain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime+1.2);
  // Voz con eco
  const utter=new SpeechSynthesisUtterance(ans.text);
  utter.rate=ans.rate; utter.pitch=ans.pitch; utter.volume=1;
  speechSynthesis.speak(utter);
  if(filter) filter.frequency.value=150+Math.random()*500;
}

btn.onclick=async()=>{
  btn.textContent='INICIANDO SLS...';
  await startCamera();
  btn.style.display='none';
};
switchCamBtn.onclick=()=>{ facing=facing==='environment'?'user':'environment'; startCamera(); };
menuBtn.onclick=()=>{ if(stream) stream.getTracks().forEach(t=>t.stop()); location.href='/'; };

evpBtn.onclick=()=>{
  evpOn=!evpOn;
  if(evpOn){ startRadio(); evpBtn.textContent='EVP OFF'; statusEl.textContent='EVP RADIO REAL ON - 88-108 MHz'; }
  else{ stopRadio(); evpBtn.textContent='EVP RADIO ON'; statusEl.textContent='EVP OFF'; }
};
scanBtn.onclick=()=>{
  if(!evpOn) evpBtn.onclick();
  answerEVP();
  let count=0;
  const int=setInterval(()=>{ if(++count>15) clearInterval(int); if(evpOn && Math.random()<0.3) answerEVP(); },400);
};

// Preguntar con el mic - mantené apretado
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR(); recognition.lang='es-AR'; recognition.continuous=false; recognition.interimResults=false;
  recognition.onstart=()=>{ isListening=true; holdBtn.classList.add('listening'); holdBtn.textContent='🎤 ESCUCHANDO... PREGUNTÁ'; };
  recognition.onend=()=>{ isListening=false; holdBtn.classList.remove('listening'); holdBtn.textContent='🎤 MANTENÉ APRETADO Y PREGUNTÁ'; };
  recognition.onresult=(e)=>{
    const q=e.results[0][0].transcript;
    freqEl.textContent=`PREGUNTA: "${q}"`;
    setTimeout(()=>{ answerEVP(); }, 1200+Math.random()*1000);
  };
}
holdBtn.addEventListener('touchstart',(e)=>{ e.preventDefault(); if(recognition &&!isListening) try{recognition.start();}catch{} });
holdBtn.addEventListener('touchend',(e)=>{ e.preventDefault(); if(recognition && isListening) try{recognition.stop();}catch{} });
holdBtn.addEventListener('mousedown',()=>{ if(recognition &&!isListening) try{recognition.start();}catch{} });
holdBtn.addEventListener('mouseup',()=>{ if(recognition && isListening) try{recognition.stop();}catch{} });

initDetector();
</script>
</body>
</html>
