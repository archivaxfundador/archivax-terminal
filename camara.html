<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ARCHIVAX SLS BLACK REAL</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:monospace}
#video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#000}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none}
#ui{position:fixed;top:0;left:0;width:100%;z-index:20;padding:8px;display:flex;flex-direction:column;gap:6px}
.btn{padding:12px;background:#000;color:#0f0;border:1px solid #0f0;font-size:12px;flex:1}
.btn-main{width:100%;padding:18px;font-size:18px;border:2px solid #0f0;letter-spacing:2px}
.row{display:flex;gap:6px}
#status{color:#0f0;background:rgba(0,0,0,.85);padding:6px;text-align:center;font-size:11px;border:1px solid #0f0}
#freq{color:#0f0;text-align:center;font-size:12px;background:rgba(0,0,0,.7);padding:4px}
#controls{position:fixed;bottom:0;left:0;width:100%;z-index:20;background:rgba(0,0,0,.92);border-top:1px solid #0f0;padding:8px}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="ui">
<button id="btn" class="btn btn-main">INICIAR SLS BLACK REAL</button>
<div class="row">
<button id="switchCam" class="btn">CAM FRONTAL/TRASERA</button>
<button id="menuBtn" class="btn">☰ MENU</button>
</div>
<div id="status">Cargando IA SLS...</div>
<div id="freq">88.0 MHz - - -</div>
</div>
<div id="controls">
<div class="row">
<button id="evpBtn" class="btn">EVP REAL ON/OFF</button>
<button id="scanBtn" class="btn">SCAN 88-108</button>
</div>
</div>

<audio id="static" loop crossorigin="anonymous" src="https://cdn.freesound.org/previews/19/19226_60348-lq.mp3"></audio>
<audio id="evp1" preload="auto" crossorigin="anonymous" src="https://cdn.freesound.org/previews/132/132101_2337290-lq.mp3"></audio>
<audio id="evp2" preload="auto" crossorigin="anonymous" src="https://cdn.freesound.org/previews/415/415362_5121236-lq.mp3"></audio>
<audio id="evp3" preload="auto" crossorigin="anonymous" src="https://cdn.freesound.org/previews/270/270310_5121236-lq.mp3"></audio>

<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const btn=document.getElementById('btn');
const switchCamBtn=document.getElementById('switchCam');
const menuBtn=document.getElementById('menuBtn');
const statusEl=document.getElementById('status');
const freqEl=document.getElementById('freq');
const evpBtn=document.getElementById('evpBtn');
const scanBtn=document.getElementById('scanBtn');
const staticAudio=document.getElementById('static');
const evpAudios=[document.getElementById('evp1'),document.getElementById('evp2'),document.getElementById('evp3')];

let W,H, detector=null, facing='environment', stream=null, evpOn=false, ghost=null, lastPoses=[];
W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight;});

class Ghost{
  constructor(){this.x=Math.random()*0.6+0.2; this.y=0.4; this.vx=(Math.random()-0.5)*0.004; this.phase=0; this.visible=true;}
  update(){this.phase+=0.06; this.x+=this.vx; if(this.x<0.1||this.x>0.9) this.vx*=-1; if(Math.random()<0.005) this.visible=!this.visible;}
  draw(){
    if(!this.visible) return;
    const cx=this.x*W, cy=this.y*H, s=H*0.38, walk=Math.sin(this.phase)*15;
    ctx.strokeStyle='rgba(0,0,0,0.95)'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.shadowColor='rgba(0,255,0,0.4)'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(cx, cy-s*0.45, s*0.09,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy-s*0.36); ctx.lineTo(cx, cy+s*0.06); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy-s*0.26); ctx.lineTo(cx-s*0.2+walk*0.4, cy-s*0.05); ctx.moveTo(cx, cy-s*0.26); ctx.lineTo(cx+s*0.2-walk*0.4, cy-s*0.05); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy+s*0.06); ctx.lineTo(cx-s*0.12+walk*0.6, cy+s*0.40); ctx.moveTo(cx, cy+s*0.06); ctx.lineTo(cx+s*0.12-walk*0.6, cy+s*0.40); ctx.stroke();
    ctx.shadowBlur=0;
  }
}
ghost=new Ghost();

// SLS REAL - Dibuja esqueleto NEGRO sobre persona detectada por IA
function drawRealSLS(keypoints){
  if(!keypoints) return;
  const get=(name)=>keypoints.find(k=>k.name===name);
  const pairs=[['left_shoulder','right_shoulder'],['left_shoulder','left_elbow'],['left_elbow','left_wrist'],['right_shoulder','right_elbow'],['right_elbow','right_wrist'],['left_shoulder','left_hip'],['right_shoulder','right_hip'],['left_hip','right_hip'],['left_hip','left_knee'],['left_knee','left_ankle'],['right_hip','right_knee'],['right_knee','right_ankle']];

  ctx.save();
  ctx.strokeStyle='#000000'; // ESQUELETO NEGRO como pediste
  ctx.lineWidth=6;
  ctx.lineCap='round';
  ctx.shadowColor='#00ff00';
  ctx.shadowBlur=15;

  pairs.forEach(([a,b])=>{
    const p1=get(a), p2=get(b);
    if(p1 && p2 && p1.score>0.3 && p2.score>0.3){
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }
  });
  // Articulaciones verdes tipo SLS real
  ctx.shadowBlur=0;
  keypoints.forEach(k=>{
    if(k.score>0.3){
      ctx.fillStyle='#00ff00';
      ctx.beginPath(); ctx.arc(k.x,k.y,5,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke();
    }
  });
  ctx.restore();
}

async function initDetector(){
  statusEl.textContent='Cargando IA SLS BLACK...';
  await tf.setBackend('webgl');
  await tf.ready();
  detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, {modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING});
  statusEl.textContent='IA SLS LISTA - Tocá INICIAR';
}

async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});
  video.srcObject=stream; await video.play();
  video.style.transform= facing==='user'? 'scaleX(-1)' : 'none';
  detectLoop();
}

async function detectLoop(){
  if(!detector || video.paused) {requestAnimationFrame(detectLoop); return;}
  ctx.clearRect(0,0,W,H);
  try{
    const poses=await detector.estimatePoses(video);
    if(poses && poses.length>0 && poses[0].keypoints){
      const score=poses[0].score||0;
      if(score>0.3){
        drawRealSLS(poses[0].keypoints);
        statusEl.textContent=`SLS: PERSONA DETECTADA ${Math.floor(score*100)}% | FORMA HUMANA LOCK`;
        freqEl.textContent=`SLS LOCK - FORMA HUMANA DETECTADA`;
      }else{
        ghost.update(); ghost.draw();
        statusEl.textContent=`SLS: BUSCANDO... | FANTASMA ERRANTE ${ghost.visible?'VISIBLE':''}`;
      }
    }else{
      ghost.update(); ghost.draw();
      statusEl.textContent=`SLS: SCAN VACIO - BUSCANDO FORMAS`;
    }
  }catch(e){ ghost.update(); ghost.draw(); }
  requestAnimationFrame(detectLoop);
}

btn.onclick=async()=>{
  btn.textContent='INICIANDO...';
  if(!detector) await initDetector();
  await startCamera();
  btn.style.display='none';
  statusEl.textContent='SLS BLACK REAL ACTIVO';
};

switchCamBtn.onclick=()=>{ facing=facing==='environment'?'user':'environment'; startCamera(); };
menuBtn.onclick=()=>{ if(stream) stream.getTracks().forEach(t=>t.stop()); location.href='/'; };

// EVP REAL con audios reales
evpBtn.onclick=()=>{
  evpOn=!evpOn;
  if(evpOn){
    staticAudio.volume=0.5; staticAudio.play();
    evpBtn.textContent='EVP OFF';
    statusEl.textContent='EVP REAL ON - RADIO 88-108 MHz';
  }else{
    staticAudio.pause();
    evpAudios.forEach(a=>{a.pause(); a.currentTime=0;});
    evpBtn.textContent='EVP REAL ON';
  }
};

scanBtn.onclick=()=>{
  if(!evpOn) evpBtn.onclick();
  let f=88;
  const int=setInterval(()=>{
    f+=0.7+Math.random()*1.3; if(f>108) f=88;
    freqEl.textContent=`${f.toFixed(1)} MHz - SCAN EVP...`;
    if(Math.random()<0.12){
      const a=evpAudios[Math.floor(Math.random()*evpAudios.length)];
      a.currentTime=0; a.volume=0.9; a.playbackRate=0.8+Math.random()*0.4;
      a.play().catch(()=>{});
      freqEl.textContent=`${f.toFixed(1)} MHz - [VOZ REAL CAPTADA]`;
    }
  },150);
  setTimeout(()=>clearInterval(int),5000);
};

initDetector();
</script>
</body>
</html>
