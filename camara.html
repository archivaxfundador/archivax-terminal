<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLS REAL</title>
<style>body{margin:0;background:#000;overflow:hidden}video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}canvas{position:fixed;inset:0;width:100%;height:100%}#t{position:fixed;top:0;left:0;right:0;padding:10px;background:#000a;color:#0f0;font:11px monospace;display:flex;justify-content:space-between}#b{position:fixed;bottom:10px;left:10px;right:10px;display:flex;gap:8px}.b{flex:1;padding:12px;border-radius:10px;background:#111;color:#fff;border:1px solid #333}</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div id="t"><span>SLS RED GHOST</span><span id="s">cargando...</span></div>
<div id="b"><button class="b" onclick="location.href='/menu.html'">MENU</button><button class="b" onclick="location.reload()">RECARGAR</button></div>
<script>
let v=document.getElementById('v'),c=document.getElementById('c'),x=c.getContext('2d'),s=document.getElementById('s');
async function start(){
 c.width=innerWidth; c.height=innerHeight;
 let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
 v.srcObject=stream; await v.play(); s.innerText='SLS LISTA - apunta a persona';
 // SLS FAKE REALISTA pero que no vibra ni molesta - detecta contornos
 setInterval(()=>{
  x.clearRect(0,0,c.width,c.height);
  // para que veas que cambió, dibujo borde rojo
  x.strokeStyle='#f00'; x.lineWidth=2; x.strokeRect(10,40,c.width-20,c.height-80);
  // simulación de detección - si detecta piel / forma
  // acá va a aparecer muñeco solo si hay movimiento grande
 },100);
 // detector de forma humana simple por movimiento - no vibra
 let prev=null, can=document.createElement('canvas'); can.width=40; can.height=30; let cx=can.getContext('2d',{willReadFrequently:true});
 setInterval(()=>{
  cx.drawImage(v,0,0,40,30); let d=cx.getImageData(0,0,40,30).data;
  if(prev){ let mov=0, mx=0, my=0, cnt=0;
   for(let i=0;i<d.length;i+=4){ let diff=Math.abs(d[i]-prev[i]); if(diff>25){ mov++; mx+= (i/4)%40; my+= Math.floor((i/4)/40); cnt++; } }
   if(mov>60){ let ax=mx/cnt/40*c.width, ay=my/cnt/30*c.height; drawMan(ax,ay); s.innerText='👻 ENTIDAD'; s.style.color='#f00'; } else { s.innerText='escaneando...'; s.style.color='#0f0'; }
  }
  prev=new Uint8ClampedArray(d);
 },200);
}
function drawMan(cx,cy){
 x.strokeStyle='#ff0000'; x.lineWidth=4; x.shadowColor='#f00'; x.shadowBlur=10; x.lineCap='round'; x.fillStyle='#f00';
 let sc=120;
 x.beginPath(); x.arc(cx,cy-sc*0.5,16,0,7); x.fill();
 x.beginPath(); x.moveTo(cx,cy-sc*0.35); x.lineTo(cx,cy+sc*0.1); x.stroke();
 x.beginPath(); x.moveTo(cx,cy-sc*0.2); x.lineTo(cx-sc*0.35,cy); x.lineTo(cx-sc*0.45,cy+sc*0.15); x.stroke();
 x.beginPath(); x.moveTo(cx,cy-sc*0.2); x.lineTo(cx+sc*0.35,cy); x.lineTo(cx+sc*0.45,cy+sc*0.15); x.stroke();
 x.beginPath(); x.moveTo(cx,cy+sc*0.1); x.lineTo(cx-sc*0.2,cy+sc*0.5); x.stroke();
 x.beginPath(); x.moveTo(cx,cy+sc*0.1); x.lineTo(cx+sc*0.2,cy+sc*0.5); x.stroke();
 x.shadowBlur=0;
}
start();
</script>
</body>
</html>
