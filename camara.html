<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ARCHIVAX CAM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:monospace}
#v{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#000}
#sombra{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:65%;max-width:350px;height:90%;z-index:2;pointer-events:none;animation:walk 4s ease-in-out infinite}
#sombra img{width:100%;height:100%;object-fit:contain;filter:brightness(0.8) contrast(1.2) drop-shadow(0 0 20px #000)}
@keyframes walk{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-20px) scale(1.02)}}
#ui{position:fixed;top:0;left:0;width:100%;z-index:10;padding:20px;text-align:center}
#btn{width:100%;padding:18px;background:#000;color:#00ff00;border:2px solid #00ff00;font-size:20px;font-weight:bold;letter-spacing:2px}
#msg{color:#00ff00;margin-top:15px;font-size:14px;text-shadow:0 0 5px #00ff00}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="sombra"><img src="shadow.png?v=2" alt=""></div>
<div id="ui">
<button id="btn">ACTIVAR CAMARA</button>
<div id="msg">Listo. Tocá ACTIVAR.</div>
</div>
<script>
const video=document.getElementById('v');
const btn=document.getElementById('btn');
const msg=document.getElementById('msg');
btn.addEventListener('click', async ()=>{
msg.textContent='Pidiendo permiso...';
try{
const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
video.srcObject=s;
await video.play();
msg.textContent='CAMARA ACTIVA';
btn.style.display='none';
}catch(e){
msg.textContent='ERROR: '+e.message+' - Tocá el candado 🔒 arriba y habilitá cámara. Usá Chrome.';
console.error(e);
}
});
</script>
</body>
</html>
