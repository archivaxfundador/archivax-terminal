<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARCHIVAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:monospace}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#top{position:fixed;top:0;left:0;right:0;height:38px;background:#000;border-bottom:1px solid #f00;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#f00;font-size:10px;z-index:10}
#center{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#bottom{position:fixed;bottom:0;left:0;right:0;padding:8px;display:flex;flex-wrap:wrap;gap:6px;z-index:10;background:linear-gradient(transparent,#000 70%)}
.btn{flex:1 1 28%;background:#111;border:1px solid #333;color:#888;padding:12px;border-radius:10px;font-size:10px;font-weight:700}
.btn.active{border-color:#f00;color:#f00}
#evp{position:fixed;left:10px;top:50px;width:38px;background:rgba(0,0,0,0.8);border:1px solid #333;border-radius:8px;padding:4px;z-index:10;text-align:center}
#bar{height:70px;background:#111;border-radius:4px;overflow:hidden;position:relative;margin-top:4px}
#fill{position:absolute;bottom:0;width:100%;background:linear-gradient(#0f0,#f00);height:0%}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="center">
<div style="color:#fff;letter-spacing:2px">ARCHIVAX - EXPERIENCIA REAL</div>
<div style="color:#f00;font-size:9px;margin:6px">Esqueletos + Voces por parlante</div>
<br>
<button id="activar" style="padding:18px 30px;background:#ff0000;color:#fff;border:none;border-radius:14px;font-weight:900;font-size:18px">ACTIVAR EXPERIENCIA</button>
<div id="err" style="color:#ff4444;font-size:11px;margin-top:14px;max-width:280px"></div>
</div>

<div id="top"><span>● ARCHIVAX • PARANORMAL</span><span id="status">Esperando</span></div>
<div id="evp"><div style="font-size:7px;color:#666">EVP</div><div id="db" style="font-size:11px;color:#fff">--</div><div id="bar"><div id="fill"></div></div></div>

<div id="bottom">
<button class="btn" onclick="location.href='/menu.html'">MENU</button>
<button class="btn" id="bCam" style="border-color:#0af;color:#0af">🔄 CAM</button>
<button class="btn active" id="bAudio">👻 VOCES ON</button>
<button class="btn active" id="bSls">DETECTOR ON</button>
<button class="btn" id="bRec">● REC</button>
</div>

<script>
let video=document.getElementById('video'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let vStream, facing='environment', running=true, anomaly=false, audioCtx, analyser, outGain, lastVoice=0;

const FRASES=["estoy aqui","vete","ayudame","detras de ti","te veo","hace frio","no puedo salir","mama","me mataron","cuidado","huye","no estoy solo"];

function hablar(txt){
 if(Date.now()-lastVoice<4500) return; lastVoice=Date.now();
 let u=new SpeechSynthesisUtterance(txt); u.lang='es-AR'; u.rate=0.75; u.pitch=0.1; u.volume=1;
 speechSynthesis.speak(u);
 let box=document.createElement('div'); box.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#f00;color:#fff;padding:14px 22px;border-radius:12px;font-weight:900;z-index:99;box-shadow:0 0 30px #f00';
 box.innerText=txt.toUpperCase(); document.body.appendChild(box); setTimeout(()=>box.remove(),2500);
}

async function startCam(){
 try{
  if(vStream) vStream.getTracks().forEach(t=>t.stop());
  try{ vStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false}); }
  catch{ vStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
  video.srcObject=vStream; await video.play();
  document.getElementById('center').style.display='none';
  document.getElementById('status').innerText='Cámara '+facing;
 }catch(e){ document.getElementById('err').innerText='ERROR CÁMARA: '+e.message+' - Usá https:// y permití cámara'; }
}

async function startAudio(){
 try{
  let aStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  let src=audioCtx.createMediaStreamSource(aStream);
  let hp=audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=200;
  let lp=audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3800;
  let comp=audioCtx.createDynamicsCompressor(); comp.threshold.value=-40; comp.ratio.value=10;
  let gain=audioCtx.createGain(); gain.gain.value=2.0;
  analyser=audioCtx.createAnalyser(); analyser.fftSize=1024;
  outGain=audioCtx.createGain(); outGain.gain.value=0.6; // SE ESCUCHA POR PARLANTE
  src.connect(hp); hp.connect(lp); lp.connect(comp); comp.connect(gain); gain.connect(analyser); gain.connect(outGain); outGain.connect(audioCtx.destination);
  audioLoop();
 }catch(e){ document.getElementById('err').innerText+=' Audio: '+e.message; }
}

function audioLoop(){
 if(!analyser) return requestAnimationFrame(audioLoop);
 let data=new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(data);
 let slice=data.slice(8,90); let avg=slice.reduce((a,b)=>a+b,0)/slice.length; let peak=Math.max(...slice);
 document.getElementById('fill').style.height=Math.min(100,avg*1.8)+'%';
 document.getElementById('db').innerText=avg.toFixed(0);
 if(peak>80 && avg>28 && anomaly && Date.now()-lastVoice>5000){
  setTimeout(()=>hablar(FRASES[Math.floor(Math.random()*FRASES.length)]), 1000);
 }
 requestAnimationFrame(audioLoop);
}

document.getElementById('activar').onclick=async()=>{
 document.getElementById('err').innerText='Iniciando...';
 await startCam();
 await startAudio();
 document.getElementById('status').innerText='EVP por parlante activo';
 // Cargar detector en segundo plano
 loadDetector();
};

document.getElementById('bCam').onclick=async()=>{ facing=facing==='environment'?'user':'environment'; await startCam(); };
document.getElementById('bAudio').onclick=e=>{
 if(!outGain) return;
 if(outGain.gain.value>0){ outGain.gain.value=0; e.target.innerText='👻 VOCES OFF'; e.target.classList.remove('active'); }
 else { outGain.gain.value=0.6; e.target.innerText='👻 VOCES ON'; e.target.classList.add('active'); }
};
document.getElementById('bSls').onclick=e=>{ running=!running; e.target.innerText=running?'DETECTOR ON':'DETECTOR OFF'; if(!running) ctx.clearRect(0,0,canvas.width,canvas.height); };

async function loadDetector(){
 try{
  let mod=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
  let FilesetResolver=mod.FilesetResolver, PoseLandmarker=mod.PoseLandmarker;
  let fileset=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  let landmarker=await PoseLandmarker.createFromOptions(fileset,{
   baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},
   runningMode:"VIDEO", numPoses:3, minPoseDetectionConfidence:0.5
  });
  document.getElementById('status').innerText='Detector + EVP listos';
  let lastT=0;
  function loop(){
   if(!running){ requestAnimationFrame(loop); return; }
   if(video.currentTime!==lastT && video.readyState>=2){
    lastT=video.currentTime;
    let res=landmarker.detectForVideo(video, performance.now());
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(res.landmarks?.length){
     anomaly=true;
     res.landmarks.forEach(lm=>{ draw(lm); });
     document.getElementById('status').innerText='👻 ANOMALIA - Di quien sos?';
     document.getElementById('status').style.color='#f00';
     if(Math.random()<0.025) hablar(FRASES[Math.floor(Math.random()*FRASES.length)]);
    } else {
     anomaly=false; document.getElementById('status').innerText='Escaneando...'; document.getElementById('status').style.color='#0f0';
    }
   }
   requestAnimationFrame(loop);
  }
  loop();
 }catch(e){
  document.getElementById('status').innerText='EVP sin detector (sin internet)';
  console.log(e);
 }
}
function draw(lm){
 ctx.lineWidth=4; ctx.strokeStyle='#ff0000'; ctx.fillStyle='#ff0000'; ctx.shadowColor='#ff0000'; ctx.shadowBlur=14; ctx.lineCap='round';
 const bones=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
 const toX=x=> facing==='environment'? (1-x)*canvas.width : x*canvas.width;
 const toY=y=> y*canvas.height;
 bones.forEach(([a,b])=>{ let p1=lm[a],p2=lm[b]; if(p1&&p2&&p1.visibility>0.4){ ctx.beginPath(); ctx.moveTo(toX(p1.x),toY(p1.y)); ctx.lineTo(toX(p2.x),toY(p2.y)); ctx.stroke(); }});
 lm.forEach(p=>{ if(p.visibility>0.5){ ctx.beginPath(); ctx.arc(toX(p.x),toY(p.y),5,0,6.28); ctx.fill(); }});
}

// REC con limites
let rec,chunks=[],isRec=false,timer,sec=0;
function getMax(){ let r=localStorage.getItem('archivax_role')||'guest'; if(r==='premium') return 999999; if(r==='registered') return 3600; return 600; }
document.getElementById('bRec').onclick=async()=>{
 if(!isRec){
  let cStream=canvas.captureStream(30);
  let mStream=await navigator.mediaDevices.getUserMedia({audio:true});
  let combined=new MediaStream([...cStream.getVideoTracks(),...mStream.getAudioTracks()]);
  rec=new MediaRecorder(combined); chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{ let b=new Blob(chunks,{type:'video/webm'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`ARCHIVAX-${Date.now()}.webm`; a.click(); clearInterval(timer); isRec=false; document.getElementById('bRec').innerText='● REC'; sec=0; };
  rec.start(); isRec=true; document.getElementById('bRec').innerText='■ STOP'; sec=0;
  timer=setInterval(()=>{ sec++; if(sec>=getMax()){ rec.stop(); if((localStorage.getItem('archivax_role')||'guest')==='guest'){ localStorage.setItem('archivax_guest_blocked','1'); alert('10 min terminados'); location.href='/menu.html'; } } },1000);
 } else { rec.stop(); }
};
window.addEventListener('resize',()=>{ canvas.width=innerWidth; canvas.height=innerHeight; });
</script>
</body>
</html>
