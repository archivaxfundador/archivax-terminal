<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CAMARA EVP - ARCHIVAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f0;font-family:monospace;overflow:hidden}
#wrap{position:relative;width:100vw;height:100vh}
#video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.top{position:absolute;top:0;left:0;right:0;padding:10px;background:linear-gradient(#000,transparent);display:flex;justify-content:space-between;z-index:10;font-size:10px}
.btns{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,#000);display:flex;gap:8px;z-index:10}
.btn{flex:1;padding:14px;border-radius:10px;border:1px solid #00ff41;background:#000;color:#00ff41;font-weight:900;font-size:11px}
.btn.rec{background:#f00;color:#fff;border-color:#f00}
#evpBar{position:absolute;left:10px;top:60px;width:6px;height:200px;background:#111;border:1px solid #333;z-index:10}
#evpFill{width:100%;background:#f00;position:absolute;bottom:0;height:0%;transition:0.1s}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#000a;border:1px solid #f00;color:#f00;padding:8px 14px;border-radius:20px;font-size:12px;display:none;z-index:20}
</style>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
</head>
<body>
<div id="wrap">
<video id="video" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
<div id="evpBar"><div id="evpFill"></div></div>
<div class="top">
<div>👁️ CAMARA EVP - SLS RED MODE</div>
<div><span id="audioDb">-∞ dB</span> | <span id="entity">ESCANEANDO...</span></div>
</div>
<div id="msg">👻 ENTIDAD DETECTADA</div>
<div class="btns">
<button class="btn" onclick="location.href='/menu.html'">← MENU</button>
<button class="btn" id="btnAudio" onclick="toggleAudio()">🎙️ AUDIO EVP ON</button>
<button class="btn rec" id="btnRec" onclick="toggleRec()">● REC</button>
</div>
</div>

<script>
let video=document.getElementById('video'), overlay=document.getElementById('overlay'), ctx=overlay.getContext('2d');
let detector, raf, audioCtx, analyser, mic, gainNode, filterHigh, filterLow, isRec=false, mediaRecorder, chunks=[];
let audioEnabled=true;

async function init(){
 overlay.width=window.innerWidth; overlay.height=window.innerHeight;
 // 1. CAMARA TRASERA con config pro
 const stream=await navigator.mediaDevices.getUserMedia({
  video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},
  audio:{
   echoCancellation:true,
   noiseSuppression:true,
   autoGainControl:false,
   sampleRate:48000,
   channelCount:1
  }
 });
 video.srcObject=stream;

 // 2. AUDIO EVP MEJORADO - quita eco y amplifica voces no audibles
 audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});
 let source=audioCtx.createMediaStreamSource(stream);
 filterHigh=audioCtx.createBiquadFilter(); filterHigh.type='highpass'; filterHigh.frequency.value=80; // quita zumbido
 filterLow=audioCtx.createBiquadFilter(); filterLow.type='lowpass'; filterLow.frequency.value=4000; // deja pasar voz espectral
 gainNode=audioCtx.createGain(); gainNode.gain.value=3.5; // sube 350% voces bajas
 analyser=audioCtx.createAnalyser(); analyser.fftSize=2048;
 source.connect(filterHigh); filterHigh.connect(filterLow); filterLow.connect(gainNode); gainNode.connect(analyser);
 // no conectamos a destino para evitar feedback

 // 3. SLS DETECTOR - Pose Detection
 await tf.ready();
 const model=poseDetection.SupportedModels.BlazePose;
 detector=await poseDetection.createDetector(model,{runtime:'tfjs',modelType:'lite',enableSmoothing:true});
 detectLoop();
 audioLoop();
}
function audioLoop(){
 if(!analyser) return;
 let data=new Uint8Array(analyser.frequencyBinCount);
 analyser.getByteFrequencyData(data);
 let avg=data.slice(5,100).reduce((a,b)=>a+b,0)/95; // rango voz EVP
 document.getElementById('evpFill').style.height=Math.min(100, avg*1.5)+'%';
 document.getElementById('audioDb').innerText=(avg>30?'🔴 ':'⚫ ')+avg.toFixed(0)+' EVP';
 if(avg>65){ document.getElementById('entity').innerText='VOZ DETECTADA!'; document.getElementById('entity').style.color='#f00'; }
 requestAnimationFrame(audioLoop);
}
async function detectLoop(){
 if(detector && video.readyState>=2){
  const poses=await detector.estimatePoses(video,{flipHorizontal:false});
  ctx.clearRect(0,0,overlay.width,overlay.height);
  if(poses.length>0){
   poses.forEach(pose=>{
    // DIBUJA MUÑECO ROJO ESTILO SLS REAL
    ctx.strokeStyle='#ff0000'; ctx.lineWidth=4; ctx.fillStyle='#ff0000';
    const k=pose.keypoints;
    const drawLine=(a,b)=>{ if(a.score>0.3&&b.score>0.3){ ctx.beginPath(); ctx.moveTo(overlay.width - a.x*overlay.width/video.videoWidth, a.y*overlay.height/video.videoHeight); ctx.lineTo(overlay.width - b.x*overlay.width/video.videoWidth, b.y*overlay.height/video.videoHeight); ctx.stroke(); } };
    // esqueleto
    const map=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
    map.forEach(([i,j])=>{ let a=k[i],b=k[j]; if(a&&b) drawLine(a,b); });
    k.forEach(pt=>{ if(pt.score>0.4){ ctx.beginPath(); ctx.arc(overlay.width - pt.x*overlay.width/video.videoWidth, pt.y*overlay.height/video.videoHeight, 6,0,Math.PI*2); ctx.fill(); } });
    document.getElementById('msg').style.display='block';
    document.getElementById('entity').innerText='ENTIDAD SLS';
    setTimeout(()=>document.getElementById('msg').style.display='none',1500);
   });
  } else {
   document.getElementById('entity').innerText='ESCANEANDO...';
   document.getElementById('entity').style.color='#0f0';
  }
 }
 raf=requestAnimationFrame(detectLoop);
}
function toggleAudio(){ audioEnabled=!audioEnabled; gainNode.gain.value=audioEnabled?3.5:0; document.getElementById('btnAudio').innerText=audioEnabled?'🎙️ AUDIO EVP ON':'🔇 AUDIO OFF'; }
function toggleRec(){
 if(!isRec){
  let stream=overlay.captureStream(30); let micStream=video.srcObject.getAudioTracks().length?new MediaStream([...video.srcObject.getAudioTracks()]):null;
  let combined=new MediaStream([...stream.getVideoTracks(),...(micStream?micStream.getAudioTracks():[])]);
  mediaRecorder=new MediaRecorder(combined,{mimeType:'video/webm'}); chunks=[];
  mediaRecorder.ondataavailable=e=>chunks.push(e.data);
  mediaRecorder.onstop=()=>{ let blob=new Blob(chunks,{type:'video/webm'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='evp-sls-'+Date.now()+'.webm'; a.click(); };
  mediaRecorder.start(); isRec=true; document.getElementById('btnRec').innerText='■ STOP';
 } else { mediaRecorder.stop(); isRec=false; document.getElementById('btnRec').innerText='● REC'; }
}
window.addEventListener('resize',()=>{ overlay.width=innerWidth; overlay.height=innerHeight; });
init();
</script>
</body>
</html>
