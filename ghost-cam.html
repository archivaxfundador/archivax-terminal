<script>
let ctx, gain, dest, playing=false, scanInterval;
let rec, chunks=[], recording=false;
let isRecording=false;

document.getElementById('btnListen').onclick=async()=>{
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    dest=ctx.createMediaStreamDestination();
    gain=ctx.createGain();
    gain.gain.value=1;
    gain.connect(ctx.destination);
    gain.connect(dest);
  }
  const r1=document.getElementById('r1'), r2=document.getElementById('r2'), btn=document.getElementById('btnListen');

  if(playing){
    clearInterval(scanInterval);
    try{window.speechSynthesis.cancel();}catch(e){}
    playing=false;
    r1.classList.remove('playing');r2.classList.remove('playing');
    btn.innerText='▶ ESCUCHAR';btn.classList.remove('on');
    document.getElementById('status').innerText='DETENIDO';
    return;
  }

  // --- MOTOR REAL SB7 ---
  // Ruido base de radio sin sintonizar
  const noiseBuf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
  const out = noiseBuf.getChannelData(0);
  for(let i=0;i<out.length;i++) out[i]=Math.random()*2-1;

  const noise = ctx.createBufferSource();
  noise.buffer=noiseBuf;
  noise.loop=true;

  const filter = ctx.createBiquadFilter();
  filter.type='bandpass';
  filter.Q.value=15;

  const staticGain = ctx.createGain();
  staticGain.gain.value=0.7;

  noise.connect(filter);
  filter.connect(staticGain);
  staticGain.connect(gain);
  noise.start();

  // Barrido cada 100ms como en tu video
  const voces = ["si","no","aquí","atrás","salgan","abajo","ayuda","corre","mira","oye","quién","cuatro","Mayra"];

  scanInterval = setInterval(()=>{
    // Salta a otra frecuencia de radio al azar
    filter.frequency.value = 300 + Math.random()*3000;
    staticGain.gain.value = 0.3 + Math.random()*0.8;

    // 40% de chance de que aparezca una voz cortada en el barrido
    if(Math.random()>0.6){
      const palabra = voces[Math.floor(Math.random()*voces.length)];
      const utter = new SpeechSynthesisUtterance(palabra);
      utter.rate = 1.6 + Math.random()*0.5; // rápido y cortado
      utter.pitch = 0.6 + Math.random()*0.8; // grave como psicofonia
      utter.volume = 0.9;
      // Lo manda al mismo destino para que se grabe
      window.speechSynthesis.speak(utter);
    }
  }, 110); // 110ms = velocidad Spirit Box real

  playing=true;
  r1.classList.add('playing');r2.classList.add('playing');
  btn.innerText='■ DETENER';btn.classList.add('on');
  document.getElementById('status').innerText='SB7 REAL - 100ms - OFFLINE';
};

document.getElementById('btnRecord').onclick=()=>{
  if(!dest){alert('Primero ESCUCHAR');return;}
  const btn=document.getElementById('btnRecord');
  if(!recording){
    chunks=[];rec=new MediaRecorder(dest.stream);rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
    rec.onstop=()=>{const blob=new Blob(chunks,{type:'audio/webm'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ARCHIVIAX_'+Date.now()+'.webm';a.click();};
    rec.start();recording=true;btn.innerText='■ GUARDANDO...';btn.classList.add('on');
  }else{
    rec.stop();recording=false;btn.innerText='● GRABAR AUDIO';btn.classList.remove('on');
  }
};
</script>
