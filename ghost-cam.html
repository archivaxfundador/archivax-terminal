<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVIAX</title>
<style>
body{background:#050505;color:#666;font-family:monospace;text-align:center;margin:0;padding:20px}
#online{color:#00ff66;font-size:12px;margin:10px;letter-spacing:3px}
#reels{display:flex;justify-content:center;gap:20px;margin:30px 0}
.reel-img{width:200px;height:200px;border-radius:50%;animation:spin 1s linear infinite;animation-play-state:paused}
.playing{animation-play-state:running!important}
@keyframes spin{100%{transform:rotate(360deg)}}
button{background:#111;border:2px solid #a00;color:#fff;padding:18px 40px;font-size:18px;letter-spacing:2px;margin-top:10px}
button.on{background:#a00}
#status{margin-top:25px;font-size:11px;color:#555;letter-spacing:2px}
audio{width:90%;margin-top:20px;filter:invert(1) hue-rotate(180deg)}
</style>
</head>
<body>
<div id="online">● ONLINE</div>
<div style="color:#111;font-size:10px;letter-spacing:5px">ARCHIVIAX.COM.AR</div>

<div id="reels">
  <img src="revox.png" class="reel-img" id="r1">
  <img src="revox.png" class="reel-img" id="r2">
</div>

<button id="btnListen">ESCUCHAR</button>
<div id="status">analizando audio</div>

<!-- AUDIO VISIBLE PARA QUE VEAS QUE SI SUENA -->
<audio id="radio" controls autoplay style="opacity:0.5"></audio>

<script>
let playing=false, timer, current=0;
const radio = document.getElementById('radio');
const r1=document.getElementById('r1'), r2=document.getElementById('r2');
const btn=document.getElementById('btnListen');

// 35 RADIOS LATINAS REALES - HTTPS y con CORS abierto
const RADIOS = [
  // ARGENTINA
  "https://playerservices.streamtheworld.com/api/livestream-redirect/RADIO_MITRE.mp3",
  "https://streaming.radiolider.com:10913/stream",
  "https://radios.sonidoshd.com:8161/stream",
  "https://stream.zeno.fm/5y5q1a1q1w0uv",
  "https://server6.hostradios.com:8042/stream",
  "https://server8.streams.cl:8002/rivadavia",
  "https://us2.streamingpulse.com:7006/live",
  "https://cdn.instream.audio:8001/cronica",
  // CHILE
  "https://stream-042.zeno.fm/0r0xa8sxa0quv?zt=eyJhbGciOiJIUzI1NiJ9.eyJzdHJlYW0iOiIwcjB4YThzeGEwcXV2IiwiaG9zdCI6InN0cmVhbS0wNDIuemVuby5mbSIsInJ0dGwiOjUsImp0aSI6IjlWcW9rWm9tU1N1T2hWbE9fN0tLQSIsImlhdCI6MTY0NjA0ODAwMCwiZXhwIjoxNjQ2MDQ4MDYwfQ",
  "https://stream.zeno.fm/f3v7qy1m8k8uv",
  "https://stream.zeno.fm/0u2k1s8q1w0uv",
  // MEXICO
  "https://stream.zeno.fm/0r0xa8sxa0quv",
  "https://radios.sonidoshd.com:8000/wradio",
  "https://stream.zeno.fm/kw5z5y1m8k8uv",
  // COLOMBIA
  "https://stream.zeno.fm/0r0xa8sxa0quv",
  "https://stream.zeno.fm/q1a1q1w0uv",
  // PERU / URUGUAY / LATAM GENERICO
  "https://stream.zeno.fm/0r0xa8sxa0quv",
  "https://icecast.serviciosdedns.com:8000/radiocolonia",
  "https://server6.hostradios.com:8048/stream",
  "https://streaming01.shockmedia.com.ar:9000/radiomitre",
  "https://playerservices.streamtheworld.com/api/livestream-redirect/LA_100.mp3"
];

function playNext(){
  const url = RADIOS[current % RADIOS.length];
  radio.src = url;
  radio.volume = 1;
  radio.play().catch(e=>{
    console.log("Radio falló, pasando a otra", e);
    current++;
    playNext();
  });
  current++;
}

btn.onclick = async () =>{
  if(!playing){
    playing=true;
    r1.classList.add('playing'); r2.classList.add('playing');
    btn.innerText='DETENER';
    btn.classList.add('on');
    document.getElementById('status').innerText='analizando audio';
    playNext();
    timer = setInterval(playNext, 180);
  }else{
    clearInterval(timer);
    radio.pause();
    playing=false;
    r1.classList.remove('playing'); r2.classList.remove('playing');
    btn.innerText='ESCUCHAR';
    btn.classList.remove('on');
    document.getElementById('status').innerText='analizando audio';
  }
};

// Mostrar ONLINE solo si hay internet
const onlineEl=document.getElementById('online');
function upd(){ onlineEl.style.display=navigator.onLine?"block":"none"; }
window.addEventListener('online',upd); window.addEventListener('offline',upd); upd();
</script>
</body>
</html>
