<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ARCHIVAX VISION SYSTEM</title>
<style>
body{margin:0;background:#000;overflow:hidden}
#video{position:absolute;width:100%;height:100%;object-fit:cover;filter:brightness(0.3) contrast(1.4)}
#canvas{position:absolute;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;padding:16px;z-index:10;background:linear-gradient(180deg,#000 0%,transparent 100%)}
#log{color:#fff;font-family:monospace;font-size:13px;margin-top:8px}
#bottom{position:absolute;bottom:0;left:0;right:0;z-index:10;background:#0a0a0a;padding:12px;display:flex;justify-content:space-between;align-items:center}
#rec{width:54px;height:54px;border-radius:50%;background:#ff1a1a;border:3px solid #fff;display:flex;align-items:center;justify-content:center}
#rec.on{background:#fff;box-shadow:0 0 20px red}
</style>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3"></script>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="hud">
<div style="color:rgba(255,255,255,.5);font-size:10px;letter-spacing:1px;font-family:monospace">ARCHIVAX VISION SYSTEM • TESLA MODE</div>
<div id="log">INICIANDO SISTEMA...</div>
</div>
<div id="bottom">
<div id="rec" onclick="toggleRec()"><div style="width:18px;height:18px;background:#fff;border-radius:50%"></div></div>
<div style="color:#fff;font-family:monospace;font-size:11px"><span id="cnt">0 ENTIDADES</span><br><span style="color:#888">MANTENÉ PRESIONADO PARA GRABAR</span></div>
</div>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let detector, entities=[], isRec=false, recorder, chunks=[];

async function init(){
 const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:1280,height:720}});
 video.srcObject=s; await new Promise(r=>video.onloadedmetadata=r);
 canvas.width=video.videoWidth; canvas.height=video.videoHeight;
 detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,enableTracking:true});
 loop();
}

function drawRealTeslaMan(x,y,scale,phase,alpha){
 ctx.save();
 ctx.translate(x,y);
 ctx.scale(scale,scale);
 ctx.globalAlpha=alpha*0.95;

 // Material Tesla real - blanco hueso mate con borde suave
 ctx.shadowBlur=20; ctx.shadowColor='rgba(255,255,255,0.7)';
 ctx.fillStyle='#e8e0d5'; // color exacto Tesla
 ctx.strokeStyle='#e8e0d5';
 ctx.lineWidth=18; ctx.lineCap='round'; ctx.lineJoin='round';

 // Animacion caminata real
 const leg1=Math.sin(phase)*22;
 const leg2=Math.sin(phase+Math.PI)*22;
 const arm1=Math.sin(phase+Math.PI)*14;
 const arm2=Math.sin(phase)*14;

 // Cabeza ovalada Tesla
 ctx.beginPath(); ctx.ellipse(0,-88,16,19,0,0,Math.PI*2); ctx.fill();
 // Tronco
 ctx.beginPath(); ctx.roundRect(-16,-68,32,52,14); ctx.fill();
 // Brazos que se balancean al caminar
 ctx.beginPath(); ctx.moveTo(-14,-55); ctx.lineTo(-28+arm1*0.3,-30); ctx.lineTo(-32+arm1*0.3,2); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(14,-55); ctx.lineTo(28+arm2*0.3,-30); ctx.lineTo(32+arm2*0.3,2); ctx.stroke();
 // Piernas cruzadas caminando de verdad
 ctx.beginPath(); ctx.moveTo(-7,-18); ctx.lineTo(-10+leg1*0.4,18); ctx.lineTo(-12+leg1*0.5,62); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(7,-18); ctx.lineTo(10+leg2*0.4,18); ctx.lineTo(12+leg2*0.5,62); ctx.stroke();

 ctx.restore();
 // Sombra roja Tesla debajo
 ctx.globalAlpha=alpha*0.6; ctx.fillStyle='#ff1e1e'; ctx.fillRect(x-28*scale,y+62*scale,56*scale,4*scale);
}

async function loop(){
 const poses=await detector.estimatePoses(video,{maxPoses:6,flipHorizontal:false});
 ctx.clearRect(0,0,canvas.width,canvas.height);
 const now=Date.now();

 // 1. Gente real detectada
 poses.forEach(p=>{
  if(p.keypoints[0].score>0.25){
   const cx=p.keypoints[0].x; const cy=p.keypoints[11].y || canvas.height*0.5;
   // Si ya existe cerca, actualizar
   let e=entities.find(en=>Math.abs(en.x-cx)<100);
   if(e){ e.tx=cx; e.ty=cy; e.last=now; }
   else { entities.push({x:cx,y:cy,tx:cx,ty:cy,start:now,last:now,phase:Math.random()*6,scale:0.8+Math.random()*0.4,phantom:false}); }
  }
 });

 // 2. Modo cementerio - genera 3 a 5 fantasmas caminando juntos como en tu imagen
 if(entities.length===0 && Math.random()>0.985){
  const baseX=canvas.width*0.45+Math.random()*canvas.width*0.2;
  const count=3+Math.floor(Math.random()*3); // 3 a 5
  for(let i=0;i<count;i++){
   entities.push({
    x:baseX+(i*35-50)+Math.random()*20,
    y:canvas.height*0.35+i*15,
    tx:baseX+(i*35-50),
    ty:canvas.height*0.75,
    start:now+i*300, last:now, phase:i*0.8, scale:0.7+i*0.15, phantom:true
   });
  }
 }

 // Dibujar con movimiento y acercamiento real
 entities=entities.filter(en=>{
  const age=(now-en.start)/1000;
  if(age>12) return false; // dura 12 segundos
  // Interpolar hacia target (camina hacia vos)
  en.x+=(en.tx-en.x)*0.02;
  en.y+=(en.ty-en.y)*0.008;
  en.phase+=0.12; // velocidad caminata
  en.scale+=0.0015; // se acerca y se agranda como en Tesla

  const alpha= age>9? 1-(age-9)/3 : 1;
  drawRealTeslaMan(en.x,en.y,en.scale,en.phase,alpha);
  return true;
 });

 document.getElementById('log').innerText= entities.length? `⚠ ${entities.length} ENTIDADES EN VIA - DISTANCIA ${ (5-entities[0].scale).toFixed(1)}m` : 'VIA LIBRE - ESCANEANDO';
 document.getElementById('cnt').innerText=`${entities.length} ENTIDADES`;

 requestAnimationFrame(loop);
}

function toggleRec(){
 if(!isRec){
  const stream=canvas.captureStream(30);
  chunks=[]; recorder=new MediaRecorder(stream,{mimeType:'video/webm'});
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{ const blob=new Blob(chunks,{type:'video/webm'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`ARCHIVAX-VISION-${Date.now()}.webm`; a.click(); };
  recorder.start(); isRec=true; document.getElementById('rec').classList.add('on');
 } else { recorder.stop(); isRec=false; document.getElementById('rec').classList.remove('on'); }
}
init();
</script>
</body>
</html>
