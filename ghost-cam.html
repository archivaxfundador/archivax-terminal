<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ARCHIVAX VISION SYSTEM</title>
<style>
body{margin:0;background:#050507;overflow:hidden}
#canvas{position:absolute;width:100%;height:100%}
#rec{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:#ff1e1e;border:3px solid #fff;z-index:20}
#rec.on{background:#fff;box-shadow:0 0 20px #ff0000}
#info{position:absolute;bottom:90px;left:0;right:0;text-align:center;color:rgba(255,255,255,.4);font-family:monospace;font-size:10px;z-index:10}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info">ARCHIVAX VISION SYSTEM • TOUCH TO RECORD</div>
<button id="rec" onclick="toggleRec()"></button>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W,H, ghosts=[], isRec=false, recorder, chunks=[];

function resize(){ W=canvas.width=innerWidth*2; H=canvas.height=innerHeight*2; canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px'; }
resize(); addEventListener('resize',resize);

// MANIQUI TESLA 100% REAL - como en tu captura
class Ghost{
 constructor(x,y){
  this.x=x; this.y=y; this.start=Date.now(); this.life=8000+Math.random()*2000; // 8-10 seg
  this.phase=Math.random()*10; this.speed=0.9+Math.random()*0.6;
  this.scale=0.9+Math.random()*0.3;
  this.dir=(Math.random()-0.5)*0.8; // camina un poco en diagonal
 }
 get alive(){ return Date.now()-this.start < this.life; }
 get alpha(){ const age=Date.now()-this.start; const remain=this.life-age; return remain<1000? remain/1000 : 1; }

 draw(){
  const age=(Date.now()-this.start)/1000;
  this.phase+=0.13;
  this.y-=this.speed; // se aleja como en Tesla (camina hacia adelante)
  this.x+=this.dir;
  // efecto perspectiva Tesla: mas lejos = mas chico
  const p = this.y/H; const scale=this.scale*(0.6 + p*0.6);

  ctx.save(); ctx.translate(this.x,this.y); ctx.scale(scale,scale); ctx.globalAlpha=this.alpha*0.95;
  // Blur exacto Tesla
  ctx.shadowBlur=12; ctx.shadowColor='rgba(255,255,255,0.8)';
  ctx.fillStyle='#d9d2c7'; // blanco hueso Tesla real
  ctx.strokeStyle='#d9d2c7'; ctx.lineWidth=9; ctx.lineCap='round'; ctx.lineJoin='round';

  // Caminata con pisada real - pie clavado
  const swing=Math.sin(this.phase);
  const leftPlanted=swing<0;
  const leftX= leftPlanted? -4 : -4+swing*18;
  const leftY= leftPlanted? 32 : 32-Math.abs(swing)*12;
  const rightX= !leftPlanted? 4 : 4+Math.sin(this.phase+Math.PI)*18;
  const rightY= !leftPlanted? 32 : 32-Math.abs(Math.sin(this.phase+Math.PI))*12;

  // CUERPO ENTERO COMO EN TU IMAGEN
  ctx.beginPath(); ctx.arc(0,-36,8,0,Math.PI*2); ctx.fill(); // cabeza
  ctx.beginPath(); ctx.roundRect(-7,-28,14,22,5); ctx.fill(); // torso
  ctx.beginPath(); ctx.moveTo(-5,-22); ctx.lineTo(-10+swing*3,-8); ctx.lineTo(-11+swing*3,4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5,-22); ctx.lineTo(10-swing*3,-8); ctx.lineTo(11-swing*3,4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-3,-7); ctx.lineTo(leftX*0.5,10); ctx.lineTo(leftX,leftY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3,-7); ctx.lineTo(rightX*0.5,10); ctx.lineTo(rightX,rightY); ctx.stroke();
  ctx.restore();
 }
}

function drawTeslaRoad(){
 // Fondo Tesla oscuro
 ctx.fillStyle='#050507'; ctx.fillRect(0,0,W,H);
 // Ruta con lineas
 ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=2;
 ctx.beginPath(); ctx.moveTo(W*0.35,H); ctx.lineTo(W*0.48,H*0.2); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(W*0.65,H); ctx.lineTo(W*0.52,H*0.2); ctx.stroke();
 ctx.setLineDash([18,18]); ctx.strokeStyle='rgba(255,255,255,0.25)';
 ctx.beginPath(); ctx.moveTo(W*0.5,H); ctx.lineTo(W*0.5,H*0.2); ctx.stroke(); ctx.setLineDash([]);
 // Auto Tesla abajo
 ctx.save(); ctx.translate(W*0.5,H*0.85); ctx.scale(1.2,1.2);
 ctx.fillStyle='#2a2a2e'; ctx.strokeStyle='#444'; ctx.lineWidth=1.5;
 ctx.beginPath(); ctx.roundRect(-32,-18,64,36,8); ctx.fill(); ctx.stroke();
 ctx.fillStyle='#111'; ctx.beginPath(); ctx.roundRect(-28,-14,56,12,4); ctx.fill();
 ctx.fillStyle='#ff1e1e'; ctx.fillRect(-28,14,8,3); ctx.fillRect(20,14,8,3);
 ctx.restore();
}

function loop(){
 drawTeslaRoad();
 // Genera 1 o varios como en cementerio real
 if(Math.random()>0.985){
  const n=Math.random()>0.6? 1 : 2+Math.floor(Math.random()*4); // 70% 1, 30% 2-5
  const bx=W*0.45+Math.random()*W*0.1;
  const by=H*0.75+Math.random()*H*0.1;
  for(let i=0;i<n;i++){
   ghosts.push(new Ghost(bx+(i*28-40)+Math.random()*10, by+i*18));
  }
 }
 ghosts=ghosts.filter(g=>g.alive);
 ghosts.forEach(g=>g.draw());
 requestAnimationFrame(loop);
}
loop();

// GRABACION GUARDA EN TELEFONO
function toggleRec(){
 if(!isRec){
  const s=canvas.captureStream(30); chunks=[]; recorder=new MediaRecorder(s,{mimeType:'video/webm'});
  recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
  recorder.onstop=()=>{const b=new Blob(chunks,{type:'video/webm'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`VISION-SYSTEM-${Date.now()}.webm`;a.click();};
  recorder.start(); isRec=true; document.getElementById('rec').classList.add('on'); document.getElementById('info').innerText='GRABANDO... 8-10 SEG';
 } else {recorder.stop(); isRec=false; document.getElementById('rec').classList.remove('on'); document.getElementById('info').innerText='VIDEO GUARDADO EN GALERIA'; setTimeout(()=>document.getElementById('info').innerText='ARCHIVAX VISION SYSTEM • TOUCH TO RECORD',2000);}
}
</script>
</body>
</html>
