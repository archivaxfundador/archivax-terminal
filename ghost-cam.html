<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ARCHIVAX VISION SYSTEM</title>
<style>
body{margin:0;background:#000;overflow:hidden}
#video{position:absolute;width:100%;height:100%;object-fit:cover}
#canvas{position:absolute;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;padding:14px;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);font-family:monospace}
#rec{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:#ff1e1e;border:3px solid #fff;z-index:20}
#rec.on{background:#fff;box-shadow:0 0 20px red}
#zoomBox{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);z-index:15;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:20px;border:1px solid #333}
#zoom{width:140px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3"></script>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="hud">
<div style="color:rgba(255,255,255,.5);font-size:10px;letter-spacing:1px">ARCHIVAX VISION SYSTEM</div>
<div id="log" style="color:#fff;font-size:12px;margin-top:6px">INICIANDO...</div>
</div>
<div id="zoomBox">
<span style="color:#fff;font-family:monospace;font-size:10px">ZOOM</span>
<input id="zoom" type="range" min="1" max="4" step="0.1" value="1">
<span id="zoomVal" style="color:#fff;font-family:monospace;font-size:10px">1x</span>
</div>
<button id="rec" onclick="toggleRec()"></button>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let detector, entities=[], isRec=false, recorder, chunks=[];
let videoTrack, audioContext, analyser, audioStream;

class KinectGhost{
 constructor(pose, isReal){
  this.kp=pose.keypoints;
  this.isReal=isReal;
  this.start=Date.now();
  this.lastSeen=Date.now();
  this.x=pose.keypoints[0].x;
 }
 update(pose){ this.kp=pose.keypoints; this.lastSeen=Date.now(); this.x=pose.keypoints[0].x; }
 alive(){
  // entidad queda 12 seg, persona real queda mientras la veas
  const limit=this.isReal? 1500 : 12000;
  return Date.now()-this.lastSeen < limit;
 }
 alpha(){
  const dt=Date.now()-this.lastSeen;
  if(this.isReal) return 1;
  if(dt<9000) return 1;
  return Math.max(0,1-(dt-9000)/3000);
 }
 draw(isEntity){
  const k=this.kp;
  const a=this.alpha();
  if(a<=0) return;
  const get=i=>k[i];
  if(get(5).score<0.12 || get(6).score<0.12) return;

  ctx.save();
  ctx.globalAlpha=a;
  if(isEntity){
   ctx.shadowBlur=24; ctx.shadowColor='rgba(255,255,255,0.9)';
   ctx.strokeStyle='#e8e0d5'; ctx.fillStyle='#e8e0d5';
   ctx.lineWidth=10;
  } else {
   ctx.shadowBlur=18; ctx.shadowColor='rgba(0,255,100,0.8)';
   ctx.strokeStyle='#00ff66'; ctx.fillStyle='#00ff66';
   ctx.lineWidth=7;
  }
  ctx.lineCap='round'; ctx.lineJoin='round';

  const lines=[[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16],[0,5],[0,6]];
  lines.forEach(([i,j])=>{
   const p1=get(i), p2=get(j);
   if(p1.score>0.12 && p2.score>0.12){
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
   }
  });
  // cabeza
  const head=get(0);
  if(head.score>0.12){
   ctx.beginPath(); ctx.arc(head.x,head.y,isEntity?16:12,0,Math.PI*2); ctx.fill();
  }
  // cuerpo relleno para altura real
  const ls=get(5), rs=get(6), lh=get(11), rh=get(12);
  if(ls.score>0.12 && rs.score>0.12 && lh.score>0.12 && rh.score>0.12){
   ctx.globalAlpha=isEntity? a*0.35 : a*0.20;
   ctx.beginPath();
   ctx.moveTo(ls.x,ls.y); ctx.lineTo(rs.x,rs.y); ctx.lineTo(rh.x,rh.y); ctx.lineTo(lh.x,lh.y); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
 }
}

async function init(){
 const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:1280,height:720}, audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
 video.srcObject=stream;
 videoTrack=stream.getVideoTracks()[0];
 audioStream=stream;
 await new Promise(r=>video.onloadedmetadata=r);
 canvas.width=video.videoWidth; canvas.height=video.videoHeight;
 canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
 document.getElementById('zoom').addEventListener('input', async (e)=>{
  const z=parseFloat(e.target.value);
  document.getElementById('zoomVal').innerText=z.toFixed(1)+'x';
  try{ await videoTrack.applyConstraints({advanced:[{zoom:z}]}); }catch{ video.style.transform=`scale(${z})`; }
 });
 try{
  audioContext=new (window.AudioContext||window.webkitAudioContext)();
  const src=audioContext.createMediaStreamSource(stream);
  analyser=audioContext.createAnalyser(); analyser.fftSize=256;
  src.connect(analyser);
 }catch{}
 detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,enableTracking:true});
 document.getElementById('log').innerText='VISION ACTIVA 0.14 + KINECT REAL';
 loop();
}

function drawWatermark(){
 ctx.save();
 ctx.globalAlpha= isRec? 0.85 : 0.35;
 ctx.fillStyle='#fff';
 ctx.font=`${Math.round(canvas.width*0.022)}px monospace`;
 ctx.textAlign='right';
 ctx.shadowBlur=6; ctx.shadowColor='rgba(0,0,0,0.9)';
 ctx.fillText('archiviax.com.ar', canvas.width-25, canvas.height-28);
 ctx.restore();
}

let lastAudioAlert=0;
let realPersons=[];
async function loop(){
 const poses=await detector.estimatePoses(video,{maxPoses:5,flipHorizontal:false});
 ctx.clearRect(0,0,canvas.width,canvas.height);

 realPersons=[];
 poses.forEach(p=>{
  if(p.keypoints[0].score>0.14){
   realPersons.push(p);
   let best=null, bestD=150;
   entities.forEach(e=>{
    const d=Math.hypot(e.x-p.keypoints[0].x, e.kp[0].y-p.keypoints[0].y);
    if(d<bestD){ bestD=d; best=e; }
   });
   if(best){ best.update(p); }
   else { entities.push(new KinectGhost(p,false)); }
  }
 });

 entities=entities.filter(e=>e.alive());
 // dibuja primero entidades blancas que quedan
 entities.forEach(e=>e.draw(true));
 // dibuja encima personas reales en verde con articulacion 100% real
 realPersons.forEach(p=>{
  const temp=new KinectGhost(p,true);
  temp.draw(false);
 });

 drawWatermark();

 if(analyser){
  const data=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  const vol=data.reduce((a,b)=>a+b,0)/data.length;
  if(vol>42 && Date.now()-lastAudioAlert>3000 && entities.length===0 && realPersons.length===0){
   document.getElementById('log').innerText=`⚠ RUIDO AMBIENTE - ${vol.toFixed(0)}dB`;
   lastAudioAlert=Date.now();
  } else if(entities.length>0 && realPersons.length>0){
   document.getElementById('log').innerText=`${entities.length} ENTIDAD + ${realPersons.length} PERSONA REAL`;
  } else if(entities.length>0){
   document.getElementById('log').innerText=`${entities.length} ENTIDAD DETECTADA - 12 SEG`;
  } else if(realPersons.length>0){
   document.getElementById('log').innerText=`${realPersons.length} PERSONA REAL - KINECT`;
  } else if(Date.now()-lastAudioAlert>4000){
   document.getElementById('log').innerText='ESCANEANDO... AUDIO ON';
  }
 }
 requestAnimationFrame(loop);
}

function toggleRec(){
 if(!isRec){
  const canvasStream=canvas.captureStream(30);
  const combined=new MediaStream([...canvasStream.getVideoTracks(),...audioStream.getAudioTracks()]);
  chunks=[]; recorder=new MediaRecorder(combined,{mimeType:'video/webm'});
  recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
  recorder.onstop=()=>{const b=new Blob(chunks,{type:'video/webm'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`ARCHIVAX-VISION-${Date.now()}.webm`;a.click();};
  recorder.start(); isRec=true; document.getElementById('rec').classList.add('on');
 } else {recorder.stop(); isRec=false; document.getElementById('rec').classList.remove('on');}
}
init();
</script>
</body>
</html>
