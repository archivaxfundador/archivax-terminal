<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVIAX - Spirit Box</title>
<style>
body{background:#050505;color:#ccc;font-family:monospace;text-align:center;padding:20px;margin:0}
h1{color:#8b0000;letter-spacing:4px;font-size:18px}
#reels{display:flex;justify-content:center;gap:20px;margin:25px 0}
.reel-img{width:180px;height:180px;border-radius:50%;box-shadow:0 0 25px #000;animation:spin 1.5s linear infinite;animation-play-state:paused}
.playing{animation-play-state:running!important}
@keyframes spin{100%{transform:rotate(360deg)}}
button{background:#111;border:2px solid #8b0000;color:#fff;padding:16px 28px;margin:8px;font-size:16px;cursor:pointer}
button.on{background:#8b0000}
#status{margin-top:12px;color:#777;font-size:12px}
</style>
</head>
<body>
<h1>ARCHIVIAX.COM.AR // SB7 OFFLINE</h1>

<div id="reels">
  <img src="revox.png" class="reel-img" id="r1" onerror="this.style.background='#222';this.style.border='2px solid #444'">
  <img src="revox.png" class="reel-img" id="r2" onerror="this.style.background='#222';this.style.border='2px solid #444'">
</div>

<button id="btnListen">▶ ESCUCHAR</button>
<button id="btnRecord">● GRABAR AUDIO</button>
<div id="status">OFFLINE - LISTO - SIN INTERNET</div>

<script>
let ctx, gain, dest, playing=false, scanTimer=null, noiseSrc=null;
let rec, chunks=[], recording=false;

const r1 = document.getElementById('r1');
const r2 = document.getElementById('r2');
const btnListen = document.getElementById('btnListen');
const btnRecord = document.getElementById('btnRecord');
const statusEl = document.getElementById('status');

btnListen.onclick = async () => {
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    dest = ctx.createMediaStreamDestination();
    gain = ctx.createGain();
    gain.gain.value = 1;
    gain.connect(ctx.destination);
    gain.connect(dest);
  }
  if(ctx.state === 'suspended') await ctx.resume();

  if(playing){
    clearInterval(scanTimer);
    if(noiseSrc){ try{noiseSrc.stop();}catch(e){} }
    try{window.speechSynthesis.cancel();}catch(e){}
    playing=false;
    r1.classList.remove('playing'); r2.classList.remove('playing');
    btnListen.innerText='▶ ESCUCHAR'; btnListen.classList.remove('on');
    statusEl.innerText='DETENIDO';
    return;
  }

  // Crear ruido
  const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;

  noiseSrc = ctx.createBufferSource();
  noiseSrc.buffer=buf;
  noiseSrc.loop=true;

  const filter = ctx.createBiquadFilter();
  filter.type='bandpass';
  filter.Q.value=12;
  filter.frequency.value=800;

  const g = ctx.createGain();
  g.gain.value=0.9;

  noiseSrc.connect(filter);
  filter.connect(g);
  g.connect(gain);
  noiseSrc.start();

  const voces = ["si","no","aqui","abajo","salgan","ayuda","corre","oye","cuatro","Mayra","quien"];

  scanTimer = setInterval(()=>{
    filter.frequency.value = 400 + Math.random()*2500;
    if(Math.random()>0.65){
      const palabra = voces[Math.floor(Math.random()*voces.length)];
      const u = new SpeechSynthesisUtterance(palabra);
      u.rate=1.8; u.pitch=0.7; u.volume=0.8;
      speechSynthesis.speak(u);
    }
  },120);

  playing=true;
  r1.classList.add('playing'); r2.classList.add('playing');
  btnListen.innerText='■ DETENER'; btnListen.classList.add('on');
  statusEl.innerText='BARRIENDO 120ms - SB7 REAL';
};

btnRecord.onclick = ()=>{
  if(!dest){ alert('Primero toca ESCUCHAR'); return; }
  if(!recording){
    chunks=[];
    rec = new MediaRecorder(dest.stream);
    rec.ondataavailable = e=>{ if(e.data.size>0) chunks.push(e.data); };
    rec.onstop = ()=>{
      const blob = new Blob(chunks,{type:'audio/webm'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download='ARCHIVIAX_'+Date.now()+'.webm'; a.click();
      statusEl.innerText='GUARDADO EN DESCARGAS';
    };
    rec.start();
    recording=true;
    btnRecord.innerText='■ GUARDANDO...';
    btnRecord.classList.add('on');
  }else{
    rec.stop();
    recording=false;
    btnRecord.innerText='● GRABAR AUDIO';
    btnRecord.classList.remove('on');
  }
};
</script>
</body>
</html>
