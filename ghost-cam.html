<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVIAX</title>
<style>
body{background:#050505;color:#888;font-family:monospace;text-align:center;margin:0;padding:20px}
#online{color:#00ff66;font-size:12px;margin:10px;letter-spacing:2px}
#reels{display:flex;justify-content:center;gap:20px;margin:30px 0}
.reel-img{width:200px;height:200px;border-radius:50%;animation:spin 1s linear infinite;animation-play-state:paused}
.playing{animation-play-state:running!important}
@keyframes spin{100%{transform:rotate(360deg)}}
button{background:#111;border:2px solid #a00;color:#fff;padding:18px 40px;font-size:18px;letter-spacing:2px;cursor:pointer;margin-top:10px}
button.on{background:#a00}
#status{margin-top:25px;font-size:12px;color:#555;letter-spacing:1px}
</style>
</head>
<body>
<div id="online">● ONLINE</div>
<h1 style="color:#222;font-size:12px;letter-spacing:5px">ARCHIVIAX.COM.AR</h1>

<div id="reels">
  <img src="revox.png" class="reel-img" id="r1">
  <img src="revox.png" class="reel-img" id="r2">
</div>

<button id="btnListen">ESCUCHAR</button>
<div id="status">analizando audio</div>

<audio id="radio" crossorigin="anonymous" style="display:none"></audio>

<script>
let ctx, gain, dest, playing=false, timer, radio;
let current=0;

const RADIOS = [
  "https://playerservices.streamtheworld.com/api/livestream-redirect/RADIO_MITRE.mp3",
  "https://radios.sonidoshd.com:8161/stream",
  "https://streaming.radiolider.com:10913/stream",
  "https://stream.zeno.fm/5y5q1a1q1w0uv",
  "https://server6.hostradios.com:8042/stream"
];

const r1=document.getElementById('r1'), r2=document.getElementById('r2');
const btn=document.getElementById('btnListen');
const statusEl=document.getElementById('status');
const onlineEl=document.getElementById('online');

function updateOnline(){
  onlineEl.style.display = navigator.onLine ? "block" : "none";
}
window.addEventListener('online',updateOnline);
window.addEventListener('offline',updateOnline);
updateOnline();

btn.onclick = async () =>{
  if(!ctx){
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    dest = ctx.createMediaStreamDestination();
    gain = ctx.createGain();
    gain.gain.value=1;
    radio = document.getElementById('radio');
    const src = ctx.createMediaElementSource(radio);
    src.connect(gain);
    gain.connect(ctx.destination);
    // importante para que suene fuerte
    radio.volume = 1;
  }
  if(ctx.state==='suspended') await ctx.resume();

  if(playing){
    clearInterval(timer);
    radio.pause();
    playing=false;
    r1.classList.remove('playing'); r2.classList.remove('playing');
    btn.innerText='ESCUCHAR';
    btn.classList.remove('on');
    statusEl.innerText='analizando audio';
    return;
  }

  // INICIAR
  playing=true;
  r1.classList.add('playing'); r2.classList.add('playing');
  btn.innerText='DETENER';
  btn.classList.add('on');
  statusEl.innerText='analizando audio';

  const playNext = async () =>{
    try{
      const url = RADIOS[current % RADIOS.length];
      radio.src = url;
      await radio.play();
    }catch(e){
      // si falla una, pasa a la otra
    }
    current++;
  };

  await playNext();
  timer = setInterval(playNext, 180);
};
</script>
</body>
</html>
