<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ARCHIVAX VISION SYSTEM</title>
<style>
body{margin:0;background:#000;overflow:hidden}
#video{position:absolute;width:100%;height:100%;object-fit:cover;filter:contrast(1.1)}
#canvas{position:absolute;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;padding:14px;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);font-family:monospace}
#rec{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:#ff1e1e;border:3px solid #fff;z-index:20}
#rec.on{background:#fff;box-shadow:0 0 20px red}
#zoomBox{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);z-index:15;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:20px;border:1px solid #333}
#zoom{width:140px}
#camBtn{position:absolute;bottom:100px;right:18px;z-index:15;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid #333;color:#fff;font-size:18px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3"></script>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="hud">
<div style="color:rgba(255,255,255,.5);font-size:10px;letter-spacing:1px">ARCHIVAX VISION SYSTEM</div>
<div id="log" style="color:#fff;font-size:12px;margin-top:6px">INICIANDO...</div>
</div>
<div id="zoomBox">
<span style="color:#fff;font-family:monospace;font-size:10px">ZOOM</span>
<input id="zoom" type="range" min="1" max="4" step="0.1" value="1">
<span id="zoomVal" style="color:#fff;font-family:monospace;font-size:10px">1x</span>
</div>
<button id="camBtn" onclick="switchCam()">↻</button>
<button id="rec" onclick="toggleRec()"></button>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let detector, isRec=false, chunks=[], videoTrack, audioStream, currentFacing='environment', currentStream=null, analyser, audioContext;
let distortion=0, whisperGain, whisperTimer=0;

function drawReal(kp, mirror){
 const get=i=>kp[i];
 const tx=x=>mirror?canvas.width-x:x;
 if(get(5).score<0.15 && get(6).score<0.15) return false;
 ctx.save();
 ctx.strokeStyle='#00ff66'; ctx.fillStyle='#00ff66'; ctx.lineWidth=7;
 ctx.shadowBlur=16; ctx.shadowColor='#00ff66'; ctx.lineCap='round'; ctx.lineJoin='round';
 const lines=[[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16],[0,5],[0,6]];
 lines.forEach(([i,j])=>{
  const a=get(i), b=get(j);
  if(a.score>0.15 && b.score>0.15){ ctx.beginPath(); ctx.moveTo(tx(a.x),a.y); ctx.lineTo(tx(b.x),b.y); ctx.stroke(); }
 });
 const h=get(0); if(h.score>0.15){ ctx.beginPath(); ctx.arc(tx(h.x),h.y,11,0,Math.PI*2); ctx.fill(); }
 ctx.restore(); return true;
}

function playWhisper(){
 if(!audioContext ||!whisperGain) return;
 const now=audioContext.currentTime;
 const osc=audioContext.createOscillator();
 const gain=audioContext.createGain();
 const filter=audioContext.createBiquadFilter();
 filter.type='bandpass'; filter.frequency.value=800+Math.random()*1200;
 osc.frequency.value=90+Math.random()*60;
 gain.gain.setValueAtTime(0,now);
 gain.gain.linearRampToValueAtTime(0.04+distortion*0.08,now+0.3);
 gain.gain.linearRampToValueAtTime(0,now+1.2+Math.random());
 osc.connect(filter); filter.connect(gain); gain.connect(whisperGain);
 osc.start(now); osc.stop(now+1.5);
}

async function startCamera(facing){
 if(currentStream) currentStream.getTracks().forEach(t=>t.stop());
 currentFacing=facing;
 const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:1280,height:720}, audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
 currentStream=stream; video.srcObject=stream; videoTrack=stream.getVideoTracks()[0]; audioStream=stream;
 await new Promise(r=>video.onloadedmetadata=r);
 canvas.width=video.videoWidth; canvas.height=video.videoHeight;
 canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
 try{
  if(audioContext) await audioContext.close();
  audioContext=new (window.AudioContext||window.webkitAudioContext)();
  const src=audioContext.createMediaStreamSource(stream);
  analyser=audioContext.createAnalyser(); analyser.fftSize=512; src.connect(analyser);
  whisperGain=audioContext.createGain(); whisperGain.gain.value=0.7; whisperGain.connect(audioContext.destination);
 }catch{}
}

async function switchCam(){ await startCamera(currentFacing==='environment'?'user':'environment'); }

async function init(){
 await startCamera('environment');
 document.getElementById('zoom').addEventListener('input', async e=>{
  const z=parseFloat(e.target.value);
  document.getElementById('zoomVal').innerText=z.toFixed(1)+'x';
  try{ await videoTrack.applyConstraints({advanced:[{zoom:z}]}); }catch{ video.style.transform=`scale(${z})`; }
 });
 await tf.setBackend('webgl'); await tf.ready();
 detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING});
 document.getElementById('log').innerText='VISION ACTIVA';
 loop();
}

function drawWatermark(){
 ctx.save(); ctx.globalAlpha=isRec?0.85:0.32; ctx.fillStyle='#fff';
 ctx.font=`${Math.round(canvas.width*0.022)}px monospace`; ctx.textAlign='right';
 ctx.fillText('archiviax.com.ar', canvas.width-25, canvas.height-28); ctx.restore();
}

function applyDistortion(){
 if(distortion>0){
  const wobble=Math.sin(Date.now()*0.005)*distortion*8;
  canvas.style.filter=`blur(${distortion*1.2}px) contrast(${1+distortion}) hue-rotate(${wobble}deg)`;
  video.style.filter=`blur(${distortion*0.8}px) contrast(${1+distortion*0.3})`;
 } else { canvas.style.filter='none'; video.style.filter='contrast(1.1)'; }
}

async function loop(){
 const isMirror=currentFacing==='user';
 const poses=await detector.estimatePoses(video,{flipHorizontal:isMirror});
 ctx.clearRect(0,0,canvas.width,canvas.height);
 let detected=false;
 if(poses[0]){
  const kp=poses[0].keypoints;
  if(Math.max(kp[0].score,kp[5].score,kp[6].score)>0.15){
   if(drawReal(kp,isMirror)){ detected=true; distortion=Math.max(0,distortion-0.02); }
  }
 }
 if(analyser){
  const data=new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(data);
  const vol=data.reduce((a,b)=>a+b,0)/data.length;
  if(!detected){
   distortion=Math.min(1, distortion+vol/400);
   if(Date.now()-whisperTimer>1200+Math.random()*2000 && vol>20){
    playWhisper(); whisperTimer=Date.now();
    if(Math.random()>0.7) setTimeout(playWhisper, 300);
   }
   document.getElementById('log').innerText= vol>35? `RUIDO - ${vol.toFixed(0)}dB` : 'ESCANEANDO...';
  } else { document.getElementById('log').innerText='PERSONA DETECTADA'; }
 }
 applyDistortion();
 drawWatermark();
 requestAnimationFrame(loop);
}

function toggleRec(){
 if(!isRec){
  const cs=canvas.captureStream(30);
  const combined=new MediaStream([...cs.getVideoTracks(),...audioStream.getAudioTracks()]);
  chunks=[]; const rec=new MediaRecorder(combined,{mimeType:'video/webm'});
  window.recorder=rec;
  rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
  rec.onstop=()=>{const b=new Blob(chunks,{type:'video/webm'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`ARCHIVAX-${Date.now()}.webm`;a.click();};
  rec.start(); isRec=true; document.getElementById('rec').classList.add('on');
 } else { window.recorder.stop(); isRec=false; document.getElementById('rec').classList.remove('on'); }
}
init();
</script>
</body>
</html>
