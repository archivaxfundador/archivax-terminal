<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ARCHIVAX TESLA VISION V2</title>
<style>
body{margin:0;background:#000;overflow:hidden}
#video{position:absolute;width:100%;height:100%;object-fit:cover;filter:brightness(0.4) contrast(1.5)}
#canvas{position:absolute;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;padding:15px;font-family:monospace;color:#fff;z-index:10;
background:linear-gradient(to bottom, rgba(0,0,0,0.9), transparent)}
#bottom{position:absolute;bottom:0;left:0;right:0;padding:15px;background:#0a0a0a;display:flex;justify-content:space-between;align-items:center}
.dot{width:10px;height:10px;background:red;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3"></script>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="hud">
  <div style="font-size:12px;opacity:0.7">ARCHIVAX // TESLA VISION SYSTEM // 23:33 • 24°C</div>
  <div id="log" style="margin-top:10px;font-size:14px">INICIALIZANDO RED NEURONAL...</div>
</div>
<div id="bottom">
  <div style="display:flex;gap:10px;align-items:center">
    <div class="dot"></div><span style="color:#fff;font-family:monospace;font-size:12px">REC • CAMINO VACIO</span>
  </div>
  <div id="count" style="color:#fff;font-family:monospace">0 ENTIDADES</div>
</div>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const log=document.getElementById('log');
let detector;

async function init(){
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:1280,height:720}});
  video.srcObject=stream;
  await new Promise(r=>video.onloadedmetadata=r);
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  // Modelo de esqueleto completo como Tesla
  detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING});
  log.innerText='SISTEMA TESLA ACTIVO - BUSCANDO...';
  loop();
}

function drawTeslaPerson(keypoints,x,y,scale){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  ctx.shadowBlur=15; ctx.shadowColor='rgba(255,255,255,0.8)';
  ctx.fillStyle='rgba(220,220,220,0.95)';
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=6; ctx.lineCap='round';

  // Cabeza
  ctx.beginPath(); ctx.arc(0,-80,18,0,Math.PI*2); ctx.fill();
  // Tronco
  ctx.beginPath(); ctx.moveTo(0,-60); ctx.lineTo(0,20); ctx.stroke();
  // Brazos
  ctx.beginPath(); ctx.moveTo(0,-50); ctx.lineTo(-25,-20); ctx.lineTo(-35,10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-50); ctx.lineTo(25,-20); ctx.lineTo(35,10); ctx.stroke();
  // Piernas (con animación de caminar)
  const walk=Math.sin(Date.now()/200)*15;
  ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(-15+walk,70); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(15-walk,70); ctx.stroke();

  ctx.restore();

  // Sombra roja debajo como en Tesla
  ctx.fillStyle='rgba(255,30,30,0.6)';
  ctx.fillRect(x-30,y+65,60,4);
}

async function loop(){
  const poses=await detector.estimatePoses(video,{flipHorizontal:false});
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(poses.length>0 && poses[0].keypoints){
    const kp=poses[0].keypoints;
    // Centro del cuerpo
    const cx=kp[5].x; const cy=kp[5].y;
    drawTeslaPerson(kp,cx,cy,1.5);
    log.innerText=`ENTIDAD DETECTADA - CONFIANZA ${Math.round(kp[0].score*100)}%`;
    document.getElementById('count').innerText=`1 ENTIDAD • DISTANCIA 4.2m`;
  } else {
    // Falso positivo estilo cementerio Tesla - aparece persona donde no hay nada
    if(Math.random()>0.985){
      const rx=Math.random()*canvas.width*0.6+canvas.width*0.2;
      const ry=canvas.height*0.3+Math.random()*canvas.height*0.4;
      drawTeslaPerson([],rx,ry,1.2+Math.random());
      log.innerText='⚠ VISUALIZACION AUTONOMA - OBJETO NO VISIBLE EN CAMARA';
      document.getElementById('count').innerText=`1 ENTIDAD • ORIGEN DESCONOCIDO`;
    } else {
      log.innerText='CAMINO LIBRE - ESCANEANDO ENTORNO...';
      document.getElementById('count').innerText=`0 ENTIDADES`;
    }
  }
  requestAnimationFrame(loop);
}
init();
</script>
</body>
</html>
