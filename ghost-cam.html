<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ARCHIVAX VISION SYSTEM</title>
<style>
body{margin:0;background:#000;overflow:hidden}
#video{position:absolute;width:100%;height:100%;object-fit:cover}
#canvas{position:absolute;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;padding:14px;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);font-family:monospace}
#rec{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:#ff1e1e;border:3px solid #fff;z-index:20}
#rec.on{background:#fff;box-shadow:0 0 20px red}
</style>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3"></script>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="hud">
<div style="color:rgba(255,255,255,.5);font-size:10px;letter-spacing:1px">ARCHIVAX VISION SYSTEM</div>
<div id="log" style="color:#fff;font-size:12px;margin-top:6px">INICIANDO CAMARA + IA...</div>
</div>
<button id="rec" onclick="toggleRec()"></button>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let detector, entities=[], W,H;

class Ghost{
 constructor(x,y,scale){
  this.x=x; this.y=y; this.scale=scale; this.phase=Math.random()*5;
  this.start=Date.now(); this.life=8000+Math.random()*2000;
  this.speed=0.7; this.dir=(Math.random()-0.5)*0.6;
 }
 alive(){ return Date.now()-this.start < this.life; }
 alpha(){ const r=this.life-(Date.now()-this.start); return r<1000? r/1000 : 1; }
 update(){ this.phase+=0.11; this.x+=this.dir; this.y-=0.15; }
 draw(){
  const a=this.alpha(); if(a<=0) return;
  ctx.save(); ctx.translate(this.x,this.y); ctx.scale(this.scale,this.scale); ctx.globalAlpha=a;
  ctx.shadowBlur=15; ctx.shadowColor='#fff'; ctx.fillStyle='#e9e1d6'; ctx.strokeStyle='#e9e1d6';
  ctx.lineWidth=9; ctx.lineCap='round'; ctx.lineJoin='round';
  const swing=Math.sin(this.phase);
  const lX=swing<0?-5:-5+swing*16; const lY=swing<0?32:32-Math.abs(swing)*10;
  const rX=swing>=0?5:5+Math.sin(this.phase+Math.PI)*16; const rY=swing>=0?32:32-Math.abs(Math.sin(this.phase+Math.PI))*10;
  ctx.beginPath(); ctx.arc(0,-36,7.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-6.5,-27,13,20,5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-4.5,-21); ctx.lineTo(-9+swing*2,-9); ctx.lineTo(-10+swing*2,2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4.5,-21); ctx.lineTo(9-swing*2,-9); ctx.lineTo(10-swing*2,2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2.5,-8); ctx.lineTo(lX*0.5,8); ctx.lineTo(lX,lY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2.5,-8); ctx.lineTo(rX*0.5,8); ctx.lineTo(rX,rY); ctx.stroke();
  ctx.restore();
  ctx.globalAlpha=a*0.6; ctx.fillStyle='#ff1e1e'; ctx.fillRect(this.x-18*this.scale,this.y+30*this.scale,36*this.scale,3);
 }
}

async function init(){
 const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:1280,height:720}});
 video.srcObject=stream; await new Promise(r=>video.onloadedmetadata=r);
 W=canvas.width=video.videoWidth; H=canvas.height=video.videoHeight;
 canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
 detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,enableTracking:true});
 document.getElementById('log').innerText='CAMARA ACTIVA - ESPERANDO DETECCION';
 loop();
}

async function loop(){
 const poses=await detector.estimatePoses(video,{maxPoses:5,flipHorizontal:false});
 ctx.clearRect(0,0,W,H);

 // SOLO cuando IA detecta persona real, crea fantasma Tesla en esa posicion
 poses.forEach(p=>{
  if(p.keypoints[0].score>0.35){
   const kx=p.keypoints[0].x; const ky=p.keypoints[11].y || p.keypoints[0].y+80;
   // No duplicar si ya hay uno cerca
   if(!entities.find(e=>Math.abs(e.x-kx)<60 && e.alive())){
    entities.push(new Ghost(kx,ky,1.1));
   }
  }
 });

 // Dibujar y mantener 8-10 seg caminando
 entities=entities.filter(e=>e.alive());
 entities.forEach(e=>{ e.update(); e.draw(); });

 document.getElementById('log').innerText= entities.length? `${entities.length} ENTIDAD${entities.length>1?'ES':''} DETECTADA - ${entities.length===1?'8-10 SEG':''}` : 'SIN DETECCION - MOVER CAMARA LENTO';
 requestAnimationFrame(loop);
}

// Grabacion
let recorder,chunks=[],isRec=false;
function toggleRec(){
 if(!isRec){
  const s=new MediaStream([...canvas.captureStream(30).getTracks(),...video.srcObject.getTracks()]);
  chunks=[]; recorder=new MediaRecorder(s,{mimeType:'video/webm'});
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{const b=new Blob(chunks,{type:'video/webm'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`VISION-SYSTEM-${Date.now()}.webm`;a.click();};
  recorder.start(); isRec=true; document.getElementById('rec').classList.add('on');
 } else {recorder.stop(); isRec=false; document.getElementById('rec').classList.remove('on');}
}
init();
</script>
</body>
</html>
