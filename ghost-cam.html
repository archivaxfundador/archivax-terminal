<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHIVAX TESLA GHOST</title>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:monospace;color:#0f0}
#video{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0.4}
#canvas{position:absolute;width:100%;height:100%}
#ui{position:absolute;bottom:20px;left:10px;z-index:10}
button{background:#111;color:#0f0;border:1px solid #0f0;padding:10px 20px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.1.0"></script>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="ui">
  <div>ARCHIVAX // TESLA VISION GHOST MODE</div>
  <div id="status">INICIANDO IA...</div>
  <button onclick="toggleNight()">MODO NOCHE TESLA</button>
</div>
<script>
let video=document.getElementById('video');
let canvas=document.getElementById('canvas');
let ctx=canvas.getContext('2d');
let model; let nightMode=true;
async function init(){
  let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  video.srcObject=stream;
  await video.play();
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  model=await cocoSsd.load();
  document.getElementById('status').innerText='SCANEANDO...';
  detect();
}
async function detect(){
  let predictions=await model.detect(video);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // efecto oscuro como Tesla
  if(nightMode){
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  predictions.forEach(p=>{
    if(p.class==='person' && p.score>0.3){
      // dibuja como fantasma Tesla
      let [x,y,w,h]=p.bbox;
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.shadowBlur=20; ctx.shadowColor='#fff';
      // silueta tipo Tesla
      ctx.beginPath();
      ctx.ellipse(x+w/2,y+h/3,w/3,h/6,0,0,Math.PI*2); ctx.fill(); // cabeza
      ctx.fillRect(x+w/2-w/6,y+h/3,w/3,h*0.6); // cuerpo
      ctx.fillStyle='#ff0000'; ctx.fillRect(x,y+h-5,w,3); // base roja Tesla
      document.getElementById('status').innerText=`ENTIDAD DETECTADA: ${Math.round(p.score*100)}%`;
    }
  });
  // Simula falsos positivos estilo Tesla (como en cementerio)
  if(nightMode && Math.random()>0.97){
    let x=Math.random()*canvas.width, y=Math.random()*canvas.height;
    ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.beginPath();
    ctx.ellipse(x,y,30,80,0,0,Math.PI*2); ctx.fill();
    document.getElementById('status').innerText='ANOMALIA TESLA // SIN ORIGEN VISIBLE';
  }
  requestAnimationFrame(detect);
}
function toggleNight(){nightMode=!nightMode}
init();
</script>
</body>
</html>
