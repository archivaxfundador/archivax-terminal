<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLS Ghost Camera & EVP Scanner</title>
<!-- Librerías SLS reales -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
<style>
body { background-color: #050505; color: #00ff00; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
.container { text-align: center; background: #111; border: 3px solid #333; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
h2 { margin: 0 0 10px 0; font-size: 1.2rem; letter-spacing: 2px; text-shadow: 0 0 5px #00ff00; }
#canvas-holder { position: relative; border: 3px solid #00ff00; background-color: #000; width: 640px; height: 480px; margin: 0 auto; border-radius: 8px; box-shadow: inset 0 0 20px rgba(0,255,0,0.2); max-width:90vw; }
.hud-overlay { position: absolute; top: 15px; left: 15px; text-align: left; pointer-events: none; font-weight: bold; font-size: 0.9rem; z-index: 10; }
.anomaly-alert { position: absolute; top: 15px; right: 15px; background: rgba(255, 0, 0, 0.2); border: 1px solid #ff0000; color: #ff3333; padding: 5px 10px; font-size: 0.8rem; border-radius: 5px; display: none; animation: blink 0.5s infinite alternate; z-index: 10; }
@keyframes blink { from { opacity: 1; } to { opacity: 0.4; } }
.controls { margin-top: 15px; display: flex; justify-content: center; gap: 15px; }
button { background: #222; color: #00ff00; border: 2px solid #00ff00; padding: 10px 20px; font-size: 0.9rem; font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; box-shadow: 0 3px 0 #005500; transition: all 0.1s ease; }
button:active { transform: translateY(2px); box-shadow: none; }
button.recording { color: #ffffff; background: #ff0000; border-color: #ff3333; box-shadow: 0 3px 0 #550000; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.03); } }
#status-msg { margin-top: 10px; font-size: 0.8rem; color: #888; }
</style>
</head>
<body>
<div class="container">
<h2>SLS KINECT SENSOR & EVP SCANNER</h2>
<div id="canvas-holder">
<div class="hud-overlay"> SYS STATUS: ONLINE<br> AUDIO GATE: ACCUMULATING... </div>
<div class="anomaly-alert" id="alert-ui">⚠️ AUDIO ANOMALY DETECTED</div>
</div>
<div class="controls">
<button id="rec-btn">Iniciar Grabación EVP</button>
</div>
<div id="status-msg">Cargando sensores de mapeo neuronal... Por favor espera.</div>
</div>

<button onclick="location.href='menu.html'" style="margin-top:20px;background:#000;color:#888;border:1px solid #333;font-size:10px;letter-spacing:2px;padding:10px 20px;cursor:pointer;font-family:monospace">◀ VOLVER AL MENU</button>

<script>
let video;
let bodyPose;
let poses = [];
let audioContext;
let analyser;
let microphoneStream;
let mediaRecorder;
let audioChunks = [];
let isRecording = false;
let noiseThreshold = 45;
let statusMsg = document.getElementById('status-msg');
let alertUi = document.getElementById('alert-ui');
let recBtn = document.getElementById('rec-btn');

function preload() {
bodyPose = ml5.bodyPose("BlazePose", { flipped: true });
}
function setup() {
let canvas = createCanvas(640, 480);
canvas.parent('canvas-holder');
video = createCapture(VIDEO);
video.size(640, 480);
video.hide();
bodyPose.detectStart(video, gotPoses);
statusMsg.innerText = "Sistema de mapeo listo. Haz clic en la pantalla para activar el sensor de Audio.";
userStartAudio().then(() => { initAudioAnalysis(); });
}
function draw() {
background(15, 15, 18);
tint(0, 255, 0, 25);
image(video, 0, 0, width, height);
noTint();
if (analyser) {
let dataArray = new Uint8Array(analyser.frequencyBinCount);
analyser.getByteFrequencyData(dataArray);
let totalVolume = 0;
for (let i = 0; i < dataArray.length; i++) { totalVolume += dataArray[i]; }
let averageVolume = totalVolume / dataArray.length;
if (averageVolume > noiseThreshold) { alertUi.style.display = "block"; } else { alertUi.style.display = "none"; }
}
if (poses.length > 0) {
for (let i = 0; i < poses.length; i++) {
let pose = poses[i];
stroke(0, 255, 0);
strokeWeight(4);
drawBone(pose, "left_shoulder", "right_shoulder");
drawBone(pose, "left_shoulder", "left_elbow");
drawBone(pose, "left_elbow", "left_wrist");
drawBone(pose, "right_shoulder", "right_elbow");
drawBone(pose, "right_elbow", "right_wrist");
drawBone(pose, "left_shoulder", "left_hip");
drawBone(pose, "right_shoulder", "right_hip");
drawBone(pose, "left_hip", "right_hip");
drawBone(pose, "left_hip", "left_knee");
drawBone(pose, "left_knee", "left_ankle");
drawBone(pose, "right_hip", "right_knee");
drawBone(pose, "right_knee", "right_ankle");
for (let j = 0; j < pose.keypoints.length; j++) {
let keypoint = pose.keypoints[j];
if (keypoint.confidence > 0.4) {
fill(255, 200, 0);
noStroke();
circle(keypoint.x, keypoint.y, 12);
}
}
}
}
}
function drawBone(pose, partA, partB) {
let kpA = pose[partA];
let kpB = pose[partB];
if (kpA && kpB && kpA.confidence > 0.4 && kpB.confidence > 0.4) {
line(kpA.x, kpA.y, kpB.x, kpB.y);
}
}
function gotPoses(results) { poses = results; }
async function initAudioAnalysis() {
try {
const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
microphoneStream = stream;
audioContext = new (window.AudioContext || window.webkitAudioContext)();
const source = audioContext.createMediaStreamSource(stream);
analyser = audioContext.createAnalyser();
analyser.fftSize = 256;
source.connect(analyser);
statusMsg.innerText = "Sensores ópticos y micrófono EVP sincronizados.";
recBtn.addEventListener('click', toggleRecording);
} catch (err) {
statusMsg.innerText = "Error: Permiso de micrófono denegado o no disponible.";
console.error(err);
}
}
function toggleRecording() {
if (!microphoneStream) return;
if (!isRecording) {
isRecording = true;
recBtn.innerText = "Detener y Guardar Audio";
recBtn.classList.add('recording');
statusMsg.innerText = "🔴 GRABANDO SESIÓN EVP... Mantén silencio para oír fluctuaciones.";
audioChunks = [];
mediaRecorder = new MediaRecorder(microphoneStream);
mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) audioChunks.push(event.data); };
mediaRecorder.onstop = () => {
const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
const audioUrl = URL.createObjectURL(audioBlob);
const link = document.createElement('a');
link.href = audioUrl;
link.download = `EVP_SLS_Sesion_${Date.now()}.wav`;
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
statusMsg.innerText = "Sesión guardada exitosamente en tus descargas.";
};
mediaRecorder.start();
} else {
isRecording = false;
recBtn.innerText = "Iniciar Grabación EVP";
recBtn.classList.remove('recording');
mediaRecorder.stop();
}
}
</script>
</body>
</html>
