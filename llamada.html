<script>
const VOZ_URL = "https://yxfzvogiladjupikgqyt.supabase.co/functions/v1/voz";
const SUPABASE_KEY = "sb_publishable_a1vTW1SY3abxVyn2qFDNlA_K_n3xgOc";

async function hablar(texto, tipo) {
  const res = await fetch(VOZ_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    },
    body: JSON.stringify({ texto, tipo })
  });

  if (!res.ok) {
    alert("Error voz: " + await res.text());
    return;
  }

  const blob = await res.blob();
  const audio = new Audio(URL.createObjectURL(blob));
  audio.play();
}

</script>
